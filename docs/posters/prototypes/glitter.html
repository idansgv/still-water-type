<title>Glitter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@200..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed night poster, the name as the only water on the page; a quiet mono line at the foot; a settings sheet for this test only. One visual world: black. */
:root {
  --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev as the only water on a black page. A moon follows the pointer, and the letters appear as glitter where its light catches the ripples."></canvas>
<div class="foot"><span><b>Glitter</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row" for="height"><span>Moon height (glitter reach)</span><output id="heightO"></output><input type="range" id="height" min="0.1" max="2" step="0.02" value="1.42"></label>
  <label class="row" for="moon"><span>Moonlight</span><output id="moonO"></output><input type="range" id="moon" min="0.2" max="4" step="0.05" value="2.7"></label>
  <label class="row" for="grain"><span>Glints (sparse ↔ dense)</span><output id="grainO"></output><input type="range" id="grain" min="0.05" max="3" step="0.05" value="0.65"></label>
  <label class="row" for="rough"><span>Ripples from a move</span><output id="roughO"></output><input type="range" id="rough" min="0.1" max="3" step="0.05" value="2.45"></label>
  <label class="row" for="last"><span>How long ripples last (s)</span><output id="lastO"></output><input type="range" id="last" min="0.5" max="10" step="0.1" value="3.8"></label>
  <label class="row" for="bloom"><span>Bloom</span><output id="bloomO"></output><input type="range" id="bloom" min="0" max="3" step="0.05" value="0.7"></label>
  <label class="row" for="rest"><span>The name, seen at rest</span><output id="restO"></output><input type="range" id="rest" min="0" max="0.15" step="0.005" value="0"></label>
  <label class="row" for="weight"><span>Type weight</span><output id="weightO"></output><input type="range" id="weight" min="300" max="900" step="10" value="700"></label>
  <div class="acts"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { document.querySelector('.foot span').textContent = 'This needs WebGL2.'; return; }
  const $ = (id) => document.getElementById(id);
  const DEF = { height: 1.42, moon: 2.7, grain: 0.65, rough: 2.45, last: 3.8, bloom: 0.7, rest: 0, weight: 700 };
  const P = { ...DEF };
  try { Object.assign(P, JSON.parse(localStorage.getItem('glitter-2') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('glitter-2', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const floatOK = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));

  const VS = `#version 300 es
  void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const NOISE = `
  float ihash(vec2 p) { uvec2 q = uvec2(ivec2(floor(p)) + 65536) * uvec2(1597334673u, 3812015801u); uint n = (q.x ^ q.y) * 1597334673u; return float(n >> 8) / 16777216.0; }
  float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }`;

  // the wind: moves leave a wake of ripples that spreads a little and dies away
  const SIM = `#version 300 es
  precision highp float;
  uniform sampler2D uPrev; uniform vec2 uSimRes, uCss; uniform float uDecay;
  uniform vec4 uP[8]; uniform int uNP;
  out vec4 o;
  void main() {
    vec2 uv = gl_FragCoord.xy / uSimRes, px = 1.0 / uSimRes, x = uv * uCss;
    float c = texture(uPrev, uv).r;
    float nb = 0.25 * (texture(uPrev, uv + vec2(px.x, 0)).r + texture(uPrev, uv - vec2(px.x, 0)).r + texture(uPrev, uv + vec2(0, px.y)).r + texture(uPrev, uv - vec2(0, px.y)).r);
    float E = max(0.0, mix(c, nb, 0.15) * uDecay - 0.0008);
    for (int i = 0; i < 8; i++) { if (i >= uNP) break; vec2 d = x - uP[i].xy; E += uP[i].w * exp(-dot(d, d) / (uP[i].z * uP[i].z)); }
    o = vec4(min(E, 1.5), 0.0, 0.0, 1.0);
  }`;

  const NW = 24;
  // the letters are water seen from straight above; the moon is a small light above the page.
  // Ripples too fine for a pixel become roughness; the glints are a Poisson draw per pixel.
  const SCENE = `#version 300 es
  precision highp float;
  uniform sampler2D uWind, uMask; uniform vec2 uRes, uCss; uniform vec3 uLight; uniform float uT, uMoon, uGrain, uGale, uSwell, uRest, uLR, uFlick, uRough;
  uniform vec4 uWa[${NW}]; uniform vec2 uWb[${NW}];
  out vec4 o;
  ${NOISE}
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes, p = uv * uCss;
    float m = texture(uMask, uv).r;
    if (m < 0.002) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
    float E = 1.0 - exp(-2.5 * texture(uWind, uv).r * (0.6 + 0.8 * vnoise(p * 0.02 + uT * 0.3))) + uGale;
    vec2 sl = vec2(0.0);
    for (int i = 0; i < ${NW}; i++) {
      vec4 a = uWa[i]; vec2 b = uWb[i]; float k = length(a.xy);
      float amp = b.x * (b.y < 60.0 ? E : uSwell) * uRough;
      sl += amp * cos(dot(a.xy, p) - a.z * uT + a.w) * a.xy / k;
    }
    float s2 = 0.00025 + 0.045 * E * uRough + uLR * uLR;
    vec3 n = normalize(vec3(-sl, 1.0)), V = vec3(0.0, 0.0, 1.0);
    vec3 L = normalize(uLight - vec3(p, 0.0)), H = normalize(L + V);
    vec2 d = H.xy / H.z - n.xy / n.z;
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(H, V), 0.0), 5.0);
    float Es = uMoon * 30.0 * (0.3 + F) * exp(-dot(d, d) / s2) * pow(uLR * uLR / s2, 0.4);
    float lam = Es * uGrain, g = Es;
    if (lam < 6.0) {
      float slot = floor(uT * uFlick + ihash(gl_FragCoord.xy) * 17.0);
      float u = ihash(gl_FragCoord.xy + vec2(slot * 37.0, slot * 11.0)), pr = exp(-lam), cdf = pr, nn = 0.0;
      for (int k = 1; k < 8; k++) { if (u < cdf) break; nn += 1.0; pr *= lam / nn; cdf += pr; }
      g = Es * nn / max(lam, 1e-6);
    }
    float c = (uRest + g) * m;
    o = vec4(c, c, c, 1.0);
  }`;

  const BRIGHT = `#version 300 es
  precision highp float; uniform sampler2D uSrc; uniform vec2 uTex; out vec4 o;
  void main() { vec2 uv = gl_FragCoord.xy * uTex; float c = 0.0;
    for (int i = 0; i < 4; i++) { vec2 off = vec2(float(i & 1), float(i >> 1)) - 0.5; c += texture(uSrc, uv + off * uTex * 0.5).r; }
    c *= 0.25; o = vec4(vec3(max(c - 0.3, 0.0)), 1.0); }`;
  const BLUR = `#version 300 es
  precision highp float; uniform sampler2D uSrc; uniform vec2 uTex, uDir; out vec4 o;
  void main() { vec2 uv = gl_FragCoord.xy * uTex; float c = 0.0, wsum = 0.0;
    for (int i = -6; i <= 6; i++) { float w = exp(-float(i * i) / 18.0); c += w * texture(uSrc, uv + uDir * uTex * float(i) * 1.5).r; wsum += w; }
    o = vec4(vec3(c / wsum), 1.0); }`;
  const COMP = `#version 300 es
  precision highp float; uniform sampler2D uSrc, uBloom; uniform vec2 uRes; uniform float uBloomK, uT; out vec4 o;
  ${NOISE}
  void main() { vec2 uv = gl_FragCoord.xy / uRes;
    float c = texture(uSrc, uv).r + uBloomK * texture(uBloom, uv).r;
    c = 1.0 - exp(-c * 1.6);
    c += (hash(gl_FragCoord.xy + fract(uT) * 91.0) - 0.5) / 255.0;
    o = vec4(vec3(c), 1.0); }`;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = (fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, name); }
    return { p, u }; };
  const simP = prog(SIM), sceneP = prog(SCENE), brightP = prog(BRIGHT), blurP = prog(BLUR), compP = prog(COMP);
  gl.bindVertexArray(gl.createVertexArray());

  // ripples: 3 to 240 css px, all directions (wind from no side in particular); gravity-capillary dispersion in px units
  const rnd = (() => { let a = 5; return () => ((a = (a * 16807) % 2147483647) / 2147483647); })();
  const WA = new Float32Array(NW * 4), WB = new Float32Array(NW * 2);
  for (let i = 0; i < NW; i++) {
    const t = i / (NW - 1), lam = 3 * Math.pow(240 / 3, t), k = 6.2832 / lam, a = rnd() * 6.2832;
    WA.set([Math.cos(a) * k, Math.sin(a) * k, Math.sqrt(75 * k + 120 * k * k * k), rnd() * 6.283], i * 4);
    WB.set([(lam < 60 ? 0.07 : 0.05) * (0.8 + rnd() * 0.4), lam], i * 2);
  }

  const target = (w, h, float) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    if (float && floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return { t, f, w, h }; };
  const free = (x) => { if (x) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); } };

  // the name: Idan over Segev, fitted like the other posters
  const mc = document.createElement('canvas'), mx = mc.getContext('2d'), maskT = gl.createTexture();
  let W = 0, H = 0, cw = 0, chh = 0, simW = 0, simH = 0, sims = [], simI = 0, sceneT, bA, bB;
  const buildMask = () => {
    mc.width = W; mc.height = H; mx.fillStyle = '#000'; mx.fillRect(0, 0, W, H);
    const font = (s) => `${P.weight} ${s}px Bitter, Georgia, serif`;
    mx.font = font(100);
    const a = mx.measureText('Idan'), b = mx.measureText('Segev'), lead = 92;
    const blockH = a.actualBoundingBoxAscent + lead + b.actualBoundingBoxDescent, blockW = Math.max(a.width, b.width);
    const m = Math.max(24, Math.min(W, H) * 0.07), foot = 48;
    const s = Math.min((W - 2 * m) / blockW, (H - 2 * m - foot) / blockH) * 100;
    mx.font = font(s); mx.fillStyle = '#fff'; mx.textAlign = 'center';
    const top = (H - foot - blockH * s / 100) / 2 + a.actualBoundingBoxAscent * s / 100;
    mx.fillText('Idan', W / 2, top); mx.fillText('Segev', W / 2, top + lead * s / 100);
    gl.bindTexture(gl.TEXTURE_2D, maskT); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, mc); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };
  const resize = () => {
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    const dpr = Math.min(devicePixelRatio || 1, 2, Math.sqrt(3e6 / (W * H)));
    cw = cv.width = Math.round(W * dpr); chh = cv.height = Math.round(H * dpr);
    simW = Math.max(64, Math.round(W / 4)); simH = Math.max(64, Math.round(H / 4));
    [sceneT, bA, bB].forEach(free); sims.forEach(free);
    sceneT = target(cw, chh, true);
    bA = target(Math.max(1, cw >> 2), Math.max(1, chh >> 2), true); bB = target(Math.max(1, cw >> 2), Math.max(1, chh >> 2), true);
    sims = [target(simW, simH, true), target(simW, simH, true)];
    buildMask();
  };

  // the moon follows the pointer; moves leave ripples
  const moon = { x: 0, y: 0, tx: 0, ty: 0, lift: 0 };
  let puffs = [], Eg = 0, gale = 0, calm = 0, rise = 0;
  const wake = (x, y, str, rad) => { puffs.push([x, H - y, rad, str]); Eg = Math.min(1, Eg + str * 0.03); };
  let demo = !reduced, demoT = 0;
  let down = null, last = null, taps = [], tapTimer = 0;
  cv.addEventListener('pointerdown', (e) => {
    demo = false; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ }
    moon.tx = e.clientX; moon.ty = e.clientY;
    down = { x: e.clientX, y: e.clientY, t: performance.now(), far: 0 }; last = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  cv.addEventListener('pointermove', (e) => {
    const now = performance.now();
    if (e.pointerType !== 'mouse' && !down) return;
    demo = false; moon.tx = e.clientX; moon.ty = e.clientY;
    if (down) down.far = Math.max(down.far, Math.hypot(e.clientX - down.x, e.clientY - down.y));
    if (!last) { last = { x: e.clientX, y: e.clientY, t: now }; return; }
    const dx = e.clientX - last.x, dy = e.clientY - last.y, d = Math.hypot(dx, dy), dt = Math.max(8, now - last.t);
    if (d < 2) return;
    const str = Math.min(0.5, (d / dt) * 0.1) * (reduced ? 0.5 : 1);
    wake(e.clientX, e.clientY, str, 70);
    last = { x: e.clientX, y: e.clientY, t: now };
  });
  const up = (e) => {
    if (!down) return;
    const now = performance.now(), quick = now - down.t < 250 && down.far < 8;
    if (quick) {
      taps = taps.filter((t) => now - t < 760); taps.push(now);
      const n = taps.length; clearTimeout(tapTimer);
      if (n === 1) wake(e.clientX, e.clientY, 0.9, 90);
      else if (n === 2) tapTimer = setTimeout(() => { calm = 1.2; taps = []; }, 380);
      else { taps = []; rise = 2.6; }                       // reveal: the moon climbs high and a breeze crosses every letter
    }
    down = null; if (e.pointerType !== 'mouse') last = null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  const pass = (p, tgt, w, h) => { gl.bindFramebuffer(gl.FRAMEBUFFER, tgt ? tgt.f : null); gl.viewport(0, 0, w, h); gl.useProgram(p.p); };
  const bindT = (unit, t, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); };

  let prev = performance.now(), t = 0, started = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now; t += dt;
    if (!started) { started = now; moon.x = moon.tx = W * 0.5; moon.y = moon.ty = H * 0.2; }
    // the self-demo: the moon crosses once, low, trailing a breeze, then rests high above the middle
    if (demo && now - started > 700) {
      demoT += dt; const f = demoT / 3.2;
      if (f > 1) { demo = false; moon.tx = W * 0.5; moon.ty = -H * 0.6; }
      else { moon.tx = W * (0.08 + 0.84 * f); moon.ty = H * (0.42 + 0.1 * Math.sin(f * 5)); wake(moon.tx, moon.ty + 30, 0.06, 120); }
    }
    const k = 1 - Math.exp(-dt * 10); moon.x += (moon.tx - moon.x) * k; moon.y += (moon.ty - moon.y) * k;
    const holding = down && now - down.t > 250 && down.far < 24;
    gale = holding ? Math.min(1, gale + dt / 3) : Math.max(0, gale - dt / 2);
    if (calm > 0) { calm -= dt; gale = 0; }
    if (rise > 0) { rise -= dt; }
    const lift = rise > 0 ? Math.sin(Math.min(1, (2.6 - rise) / 2.6) * Math.PI) : 0;
    Eg *= Math.exp(-dt / P.last);

    const src = sims[simI], dst = sims[1 - simI];
    pass(simP, dst, simW, simH); bindT(0, src.t, simP.u.uPrev);
    let u = simP.u;
    gl.uniform2f(u.uSimRes, simW, simH); gl.uniform2f(u.uCss, W, H);
    gl.uniform1f(u.uDecay, calm > 0 ? Math.exp(-dt * 4) : Math.exp(-dt / P.last));
    const pp = puffs.slice(-8); puffs = []; const PA = new Float32Array(32); pp.forEach((q, i) => PA.set(q, i * 4));
    gl.uniform4fv(u.uP, PA); gl.uniform1i(u.uNP, pp.length);
    gl.drawArrays(gl.TRIANGLES, 0, 3); simI = 1 - simI;

    const h = P.height * Math.min(W, H) * (1 + 3 * lift);
    pass(sceneP, sceneT, cw, chh); u = sceneP.u;
    bindT(0, dst.t, u.uWind); bindT(1, maskT, u.uMask);
    gl.uniform2f(u.uRes, cw, chh); gl.uniform2f(u.uCss, W, H); gl.uniform3f(u.uLight, moon.x, H - moon.y, h);
    gl.uniform1f(u.uT, t); gl.uniform1f(u.uMoon, P.moon * (1 + 0.5 * lift)); gl.uniform1f(u.uGrain, P.grain);
    gl.uniform1f(u.uGale, Math.max(gale, lift * 0.6)); gl.uniform1f(u.uSwell, Math.min(1, Eg + gale + lift * 0.5) * (reduced ? 0.45 : 1));
    gl.uniform1f(u.uRest, P.rest); gl.uniform1f(u.uLR, 0.012); gl.uniform1f(u.uFlick, reduced ? 4 : 11);
    gl.uniform1f(u.uRough, P.rough * (reduced ? 0.5 : 1));
    gl.uniform4fv(u.uWa, WA); gl.uniform2fv(u.uWb, WB);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    pass(brightP, bA, bA.w, bA.h); bindT(0, sceneT.t, brightP.u.uSrc); gl.uniform2f(brightP.u.uTex, 1 / bA.w, 1 / bA.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
    pass(blurP, bB, bB.w, bB.h); bindT(0, bA.t, blurP.u.uSrc); gl.uniform2f(blurP.u.uTex, 1 / bB.w, 1 / bB.h); gl.uniform2f(blurP.u.uDir, 1, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    pass(blurP, bA, bA.w, bA.h); bindT(0, bB.t, blurP.u.uSrc); gl.uniform2f(blurP.u.uDir, 0, 1); gl.drawArrays(gl.TRIANGLES, 0, 3);
    pass(compP, null, cw, chh); bindT(0, sceneT.t, compP.u.uSrc); bindT(1, bA.t, compP.u.uBloom);
    gl.uniform2f(compP.u.uRes, cw, chh); gl.uniform1f(compP.u.uBloomK, P.bloom); gl.uniform1f(compP.u.uT, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  };

  // settings (this test only)
  const fmt = { height: 2, moon: 2, grain: 2, rough: 2, last: 1, bloom: 2, rest: 3, weight: 0 };
  const sync = () => Object.keys(fmt).forEach((k) => { $(k).value = P[k]; $(k + 'O').textContent = (+P[k]).toFixed(fmt[k]); });
  Object.keys(fmt).forEach((k) => $(k).addEventListener('input', () => { P[k] = +$(k).value; $(k + 'O').textContent = P[k].toFixed(fmt[k]); save();
    if (k === 'weight') document.fonts.load(`${P.weight} 100px Bitter`).then(buildMask, buildMask); }));
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('copy').addEventListener('click', () => { const txt = JSON.stringify(P);
    navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1200); },
      () => { $('copy').textContent = txt; }); });
  $('reset').addEventListener('click', () => { Object.assign(P, DEF); save(); sync(); buildMask(); });
  sync();

  addEventListener('resize', resize);
  (document.fonts ? document.fonts.load(`${P.weight} 100px Bitter`) : Promise.resolve()).catch(() => {}).then(() => { resize(); requestAnimationFrame(frame); });
})();
</script>
