<title>Wash script</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sacramento&family=Great+Vibes&family=Allura&family=Parisienne&family=Pinyon+Script&family=Dancing+Script:wght@400&display=swap">
<style>
/* Layout: the page is wet paper; a brush writes the name along the centre line of a script face. A quiet foot line and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>

<canvas id="c" aria-label="Idan Segev, written in wet ink with a brush along a script line. Drag to push wet water through the ink; hold to flood; double tap to blot and write it again."></canvas>
<div class="foot"><span><b>Wash script</b> &nbsp;test &nbsp;<span id="faceName"></span></span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="newFace"><span>A new face every blot</span><input type="checkbox" id="newFace" checked></label>
  <label class="row tog" for="colour"><span>Colour on your brush</span><input type="checkbox" id="colour" checked></label>
  <label class="row" for="colourAmt"><span>Colour strength</span><output id="colourAmtO"></output><input type="range" id="colourAmt" min="0.1" max="2" step="0.05" value="0.7"></label>
  <label class="row" for="brush"><span>Brush width</span><output id="brushO"></output><input type="range" id="brush" min="2" max="30" step="0.5" value="8.5"></label>
  <label class="row" for="speed"><span>Writing speed</span><output id="speedO"></output><input type="range" id="speed" min="200" max="4000" step="50" value="650"></label>
  <label class="row" for="water"><span>Water on the brush</span><output id="waterO"></output><input type="range" id="water" min="0.1" max="1" step="0.01" value="0.9"></label>
  <label class="row" for="pigment"><span>Ink on the brush</span><output id="pigmentO"></output><input type="range" id="pigment" min="0.1" max="2" step="0.01" value="0.86"></label>
  <label class="row" for="bleed"><span>Bleed</span><output id="bleedO"></output><input type="range" id="bleed" min="0" max="0.24" step="0.005" value="0.095"></label>
  <label class="row" for="rim"><span>Dark rim</span><output id="rimO"></output><input type="range" id="rim" min="0" max="3" step="0.05" value="1.5"></label>
  <label class="row" for="dry"><span>Drying speed</span><output id="dryO"></output><input type="range" id="dry" min="0.2" max="6" step="0.1" value="1.2"></label>
  <label class="row" for="gran"><span>Granulation</span><output id="granO"></output><input type="range" id="gran" min="0" max="1" step="0.01" value="0.68"></label>
  <label class="row" for="reach"><span>Drag reach</span><output id="reachO"></output><input type="range" id="reach" min="0.5" max="0.99" step="0.01" value="0.9"></label>
  <label class="row" for="lift"><span>Water lifts dried ink</span><output id="liftO"></output><input type="range" id="lift" min="0" max="0.05" step="0.001" value="0.013"></label>
  <div class="acts"><button id="again" type="button">Write it again</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const $ = (id) => document.getElementById(id);
  const DEF = { newFace: true, brush: 8.5, speed: 650, water: 0.9, pigment: 0.86, bleed: 0.095, rim: 1.5, dry: 1.2, gran: 0.68, reach: 0.9, lift: 0.013, colour: true, colourAmt: 0.7 };   // Idan's tuned values, 24 Oct 2026
  const P = { ...DEF };
  try { Object.assign(P, JSON.parse(localStorage.getItem('wash-script') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('wash-script', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- WebGL ----------
  const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) { document.body.insertAdjacentHTML('beforeend', '<div class="nogl">This test needs WebGL 2.</div>'); return; }
  gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float'); gl.getExtension('OES_texture_float_linear');

  const VS = `#version 300 es
  in vec2 a; out vec2 uv; void main() { uv = a * 0.5 + 0.5; gl_Position = vec4(a, 0, 1); }`;
  const COMMON = `#version 300 es
  precision highp float; in vec2 uv;
  uniform vec2 uRes;                   // sim size in px
  uniform vec2 uA, uB; uniform float uR, uWater; uniform vec4 uPig; uniform vec2 uBV; uniform int uMode;
  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
  float paper(vec2 p) { return 0.5 * vn(p / 7.0) + 0.3 * vn(p / 2.6 + 9.1) + 0.2 * vn(p / 23.0 + 3.7); }
  float seg(vec2 p, vec2 a, vec2 b) { vec2 ab = b - a; float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-4), 0.0, 1.0); return length(p - a - ab * t); }
  `;
  // velocity: decays each step; a moving wet brush pushes the water along with it
  const VEL = COMMON + `out vec4 o; uniform sampler2D uV; uniform float uDecay;
  void main() {
    vec2 p = uv * uRes; vec2 v = texture(uV, uv).xy * uDecay;
    if (uMode > 0) { float d = seg(p, uA, uB); float f = smoothstep(uR * 1.15, uR * 0.2, d); v = mix(v, uBV, f * (uMode == 2 ? 0.85 : 0.35)); }
    o = vec4(v, 0, 1);
  }`;
  // state, three textures: uS = (water, black ink floating, black ink settled); uF = colour floating (rgb); uD = colour settled (rgb).
  // Ink is a vec4 below: x black, yzw colour (as absorbance per channel, so colours mix like paint).
  const STATE = COMMON + `layout(location = 0) out vec4 o0; layout(location = 1) out vec4 o1; layout(location = 2) out vec4 o2;
  uniform sampler2D uS, uF, uD, uV; uniform float uBleed, uRim, uDry, uGran, uLift, uKeep;
  void main() {
    vec2 px = 1.0 / uRes, p = uv * uRes;
    vec4 S = texture(uS, uv);
    float pp = paper(p);
    vec2 v = texture(uV, uv).xy;
    vec2 ub = uv - v * px;                                  // what a moving brush pushed here
    float W = texture(uS, ub).r;
    vec4 F = vec4(texture(uS, ub).g, texture(uF, ub).rgb);
    vec4 D = vec4(S.b, texture(uD, uv).rgb);
    // the edge pulls: floating ink runs down the water toward the shallow edge, where it piles up as it dries (the dark rim).
    // Done as a flux between neighbours, so ink leaves the middle as it arrives at the edge.
    float k = uRim * 0.25, Wi = S.r, wi = step(0.01, Wi), sumW = 0.0;
    vec4 Fi = vec4(S.g, texture(uF, uv).rgb), flow = vec4(0), sumF = vec4(0);
    vec2 o4[4] = vec2[4](vec2(px.x, 0), vec2(-px.x, 0), vec2(0, px.y), vec2(0, -px.y));
    for (int n = 0; n < 4; n++) {
      vec4 N = texture(uS, uv + o4[n]); vec4 NF = vec4(N.g, texture(uF, uv + o4[n]).rgb);
      flow += k * max(0.0, N.r - Wi) * NF * wi;              // in, from deeper water
      flow -= k * max(0.0, Wi - N.r) * Fi * step(0.01, N.r); // out, to shallower water
      sumW += N.r; sumF += NF;
    }
    F = max(vec4(0), F + flow);
    // bleed: water spreads into its neighbours; into dry paper only where the fibres let it (ragged edges)
    float avgW = 0.25 * sumW;
    float into = S.r > 0.02 ? 1.0 : smoothstep(0.0, 0.2, avgW - pp * 0.22);
    W += uBleed * into * (avgW - W);
    float wet = smoothstep(0.0, 0.06, W);
    F += uBleed * 0.3 * wet * (0.25 * sumF - F);
    // drying
    W = max(0.0, W - uDry * 0.001 * (0.55 + 0.9 * pp) * (1.0 + 2.5 * (1.0 - smoothstep(0.0, 0.3, W))));   // thin water at the edge goes first
    wet = smoothstep(0.0, 0.06, W);
    // settling: a little all the time, all of it once the paper is dry; more in the paper's valleys (granulation)
    float g = mix(1.0, 0.35 + 1.4 * (1.0 - pp), uGran);
    vec4 dep = min(F, F * (0.0004 * g + (1.0 - wet)));
    F -= dep; D += dep * g;
    // wet water lifts some settled ink back up, so a wet brush can move ink that has dried
    vec4 lift = D * uLift * smoothstep(0.08, 0.5, W);
    D -= lift; F += lift;
    // the brush: the writer lays black ink; your brush lays water and, when it carries colour, colour
    if (uMode > 0) {
      float d = seg(p, uA, uB) + (pp - 0.5) * uR * 0.35;
      float f = smoothstep(uR, uR * 0.82, d);
      W = max(W, uWater * f);
      F = max(F, uPig * f);
    }
    o0 = vec4(W, F.x, D.x, 1) * uKeep; o1 = vec4(F.yzw, 1) * uKeep; o2 = vec4(D.yzw, 1) * uKeep;
  }`;
  const DRAW = COMMON + `out vec4 o; uniform sampler2D uS, uF, uD; uniform vec3 uBg, uInk; uniform float uDark;
  void main() {
    vec4 S = texture(uS, uv);
    float dens = S.b + S.g * 0.8;
    float a = 1.0 - exp(-dens * 1.9);
    a += (1.0 - a) * smoothstep(0.0, 0.4, S.r) * 0.045;   // wet paper reads a touch darker
    vec3 col = mix(uBg, uInk, clamp(a, 0.0, 1.0));
    // colour: subtractive on white paper (it stains), the same pigment glowing on black
    vec3 T = exp(-(texture(uD, uv).rgb + texture(uF, uv).rgb * 0.8) * 1.6);
    col = uDark > 0.5 ? clamp(col + (1.0 - T) * (1.0 - a), 0.0, 1.0) : col * T;
    o = vec4(col, 1);
  }`;

  function prog(fs) {
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  }
  const pVel = prog(VEL), pState = prog(STATE), pDraw = prog(DRAW);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  let SW = 1, SH = 1, scale = 1;
  function tex() {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, SW, SH, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  // a framebuffer over n textures (the state writes three at once)
  function target(n = 1) {
    const t = Array.from({ length: n }, tex), f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    t.forEach((x, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, x, 0));
    gl.drawBuffers(t.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { t, f };
  }
  let S = [], V = [];
  function allocate() {
    for (const x of [...S, ...V]) { x.t.forEach((t) => gl.deleteTexture(t)); gl.deleteFramebuffer(x.f); }
    S = [target(3), target(3)]; V = [target(), target()];
  }

  // ---------- the brush, this step ----------
  // mode 0: nothing; 1: the writing brush (water and black ink); 2: your brush (water, maybe colour; pushes what is wet)
  let br = { mode: 0, ax: 0, ay: 0, bx: 0, by: 0, r: 1, water: 0, pig: [0, 0, 0, 0], vx: 0, vy: 0 };
  let keep = 1;
  const bind = (unit, t, loc) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); };
  function step() {
    gl.viewport(0, 0, SW, SH);
    const setBrush = (u) => {
      gl.uniform2f(u.uRes, SW, SH); gl.uniform1i(u.uMode, br.mode);
      gl.uniform2f(u.uA, br.ax * scale, SH - br.ay * scale); gl.uniform2f(u.uB, br.bx * scale, SH - br.by * scale);
      gl.uniform1f(u.uR, br.r * scale); gl.uniform1f(u.uWater, br.water); gl.uniform4fv(u.uPig, br.pig);
      gl.uniform2f(u.uBV, br.vx * scale, -br.vy * scale);
    };
    gl.useProgram(pVel.p); setBrush(pVel.u);
    bind(0, V[0].t[0], pVel.u.uV); gl.uniform1f(pVel.u.uDecay, P.reach);
    gl.bindFramebuffer(gl.FRAMEBUFFER, V[1].f); gl.drawArrays(gl.TRIANGLES, 0, 3); V.reverse();
    gl.useProgram(pState.p); setBrush(pState.u);
    bind(0, S[0].t[0], pState.u.uS); bind(1, S[0].t[1], pState.u.uF); bind(2, S[0].t[2], pState.u.uD); bind(3, V[0].t[0], pState.u.uV);
    gl.uniform1f(pState.u.uBleed, P.bleed); gl.uniform1f(pState.u.uRim, P.rim); gl.uniform1f(pState.u.uDry, P.dry);
    gl.uniform1f(pState.u.uGran, P.gran); gl.uniform1f(pState.u.uLift, P.lift); gl.uniform1f(pState.u.uKeep, keep);
    gl.bindFramebuffer(gl.FRAMEBUFFER, S[1].f); gl.drawArrays(gl.TRIANGLES, 0, 3); S.reverse();
  }
  const hex = (s) => { s = s.replace('#', ''); if (s.length === 3) s = [...s].map((c) => c + c).join(''); const n = parseInt(s, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  let bg = [1, 1, 1], ink = [0, 0, 0], dark = false;
  const readTheme = () => { const cs = getComputedStyle(document.documentElement); bg = hex(cs.getPropertyValue('--bg').trim() || '#fff'); ink = hex(cs.getPropertyValue('--ink').trim() || '#000'); dark = bg[0] + bg[1] + bg[2] < 1.5; };
  function draw() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height);
    gl.useProgram(pDraw.p); gl.uniform2f(pDraw.u.uRes, SW, SH);
    bind(0, S[0].t[0], pDraw.u.uS); bind(1, S[0].t[1], pDraw.u.uF); bind(2, S[0].t[2], pDraw.u.uD);
    gl.uniform3fv(pDraw.u.uBg, bg); gl.uniform3fv(pDraw.u.uInk, ink); gl.uniform1f(pDraw.u.uDark, dark ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---------- colour on your brush ----------
  // Each drag picks up the next colour (never the same twice running). Stored as absorbance, so it stains white paper
  // in that colour and, on black, glows in it.
  const PAL = { dark: ['#2ee6ff', '#6fe0a0', '#d4f01a', '#ff4fe0', '#ff5a9a', '#ff6b5e'], light: ['#0a7fb5', '#0f9d8a', '#4a9a1a', '#c2185b', '#e0455a', '#e8652e'] };
  let hue = -1;
  function nextColour() {
    const list = PAL[dark ? 'dark' : 'light']; let h; do h = (Math.random() * list.length) | 0; while (h === hue && list.length > 1); hue = h;
    const c = hex(list[h]), k = c.map((x) => -Math.log(Math.max(0.03, dark ? 1 - x : x))), m = Math.max(...k);
    return k.map((x) => x / m * P.colourAmt);
  }
  let brushColour = [0, 0, 0];

  // ---------- the name's centre line ----------
  const FACES = [
    { family: 'Sacramento', weight: 400, size: 1.12 },
    { family: 'Great Vibes', weight: 400, size: 1.0 },
    { family: 'Allura', weight: 400, size: 1.05 },
    { family: 'Parisienne', weight: 400, size: 0.95 },
    { family: 'Pinyon Script', weight: 400, size: 0.9 },
    { family: 'Dancing Script', weight: 400, size: 0.95 },
  ];
  let face = 0, W = 1, H = 1;
  async function fontStrokes(f) {
    try { await Promise.race([document.fonts.load(`${f.weight} 100px "${f.family}"`), new Promise((r) => setTimeout(r, 3000))]); } catch (e) { return null; }
    if (!document.fonts.check(`${f.weight} 100px "${f.family}"`)) return null;
    const w = Math.ceil(W), h = Math.ceil(H), m = document.createElement('canvas'); m.width = w; m.height = h;
    const x = m.getContext('2d', { willReadFrequently: true }), font = (px) => `${f.weight} ${px}px "${f.family}"`;
    const words = W / H < 0.8 ? ['Idan', 'Segev'] : ['Idan Segev'];
    x.font = font(100); const widest = Math.max(...words.map((t) => x.measureText(t).width));
    const size = Math.min(W * 0.8 / widest * 100, H * (words.length > 1 ? 0.3 : 0.42) * f.size);
    x.font = font(size); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
    const lead = size * 0.9, top = H / 2 - (words.length - 1) * lead / 2;
    words.forEach((t, i) => x.fillText(t, W / 2, top + i * lead));
    const d = x.getImageData(0, 0, w, h).data, img = new Uint8Array(w * h);
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let i = 0; i < w * h; i++) if (d[i * 4 + 3] > 36) { img[i] = 1; const px = i % w, py = (i / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
    if (x1 <= x0) return null;
    x0 = Math.max(1, x0 - 2); y0 = Math.max(1, y0 - 2); x1 = Math.min(w - 2, x1 + 2); y1 = Math.min(h - 2, y1 + 2);
    // thin to a one-pixel centre line (Zhang-Suen)
    for (let changed = true; changed;) {
      changed = false;
      for (let pass = 0; pass < 2; pass++) {
        const del = [];
        for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
          const i = py * w + px; if (!img[i]) continue;
          const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
          const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9; if (B < 2 || B > 6) continue;
          const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2); if (A !== 1) continue;
          if (pass === 0 ? (p2 && p4 && p6) || (p4 && p6 && p8) : (p2 && p4 && p8) || (p2 && p6 && p8)) continue;
          del.push(i);
        }
        for (const i of del) img[i] = 0; if (del.length) changed = true;
      }
    }
    for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
      const i = py * w + px; if (!img[i]) continue;
      const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
      if (p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9 !== 2) continue;

    // walk the centre line into strokes, as straight as the line allows
    const N8 = [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1], DX = [-1, 0, 1, -1, 1, -1, 0, 1], DY = [-1, -1, -1, 0, 0, 1, 1, 1];
    const used = new Uint8Array(w * h), pix = [];

    const free = (i) => { const r = []; for (let k = 0; k < 8; k++) { const j = i + N8[k]; if (img[j] && !used[j]) r.push(k); } return r; };
    const paths = [];
    for (;;) {
      let start = -1;

      if (start < 0) for (const i of pix) if (!used[i]) { start = i; break; }

        const fr = free(cur); if (!fr.length) break;

        for (const k of fr) used[cur + N8[k]] = 1;
        dx = dx * 0.6 + DX[best] * 0.4; dy = dy * 0.6 + DY[best] * 0.4;

    }
    const strokes = [];
    for (const path of paths) {
      if (path.length < 6) continue;
      let q = path.map((i) => [i % w, (i / w) | 0]);
      for (let it = 0; it < 3; it++) q = q.map((p, k) => (k === 0 || k === q.length - 1 ? p : [(q[k - 1][0] + 2 * p[0] + q[k + 1][0]) / 4, (q[k - 1][1] + 2 * p[1] + q[k + 1][1]) / 4]));

    }

    const lineOf = (st) => Math.round(((st[0][1] + st[st.length - 1][1]) / 2 - top) / lead);
    strokes.sort((a, b) => lineOf(a) - lineOf(b) || Math.min(...a.map((p) => p[0])) - Math.min(...b.map((p) => p[0])));
    return strokes;
  }

  // ---------- the writer: a brush that follows the strokes ----------
  let strokes = [], wi = 0, wt = 0, writing = false, lift = 0, last = null;
  function writerAdvance(dist) {
    // returns the segment the brush paints this step, or null while it is lifted between strokes
    while (writing) {
      if (lift > 0) { lift -= dist; last = null; return null; }
      const st = strokes[wi]; if (!st) { writing = false; return null; }
      const n = st.length - 1, t1 = Math.min(n, wt + dist);
      const at = (t) => { const i = Math.min(n - 1, Math.floor(t)), u = t - i; return [st[i][0] + (st[i + 1][0] - st[i][0]) * u, st[i][1] + (st[i + 1][1] - st[i][1]) * u]; };
      const a = last || at(wt), b = at(t1);

      const dy = (b[1] - a[1]) / (Math.hypot(b[0] - a[0], b[1] - a[1]) || 1);
      const ramp = Math.min(1, t1 / 10) * Math.min(1, (n - t1) / 14 + 0.25);
      const press = (0.72 + 0.38 * Math.max(0, dy)) * (0.35 + 0.65 * ramp);
      wt = t1; last = b;
      const pool = 1 + 0.55 * Math.max(0, 1 - t1 / 18) + 0.25 * Math.max(0, 1 - (n - t1) / 10);
      const run = (0.82 + 0.3 * Math.sin(wi * 2.3 + 1)) * (0.9 + 0.18 * Math.sin(t1 * 0.045 + wi));
      if (wt >= n) { wi++; wt = 0; lift = 40; last = null; }
      return { a, b, r: P.brush * press, ink: pool * run };
    }
    return null;
  }

  let face0 = -1;
  async function build(next) {
    while (innerWidth < 2 || innerHeight < 2) await new Promise((r) => setTimeout(r, 100));   // a frame not laid out yet
    const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    scale = Math.min(dpr, Math.sqrt(2.2e6 / (W * H))); SW = Math.round(W * scale); SH = Math.round(H * scale);
    allocate(); readTheme();
    if (next) face = (face + 1) % FACES.length;
    let got = null;
    for (let k = 0; k < FACES.length && !got; k++) { got = await fontStrokes(FACES[face]); if (!got || !got.length) { got = null; face = (face + 1) % FACES.length; } }
    strokes = got || [];
    $('faceName').textContent = got ? FACES[face].family : '';
    wi = 0; wt = 0; lift = 0; last = null; writing = strokes.length > 0;
    if (reduced) { while (writing) { const s = writerAdvance(30); paint(s, 1); step(); } br.mode = 0; for (let i = 0; i < 1400; i++) step(); }
  }
  function paint(s, mode) {
    if (!s) { br.mode = 0; return; }
    const pig = mode === 1 ? [P.pigment * (s.ink || 1), 0, 0, 0] : [0, ...(P.colour ? brushColour : [0, 0, 0])];
    br = { mode, ax: s.a[0], ay: s.a[1], bx: s.b[0], by: s.b[1], r: s.r, water: P.water, pig, vx: s.vx || 0, vy: s.vy || 0 };
    if (mode === 1) { const d = Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]) || 1; br.vx = (s.b[0] - s.a[0]) / d * 0.6; br.vy = (s.b[1] - s.a[1]) / d * 0.6; }
  }

  // ---------- you: a wet brush ----------
  const ptr = { down: false, x: 0, y: 0, px: 0, py: 0, held: 0, moved: 0, t: 0 };
  let taps = [], blotting = 0;
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    brushColour = nextColour();
    Object.assign(ptr, { down: true, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, held: 0, moved: 0, t: performance.now() });
  });
  cv.addEventListener('pointermove', (e) => { if (!ptr.down) return; ptr.moved += Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y); ptr.x = e.clientX; ptr.y = e.clientY; });
  const up = () => {
    if (!ptr.down) return; ptr.down = false;
    const now = performance.now();
    if (now - ptr.t < 250 && ptr.moved < 8) {
      taps = taps.filter((t) => now - t < 380); taps.push(now);
      if (taps.length >= 2) { taps = []; blotting = 34; }       // double tap: blot it all up, then write again
    }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---------- loop ----------
  const SUB = 3;
  let tPrev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - tPrev) / 1000); tPrev = now;
    if (blotting > 0) {
      keep = 0.86; br.mode = 0; for (let i = 0; i < SUB; i++) step(); keep = 1;
      if (--blotting === 0) build(P.newFace);
    } else {
      for (let i = 0; i < SUB; i++) {
        if (ptr.down) {
          // your brush: water only; it pushes what is wet the way you move; holding still floods and spreads
          const ax = ptr.px + (ptr.x - ptr.px) * (i / SUB), ay = ptr.py + (ptr.y - ptr.py) * (i / SUB);
          const bx = ptr.px + (ptr.x - ptr.px) * ((i + 1) / SUB), by = ptr.py + (ptr.y - ptr.py) * ((i + 1) / SUB);
          const grow = 1 + Math.min(1.6, ptr.held * 1.1);
          paint({ a: [ax, ay], b: [bx, by], r: P.brush * 1.7 * grow, vx: (bx - ax) * 1.1, vy: (by - ay) * 1.1 }, 2);
          br.water = Math.min(1, P.water * (0.8 + 0.3 * grow));
        } else if (writing) paint(writerAdvance(P.speed * dt / SUB), 1);
        else br.mode = 0;
        step();
      }
      if (ptr.down) { const still = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py) < 1.5; ptr.held = still ? ptr.held + dt : Math.max(0, ptr.held - dt * 2); ptr.px = ptr.x; ptr.py = ptr.y; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- settings ----------
  const SL = ['colourAmt', 'brush', 'speed', 'water', 'pigment', 'bleed', 'rim', 'dry', 'gran', 'reach', 'lift'];
  const fmt = (k, v) => (k === 'speed' ? Math.round(v) : (+v).toFixed(v < 0.1 && v > 0 ? 3 : 2));
  for (const k of SL) { const el = $(k); el.value = P[k]; $(k + 'O').textContent = fmt(k, P[k]); el.addEventListener('input', () => { P[k] = +el.value; $(k + 'O').textContent = fmt(k, P[k]); save(); }); }
  $('colour').checked = P.colour; $('colour').addEventListener('change', () => { P.colour = $('colour').checked; save(); });
  $('newFace').checked = P.newFace; $('newFace').addEventListener('change', () => { P.newFace = $('newFace').checked; save(); });
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('again').addEventListener('click', () => { blotting = 34; });
  $('copy').addEventListener('click', () => {
    const txt = JSON.stringify(P);
    navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => ($('copy').textContent = 'Copy settings'), 1200); })
      .catch(() => { $('faceName').textContent = txt; });
  });

  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => build(false), 250); });
  window.__wash = { P, step, get writing() { return writing; } };

  build(false).then(() => requestAnimationFrame(frame));
})();
