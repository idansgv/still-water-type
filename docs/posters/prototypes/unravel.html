<title>Unravel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sacramento&family=Poiret+One&family=Comfortaa:wght@300&family=Josefin+Sans:wght@100&family=Quicksand:wght@300&family=Julius+Sans+One&family=Raleway:wght@100&display=swap">
<style>
/* Layout: the page is cloth; the name is embroidered in one thread with a loose end. A quiet foot line and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, sewn in one thread in a running stitch, with a loose end. Pull the end and the name unstitches; let go and it sews itself back."></canvas>
<div class="foot"><span><b>Unravel</b> &nbsp;draft &nbsp;<span id="faceName"></span></span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="resew"><span>Let go and it sews itself back</span><input type="checkbox" id="resew" checked></label>
  <label class="row tog" for="newFace"><span>A new face every time it is peeled off</span><input type="checkbox" id="newFace" checked></label>
  <label class="row tog" for="colour"><span>Colour (the rare easter egg)</span><input type="checkbox" id="colour"></label>
  <label class="row" for="stitch"><span>Length of a stitch</span><output id="stitchO"></output><input type="range" id="stitch" min="3" max="40" step="1" value="12"></label>
  <label class="row" for="gap"><span>Gap between stitches</span><output id="gapO"></output><input type="range" id="gap" min="0" max="20" step="1" value="6"></label>
  <label class="row" for="thread"><span>Thread weight</span><output id="threadO"></output><input type="range" id="thread" min="0.8" max="6" step="0.1" value="3"></label>
  <label class="row" for="zip"><span>How fast it unzips (thread per px of pull)</span><output id="zipO"></output><input type="range" id="zip" min="1" max="80" step="1" value="24"></label>
  <label class="row" for="sew"><span>How fast it sews back</span><output id="sewO"></output><input type="range" id="sew" min="0.5" max="12" step="0.5" value="4"></label>
  <div class="acts"><button id="again" type="button">Sew it back now</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const P = { resew: true, newFace: true, colour: false, stitch: 12, gap: 6, thread: 3, sew: 4, zip: 24 };
  try { Object.assign(P, JSON.parse(localStorage.getItem('unravel-mono') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('unravel-mono', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const PAL = { dark: ['#2ee6ff', '#6fe0a0', '#d4f01a', '#ff4fe0', '#ff5a9a', '#ff6b5e'], light: ['#0a7fb5', '#0f9d8a', '#4a9a1a', '#c2185b', '#e0455a', '#e8652e'] };
  let W = 1, H = 1, dpr = 1, page = '#fff', ink = '#000', dark = false;
  const readTheme = () => { const cs = getComputedStyle(document.documentElement); page = cs.getPropertyValue('--bg').trim(); ink = cs.getPropertyValue('--ink').trim(); dark = page === '#000000'; };

  // ---------- the thread ----------
  // One thread, as a chain of nodes a few px apart. Every node has a home on the cloth. Some nodes are needle holes.
  // A segment is on the front (seen) or the back (hidden) while it is sewn; once a stretch is pulled out, all of it is seen.
  // Nodes before `sewn` are stitched in place; the rest are free (a rope you can pull). The last nodes are the loose end.
  let N = 0, HX, HY, X, Y, PXo, PYo, REST, FRONT, HOLE, TONE, sewn = 0, holes = [];
  const STEP = 5;

  // Every time the name is peeled off, it is sewn back in the next one.
  const FACES = [
    { name: 'Skeleton' },
    { family: 'Sacramento', weight: 400, words: ['Idan', 'Segev'], size: 1.12 },
    { family: 'Poiret One', weight: 400, words: ['IDAN', 'SEGEV'] },
    { family: 'Comfortaa', weight: 300, words: ['idan', 'segev'] },
    { family: 'Josefin Sans', weight: 100, words: ['IDAN', 'SEGEV'] },
    { family: 'Quicksand', weight: 300, words: ['Idan', 'Segev'] },
    { family: 'Julius Sans One', weight: 400, words: ['IDAN', 'SEGEV'] },
    { family: 'Raleway', weight: 100, words: ['IDAN', 'SEGEV'] },

  let face = 0;
  function skeletonStrokes() {
    const PI = Math.PI, line = (...p) => p, arc = (a0, a1, cx = 0, cy = 0, rx = 0.31, ry = 0.35) => Array.from({ length: 29 }, (_, i) => { const a = a0 + (a1 - a0) * i / 28; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });

      D: { wf: 0.86, s: [line([-0.3, 0.35], [-0.3, -0.35]), arc(-PI / 2, PI / 2, -0.3, 0, 0.6, 0.35)] },
      A: { wf: 0.98, s: [line([-0.3, 0.35], [0, -0.35], [0.3, 0.35]), line([0.19, 0.1], [-0.19, 0.1])] },
      N: { wf: 0.9, s: [line([-0.3, 0.35], [-0.3, -0.35], [0.3, 0.35], [0.3, -0.35])] },
      S: { wf: 0.78, s: [arc(-0.15 * PI, -1.5 * PI, 0, -0.175, 0.29, 0.175).concat(arc(-0.5 * PI, 0.85 * PI, 0, 0.175, 0.29, 0.175).slice(1))] },
      E: { wf: 0.76, s: [line([0.3, -0.35], [-0.29, -0.35], [-0.29, 0.35], [0.3, 0.35]), line([-0.29, 0], [0.22, 0])] },
      G: { wf: 0.92, s: [arc(-0.28 * PI, -2 * PI, 0, 0, 0.31, 0.35).concat([[0.31, 0.02], [0.04, 0.02]])] },
      V: { wf: 0.98, s: [line([-0.3, -0.35], [0, 0.35], [0.3, -0.35])] },
    };
    const portrait = W / H < 0.8, lines = portrait ? ['IDAN', 'SE', 'GEV'] : ['IDAN', 'SEGEV'];
    const track = 0.42, lineW = (l, h) => [...l].reduce((a, ch) => a + SK[ch].wf * h * 0.86, 0) + track * h * (l.length - 1);
    const h = Math.min(H * (portrait ? 0.16 : 0.25), ...lines.map((l) => (W * 0.8) / lineW(l, 1)));
    const lead = h * 1.55, top = H / 2 - (lines.length - 1) * lead / 2 - h * 0.05, out = [];
    lines.forEach((l, li) => {

  }
  // a monoline font: render the name, thin it to a one-pixel centre line (Zhang-Suen), and walk that into strokes
  async function fontStrokes(f) {

    const w = Math.ceil(W), h = Math.ceil(H), m = document.createElement('canvas'); m.width = w; m.height = h;
    const x = m.getContext('2d', { willReadFrequently: true }), font = (px) => `${f.weight} ${px}px "${f.family}"`;

          const i = py * w + px; if (!img[i]) continue;
          const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
          const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9; if (B < 2 || B > 6) continue;
          const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2); if (A !== 1) continue;
          if (pass === 0 ? (p2 && p4 && p6) || (p4 && p6 && p8) : (p2 && p4 && p8) || (p2 && p6 && p8)) continue;

      const i = py * w + px; if (!img[i]) continue;
      const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
      if (p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9 !== 2) continue;

    const N8 = [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1], DX = [-1, 0, 1, -1, 1, -1, 0, 1], DY = [-1, -1, -1, 0, 0, 1, 1, 1];

      if (start < 0) for (const i of pix) if (!used[i]) { start = i; break; }

      for (;;) {

  async function build(sewFromStart = false) {

        zipBudget -= rope(next - 1, sewn - 1);
        sparks.push({ x: X[sewn - 1], y: Y[sewn - 1], t: 0 });
        for (let i = next; i < sewn; i++) { PXo[i] = X[i]; PYo[i] = Y[i]; }
        sewn = next;
      }
      // reel: the thread runs through your fingers, so the stretch to the cloth stays about as long as the pull
      const d = Math.hypot(grab.x - X[sewn - 1], grab.y - Y[sewn - 1]);
      while (g > sewn + 3 && rope(sewn - 1, g) > d * 1.02 + 6) g--;              // (taut, so the next pull pops the next stitch)
      gone = Math.min(N, g + TAIL);
    }
    // after a pull, once you let go: sew the same seam back, or (a new face every time) pick out what is left and sew the name again in the next face
    if (!grab && P.resew && idle > 0.6 && phase === 'rest' && sewn <= lastHole) phase = P.newFace ? 'unpick' : 'resew';
    if (phase === 'resew') {
      let budget = P.sew * 900 * dt;
      while (budget > 0 && sewn <= lastHole) { budget -= REST[sewn] || STEP; X[sewn] = PXo[sewn] = HX[sewn]; Y[sewn] = PYo[sewn] = HY[sewn]; if (HOLE[sewn]) sparks.push({ x: X[sewn], y: Y[sewn], t: 0.18 }); sewn++; }
      if (sewn > lastHole) { gone = Infinity; for (let i = sewn; i < N; i++) { X[i] = PXo[i] = HX[i]; Y[i] = PYo[i] = HY[i]; } phase = 'rest'; }
      else if (gone < N && sewn > gone - TAIL) { gone = Math.min(N, gone + 1); X[gone - 1] = PXo[gone - 1] = X[gone - 2]; Y[gone - 1] = PYo[gone - 1] = Y[gone - 2]; }
    } else if (phase === 'unpick') {                                     // what is left of the old seam pops out, stitch by stitch, from the end back to the start
      let budget = P.sew * 1800 * dt;
      while (budget > 0 && sewn > 0) { sewn--; budget -= REST[sewn] || STEP; if (HOLE[sewn] && sparks.length < 60) sparks.push({ x: X[sewn], y: Y[sewn], t: 0.1 }); }
      gone = sewn;
      if (sewn === 0 && !loading) { loading = true; face = (face + 1) % FACES.length; build(true).then(() => { loading = false; phase = 'sew'; showFace(); }); }
    } else if (phase === 'sew') {                                         // the needle sews the name in the new face
      const lh = holes[holes.length - 1];
      let budget = P.sew * 900 * dt;
      while (budget > 0 && sewn <= lh) { budget -= REST[sewn] || STEP; X[sewn] = PXo[sewn] = HX[sewn]; Y[sewn] = PYo[sewn] = HY[sewn]; sewn++; }
      gone = sewn;
      if (sewn > lh) { gone = Infinity; for (let i = sewn; i < N; i++) { X[i] = PXo[i] = HX[i]; Y[i] = PYo[i] = HY[i]; } phase = 'rest'; }
    }
    // the free stretch is a rope
    const end = visibleEnd();
    for (let i = sewn; i < end; i++) {
      const vx = (X[i] - PXo[i]) * 0.9, vy = (Y[i] - PYo[i]) * 0.9;
      PXo[i] = X[i]; PYo[i] = Y[i]; X[i] += vx; Y[i] += vy;
      if (!grab && gone === Infinity && i > lastHole) { X[i] += (HX[i] - X[i]) * dt * 2; Y[i] += (HY[i] - Y[i]) * dt * 2; }   // the loose end settles back onto the cloth
    }
    if (grab) { X[g] = grab.x; Y[g] = grab.y; }
    for (let it = 0; it < 14; it++) {
      for (let i = Math.max(1, sewn); i < end; i++) {
        const a = i - 1, dx = X[i] - X[a], dy = Y[i] - Y[a], d = Math.hypot(dx, dy) || 1e-6, diff = (d - REST[i]) / d;
        const pa = a < sewn || (grab && a === g) ? 0 : 0.5, pb = grab && i === g ? 0 : 0.5;
        const s = pa + pb || 1; X[a] += dx * diff * (pa / s); Y[a] += dy * diff * (pa / s); X[i] -= dx * diff * (pb / s); Y[i] -= dy * diff * (pb / s);
      }
    }
    for (const sp of sparks) sp.t += dt; sparks = sparks.filter((sp) => sp.t < 0.35); if (sparks.length > 80) sparks.splice(0, sparks.length - 80);
    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = page; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = P.thread;
    const pal = PAL[dark ? 'dark' : 'light'], col = (i) => (P.colour ? pal[Math.min(5, Math.floor(TONE[i] * 6))] : ink);
    // the sewn part: only the stitches on the front show
    ctx.strokeStyle = ink; ctx.beginPath();
    for (let i = 1; i < sewn; i++) { if (!FRONT[i]) continue; if (!FRONT[i - 1] || HOLE[i - 1]) ctx.moveTo(X[i - 1], Y[i - 1]); ctx.lineTo(X[i], Y[i]); }
    ctx.stroke();
    // the free thread, lifted off the cloth
    const end = visibleEnd();
    if (sewn < end) {
      ctx.lineWidth = P.thread * 1.15;
      if (P.colour) { for (let i = Math.max(1, sewn); i < end; i++) { ctx.strokeStyle = col(i); ctx.beginPath(); ctx.moveTo(X[i - 1], Y[i - 1]); ctx.lineTo(X[i], Y[i]); ctx.stroke(); } }
      else { ctx.strokeStyle = ink; ctx.beginPath(); ctx.moveTo(X[Math.max(0, sewn - 1)], Y[Math.max(0, sewn - 1)]); for (let i = sewn; i < end; i++) ctx.lineTo(X[i], Y[i]); ctx.stroke(); }
    }
    // the needle, while it sews: a short steel line along the seam, with its eye
    if (phase === 'sew' && sewn > 2) {
      const i = sewn - 1, j = Math.max(0, i - 3), ang = Math.atan2(Y[i] - Y[j], X[i] - X[j]), L = 22;
      ctx.save(); ctx.translate(X[i], Y[i]); ctx.rotate(ang); ctx.strokeStyle = ink; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-L * 0.2, 0); ctx.lineTo(L, 0); ctx.stroke();
      ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(L * 0.82, 0, 2.6, 1.1, 0, 0, 7); ctx.stroke(); ctx.restore();
    }
    // a stitch popping out of the cloth: a tiny puff at the hole
    ctx.lineWidth = 1; ctx.strokeStyle = ink;
    for (const sp of sparks) { const u = sp.t / 0.35; ctx.globalAlpha = (1 - u) * 0.7; ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.5 + u * 6, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  // ---------- settings (for this test only) ----------
  const fmt = { zip: (v) => '×' + v, stitch: (v) => v + ' px', gap: (v) => v + ' px', thread: (v) => (+v).toFixed(1) + ' px', sew: (v) => '×' + (+v).toFixed(1) };
  for (const key of ['resew', 'newFace', 'colour']) { $(key).checked = !!P[key]; $(key).addEventListener('change', () => { P[key] = $(key).checked; save(); }); }
  for (const key of Object.keys(fmt)) { $(key).value = P[key]; $(key + 'O').textContent = fmt[key](P[key]); $(key).addEventListener('input', () => { P[key] = +$(key).value; $(key + 'O').textContent = fmt[key](P[key]); save(); if (key === 'stitch' || key === 'gap') rebuild(); }); }
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('again').addEventListener('click', () => { idle = 9; const was = P.resew; P.resew = true; setTimeout(() => { P.resew = was; }, 20000); });
  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(P, null, 2)).then(() => { $('copy').textContent = 'Copied'; }, () => { $('copy').textContent = 'Copy blocked'; })
      .finally(() => setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1600));
  });
  let rt = 0; const rebuild = () => { clearTimeout(rt); rt = setTimeout(build, 220); };
  addEventListener('resize', rebuild);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const showFace = () => { const f = FACES[face]; $('faceName').textContent = f.family || 'skeleton'; };
  readTheme(); build().then(() => { showFace(); requestAnimationFrame(frame); });
  window.__unravel = { state: () => ({ N, sewn, holes: holes.length, face: FACES[face].family || 'skeleton', phase, tail: [X[N - 1], Y[N - 1]] }), setFace: async (k) => { face = k; await build(); showFace(); } };   // (for testing)
})();
</script>
