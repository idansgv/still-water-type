<title>Inkwell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed poster, each letter a chubby glass bottle half full of ink; a quiet mono line at the foot; a settings sheet for this test only. White page by default, black in the dark slot. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #8a8a8a; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(252, 252, 252, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root.dark { --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, each letter a chubby glass bottle half full of ink. Pick a letter up and the ink sloshes; tip it and the ink pours from its neck."></canvas>
<div class="foot"><span><b>Inkwell</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="dark"><span>Black page (white ink)</span><input type="checkbox" id="dark"></label>
  <label class="row" for="fill"><span>How full</span><output id="fillO"></output><input type="range" id="fill" min="0.15" max="0.9" step="0.01"></label>
  <label class="row" for="puff"><span>Chubbiness</span><output id="puffO"></output><input type="range" id="puff" min="0.3" max="1.6" step="0.05"></label>
  <label class="row" for="depth"><span>Depth</span><output id="depthO"></output><input type="range" id="depth" min="0.3" max="2" step="0.05"></label>
  <label class="row" for="wall"><span>Glass thickness</span><output id="wallO"></output><input type="range" id="wall" min="0.006" max="0.03" step="0.001"></label>
  <label class="row" for="wobble"><span>Wobble speed</span><output id="wobbleO"></output><input type="range" id="wobble" min="0.3" max="2.5" step="0.05"></label>
  <label class="row" for="settle"><span>Wobble settles</span><output id="settleO"></output><input type="range" id="settle" min="0.02" max="0.6" step="0.01"></label>
  <label class="row" for="slosh"><span>Slosh strength</span><output id="sloshO"></output><input type="range" id="slosh" min="0" max="3" step="0.05"></label>
  <label class="row" for="pour"><span>Pour rate</span><output id="pourO"></output><input type="range" id="pour" min="0.2" max="4" step="0.05"></label>
  <label class="row" for="grav"><span>Gravity</span><output id="gravO"></output><input type="range" id="grav" min="0.3" max="2.5" step="0.05"></label>
  <label class="row" for="spring"><span>Letter springiness</span><output id="springO"></output><input type="range" id="spring" min="0.3" max="2" step="0.05"></label>
  <label class="row" for="tint"><span>Glass tint</span><output id="tintO"></output><input type="range" id="tint" min="0" max="1" step="0.02"></label>
  <div class="acts"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>

}
function dropMat() {
  return new THREE.MeshPhysicalMaterial({ color: P.dark ? 0xf4f4f4 : 0x060606, roughness: 0.15, clearcoat: 1, envMapIntensity: 1.2 });
}

// ---------- glyphs ----------
function glyphShapes(ch) {
  const path = font.getPath(ch, 0, 0, fs);
  const sp = new THREE.ShapePath();
  for (const c of path.commands) {
    if (c.type === 'M') sp.moveTo(c.x, -c.y);

  return { shapes: holes(a) >= holes(b) ? a : b, path };
}

function makeLetter(ch, x0, base) {
  const { shapes, path } = glyphShapes(ch);
  const bb = path.getBoundingBox(); // y down
  const cx = (bb.x1 + bb.x2) / 2, cy = -(bb.y1 + bb.y2) / 2;
  const D = fs * 0.1 * P.depth, bt = fs * 0.075 * P.puff, bs = fs * 0.03 * P.puff, wall = fs * P.wall;
  const geoOpts = (depth, thick, size, off) => ({ depth, bevelEnabled: true, bevelThickness: thick, bevelSize: size, bevelOffset: off, bevelSegments: 8, curveSegments: 14 });
  const gG = new THREE.ExtrudeGeometry(shapes, geoOpts(D, bt, bs, 0));
  gG.translate(-cx, -cy, -D / 2); gG.computeVertexNormals();
  const bsI = Math.max(0.5, bs * 0.45), btI = Math.max(1, bt - wall);
  const gI = new THREE.ExtrudeGeometry(shapes, geoOpts(D, btI, bsI, bs - wall - bsI));
  gI.translate(-cx, -cy, -D / 2); gI.computeVertexNormals();

  // volume samples inside the ink, for a level that keeps its volume at any angle
  const c2 = document.createElement('canvas').getContext('2d');
  const p2 = new Path2D(path.toPathData(3));
  const pts = [], zr = D / 2 + btI * 0.8;
  let tries = 0;
  while (pts.length < 1400 * 3 && tries++ < 60000) {
    const x = bb.x1 + Math.random() * (bb.x2 - bb.x1), y = bb.y1 + Math.random() * (bb.y2 - bb.y1);
    if (!c2.isPointInPath(p2, x, y)) continue;
    pts.push(x - cx, -y - cy, (Math.random() * 2 - 1) * zr);

  const vol = new Float32Array(pts), nV = vol.length / 3;
  let rg2 = 0; for (let i = 0; i < nV; i++) rg2 += vol[i * 3] ** 2 + vol[i * 3 + 1] ** 2; rg2 /= nV;
  // the neck sits on the highest point of the outline

    if (y > top + 1) { top = y; tx = p.x - cx; nt = 1; } else if (Math.abs(y - top) <= 1) { tx = (tx * nt + p.x - cx) / (nt + 1); nt++; }
  }
  const nr = fs * 0.038 * Math.max(0.8, P.puff), nl = fs * 0.075;
  const neckG = new THREE.CylinderGeometry(nr, nr * 1.2, nl + bt, 28, 1, true);
  neckG.translate(tx, top + bs * 0.4 + (nl - bt) / 2, 0);
  const lipG = new THREE.TorusGeometry(nr * 1.02, fs * 0.012, 12, 32);
  lipG.rotateX(Math.PI / 2); lipG.translate(tx, top + bs * 0.4 + nl, 0);

  const group = new THREE.Group();
  const gm = glassMat();
  const plane = { n: { value: new THREE.Vector3(0, 1, 0) }, d: { value: 0 }, surf: { value: new THREE.Color(P.dark ? 0xc8c8c8 : 0x1e1e1e) } };
  const ink = new THREE.Mesh(gI, inkMat(plane));

  const glass = new THREE.Mesh(gG, gm), neck = new THREE.Mesh(neckG, gm), lip = new THREE.Mesh(lipG, gm);
  group.add(ink, glass, neck, lip);
  root.add(group);
  const hx = x0 + cx - W / 2, hy = base + cy;
  group.position.set(hx, hy, 0);
  return {
    ch, group, glass, neck, plane, vol, nV, rg2, sorted: new Float32Array(nV),
    mouth: new THREE.Vector3(tx, top + bs * 0.4 + nl, 0),
    x: hx, y: hy, hx, hy, th: 0, vx: 0, vy: 0, om: 0, ax: 0, ay: 0,
    tiltX: 0, tiltZ: 0, tvx: 0, tvz: 0, fill: reduced ? P.fill : 0, target: P.fill, grab: null, pourAcc: 0,

}

// ---------- drops ----------
const MAXD = 900;
let drops = null;
const dp = new Float32Array(MAXD * 3), dv = new Float32Array(MAXD * 3), dr = new Float32Array(MAXD), dAlive = new Uint8Array(MAXD);
let dNext = 0;
function makeDrops() {
  if (drops) { root.remove(drops); drops.geometry.dispose(); }
  drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), dropMat(), MAXD);
  drops.frustumCulled = false; drops.count = MAXD;

}
function emit(x, y, z, vx, vy, vz, r) {
  const i = dNext; dNext = (dNext + 1) % MAXD;
  dp[i * 3] = x; dp[i * 3 + 1] = y; dp[i * 3 + 2] = z; dv[i * 3] = vx; dv[i * 3 + 1] = vy; dv[i * 3 + 2] = vz; dr[i] = r; dAlive[i] = 1;
}
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0), _v = new THREE.Vector3();
function stepDrops(dt) {
  const g = 2200 * P.grav;
  for (let i = 0; i < MAXD; i++) {
    if (!dAlive[i]) continue;
    dv[i * 3 + 1] -= g * dt;
    dp[i * 3] += dv[i * 3] * dt; dp[i * 3 + 1] += dv[i * 3 + 1] * dt; dp[i * 3 + 2] += dv[i * 3 + 2] * dt;
    if (dp[i * 3 + 1] < -H / 2 - 80) { dAlive[i] = 0; drops.setMatrixAt(i, _m.makeScale(0, 0, 0)); continue; }
    _v.set(dv[i * 3], dv[i * 3 + 1], dv[i * 3 + 2]);
    const sp = _v.length();
    _q.setFromUnitVectors(_up, sp > 1 ? _v.multiplyScalar(1 / sp) : _up);
    const st = 1 + Math.min(0.9, sp * 0.0005);
    _s.set(dr[i] / Math.sqrt(st), dr[i] * st, dr[i] / Math.sqrt(st));
    _p.set(dp[i * 3], dp[i * 3 + 1], dp[i * 3 + 2]);
    drops.setMatrixAt(i, _m.compose(_p, _q, _s));
  }
  drops.instanceMatrix.needsUpdate = true;
}

// ---------- build ----------
async function build() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  const dist = (H / 2) / Math.tan(THREE.MathUtils.degToRad(14)), pitch = THREE.MathUtils.degToRad(9);
  camera.aspect = W / H; camera.position.set(0, dist * Math.sin(pitch), dist * Math.cos(pitch)); camera.lookAt(0, 0, 0);
  camera.near = camera.position.z * 0.3; camera.far = camera.position.z * 3; camera.updateProjectionMatrix();
  scene.background = new THREE.Color(P.dark ? 0x000000 : 0xffffff);
  for (const L of letters) { root.remove(L.group); L.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  letters = [];
  const lines = W / H < 0.95 ? ['Idan', 'Segev'] : ['Idan Segev'];
  const adv = (s, size) => font.getAdvanceWidth(s, size, { kerning: true });
  const w100 = Math.max(...lines.map((l) => adv(l, 100)));
  fs = Math.min((W * 0.8) / w100 * 100, H * (lines.length === 1 ? 0.4 : 0.28));
  const lh = fs * 1.05;
  // y: world up; first baseline so the block sits in the middle
  let base = (lh * (lines.length - 1)) / 2 - fs * 0.33;
  for (const line of lines) {
    const x0 = (W - adv(line, fs)) / 2;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === ' ') continue;
      letters.push(makeLetter(line[i], x0 + adv(line.slice(0, i), fs), base));
    }
    base -= lh;
  }
  makeDrops();
  fillStart = performance.now();
  demoAt = reduced || touched ? 0 : performance.now() + 1700;
}

// ---------- physics ----------
const _e = new THREE.Euler(), _n = new THREE.Vector3(), _nl = new THREE.Quaternion(), _mouth = new THREE.Vector3();
function stepLetters(dt, now) {
  const gB = 2200 * P.grav;
  for (const L of letters) {
    const pvx = L.vx, pvy = L.vy;
    let ax, ay, al;
    if (L.grab) {
      const gw = 30, zg = 0.55;
      const c = Math.cos(L.th), s = Math.sin(L.th);
      const rx = L.grab.lx * c - L.grab.ly * s, ry = L.grab.lx * s + L.grab.ly * c;
      const gvx = L.vx - L.om * ry, gvy = L.vy + L.om * rx;
      const fx = gw * gw * (mouse.x - (L.x + rx)) - 2 * zg * gw * gvx;
      const fy = gw * gw * (mouse.y - (L.y + ry)) - 2 * zg * gw * gvy;
      ax = fx; ay = fy - gB;
      al = (rx * fy - ry * fx) / L.rg2 - 1.5 * L.om; // it hangs from where you hold it
    } else {
      const wh = 9 * P.spring, wa = 10 * P.spring, zh = 0.3, za = 0.22;
      let d = L.th % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; L.th = d;
      ax = wh * wh * (L.hx - L.x) - 2 * zh * wh * L.vx;
      ay = wh * wh * (L.hy - L.y) - 2 * zh * wh * L.vy;
      al = -wa * wa * d - 2 * za * wa * L.om;

    const sp = Math.hypot(L.vx, L.vy); if (sp > 3000) { L.vx *= 3000 / sp; L.vy *= 3000 / sp; }
    L.om = Math.max(-16, Math.min(16, L.om));
    L.x += L.vx * dt; L.y += L.vy * dt; L.th += L.om * dt;
    // acceleration felt by the ink (what makes it slosh)
    const fax = (L.vx - pvx) / dt, fay = (L.vy - pvy) / dt;
    L.ax += (fax - L.ax) * 0.3; L.ay += (fay - L.ay) * 0.3;
    // a little 3D swing from moving through the air
    const trY = Math.max(-0.5, Math.min(0.5, L.vx * 0.00035)), trX = Math.max(-0.5, Math.min(0.5, -L.vy * 0.00035));
    L.ry += (trY - L.ry) * 0.15; L.rx += (trX - L.rx) * 0.15;
    // the surface: a damped spring toward where the felt gravity says it should lie
    const ww = 7 * P.wobble, zz = P.settle;
    const geff = gB + fay;
    const tgtX = P.slosh * (-L.ax / Math.max(300, geff)) + P.slosh * L.om * 0.02;

    L.tvx += (ww * ww * (tgtX - L.tiltX) - 2 * zz * ww * L.tvx) * dt;
    L.tvz += (ww * ww * (tgtZ - L.tiltZ) - 2 * zz * ww * L.tvz) * dt;
    L.tiltX = Math.max(-1.2, Math.min(1.2, L.tiltX + L.tvx * dt));
    L.tiltZ = Math.max(-1.2, Math.min(1.2, L.tiltZ + L.tvz * dt));

}

function updateLevels(dt, now) {
  const fillT = reduced ? 1 : Math.min(1, (now - fillStart) / 1300);
  for (const L of letters) {
    L.group.position.set(L.x, L.y, 0);
    L.group.rotation.set(L.rx, L.ry, L.th, 'ZYX');
    L.group.updateMatrixWorld(true);
    if (L.refill) { L.fill = Math.min(L.target, L.fill + dt * 0.6); if (L.fill >= L.target) L.refill = false; }
    const fill = L.fill * (L.intro ? 1 : fillT);
    _n.set(L.tiltX, 1, L.tiltZ).normalize();
    // the surface normal in the letter's own frame
    _nl.copy(L.group.quaternion).invert();
    const nl = _p.copy(_n).applyQuaternion(_nl);
    const V = L.vol, S = L.sorted;
    for (let i = 0; i < L.nV; i++) S[i] = V[i * 3] * nl.x + V[i * 3 + 1] * nl.y + V[i * 3 + 2] * nl.z;
    S.sort();
    let dLocal;
    if (fill <= 0.002) dLocal = S[0] - 50;
    else dLocal = S[Math.min(L.nV - 1, Math.floor(fill * L.nV))];
    L.plane.n.value.copy(_n);
    L.plane.d.value = dLocal + _n.dot(L.group.position);
    // pour: the neck is under the surface
    const mh = L.mouth.x * nl.x + L.mouth.y * nl.y + L.mouth.z * nl.z;
    if (!L.refill && fillT >= 1 && L.fill > 0 && mh < dLocal) {
      const head = Math.min(1, (dLocal - mh) / (fs * 0.25));
      const rate = P.pour * (0.08 + 0.5 * head);
      const dv = Math.min(L.fill, rate * dt);
      L.fill -= dv;
      L.pourAcc += dv * 900;
      _mouth.copy(L.mouth).applyMatrix4(L.group.matrixWorld);
      const ax = _v.set(0, 1, 0).applyQuaternion(L.group.quaternion);
      while (L.pourAcc >= 1) {
        L.pourAcc -= 1;
        const sp = 140 + 260 * head;
        const c = Math.cos(L.th), s = Math.sin(L.th);
        const mx = _mouth.x - L.x, my = _mouth.y - L.y;
        const evx = L.vx - L.om * my + ax.x * sp + (Math.random() - 0.5) * 50, evy = L.vy + L.om * mx + ax.y * sp + (Math.random() - 0.5) * 50;
        const lag = Math.random() * dt; // spread the frame's drops along the stream, not in one clump
        emit(_mouth.x + evx * lag + (Math.random() - 0.5) * fs * 0.02, _mouth.y + evy * lag + (Math.random() - 0.5) * fs * 0.02, _mouth.z,
          evx, evy, (Math.random() - 0.5) * 30, fs * (0.016 + Math.random() * 0.02));

}

// ---------- input ----------
const mouse = { x: 0, y: 0 };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let touched = false, demoAt = 0, down = null, lastTap = 0, fillStart = 0;
const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), _hitP = new THREE.Vector3();
const toWorld = (cx, cy) => {
  ndc.set((cx / W) * 2 - 1, -(cy / H) * 2 + 1); ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(zPlane, _hitP) ? { x: _hitP.x, y: _hitP.y } : { x: cx - W / 2, y: H / 2 - cy };
};
function hit(cx, cy) {
  ndc.set((cx / W) * 2 - 1, -(cy / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = letters.flatMap((L) => [L.glass, L.neck]);
  const h = ray.intersectObjects(objs, false)[0];
  if (!h) return null;
  const L = letters.find((q) => q.glass === h.object || q.neck === h.object);
  return { L, x: h.point.x, y: h.point.y };
}
cv.addEventListener('pointerdown', (e) => {
  touched = true; demoAt = 0;
  cv.setPointerCapture(e.pointerId);
  const w = toWorld(e.clientX, e.clientY); mouse.x = w.x; mouse.y = w.y;
  const h = hit(e.clientX, e.clientY);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), L: h && h.L, moved: false };
  if (h) {
    const L = h.L, dx = h.x - L.x, dy = h.y - L.y, c = Math.cos(L.th), s = Math.sin(L.th);
    L.grab = { lx: dx * c + dy * s, ly: -dx * s + dy * c };
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', (e) => {
  const w = toWorld(e.clientX, e.clientY); mouse.x = w.x; mouse.y = w.y;
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
  if (!down) cv.style.cursor = hit(e.clientX, e.clientY) ? 'grab' : 'default';
});
const up = () => {
  if (!down) return;
  const now = performance.now();
  for (const L of letters) L.grab = null;
  cv.style.cursor = 'default';
  if (!down.moved && now - down.t < 250) {
    if (now - lastTap < 380) { lastTap = 0; refill(); }
    else { lastTap = now; if (down.L) jiggle(down.L, Math.sign(mouse.x - down.L.x) || 1); }
  }
  down = null;
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function jiggle(L, dir) { L.om -= dir * 4.5; L.vx += dir * 260; L.vy += 120; }

// ---------- loop ----------
let last = performance.now(), ready = false;
const SUB = 3;
function frame(now) {
  requestAnimationFrame(frame);
  if (!ready) return;
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (demoAt && now > demoAt) { demoAt = 0; const L = letters.find((q) => q.ch === 'S') || letters[0]; jiggle(L, 1); }
  for (let k = 0; k < SUB; k++) stepLetters(dt / SUB, now);

  stepDrops(dt);

}
requestAnimationFrame(frame);
window.__inkwell = { letters: () => letters, P, toWorld };

async function rebuild() {
  ready = false;
  if (!font) {
    font = opentype.parse(Uint8Array.from(atob(FREDOKA64), (c) => c.charCodeAt(0)).buffer); // embedded: the artifact sandbox blocks fetch
  }
  await build();
  for (const L of letters) { L.fill = P.fill; L.target = P.fill; }

}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(rebuild, 150); });

// ---------- settings sheet ----------
const KEYS = ['fill', 'puff', 'depth', 'wall', 'wobble', 'settle', 'slosh', 'pour', 'grav', 'spring', 'tint'];
const REBUILD = new Set(['puff', 'depth', 'wall', 'tint']);
const fmt = (v) => (Math.abs(v) >= 10 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3)).replace(/\.?0+$/, '') || '0';
function syncUI() {
  document.documentElement.classList.toggle('dark', !!P.dark);
  $('dark').checked = !!P.dark;
  for (const k of KEYS) { $(k).value = P[k]; $(k + 'O').textContent = fmt(+P[k]); }
}
let bt = 0;
for (const k of KEYS) {
  $(k).addEventListener('input', () => {
    P[k] = +$(k).value; $(k + 'O').textContent = fmt(P[k]); save();
    if (k === 'fill') refill();
    if (REBUILD.has(k)) { clearTimeout(bt); bt = setTimeout(rebuild, 250); }
  });
}
$('dark').addEventListener('change', () => { P.dark = $('dark').checked; save(); syncUI(); rebuild(); });
$('gear').addEventListener('click', () => { const sh = $('sheet'); sh.hidden = !sh.hidden; $('gear').setAttribute('aria-expanded', String(!sh.hidden)); });
$('copy').addEventListener('click', () => { const txt = JSON.stringify(P);
  navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1200); },
    () => { $('copy').textContent = txt; }); });
$('reset').addEventListener('click', () => { Object.assign(P, DEF); save(); syncUI(); rebuild(); });
syncUI();
rebuild();
</script>
