<title>Pin Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the whole page is the pin board; the name is pressed into it from behind. A quiet foot line and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot > * { background: var(--bg); padding: 4px 8px; }                       /* the board is busy: the foot line sits on a little page of its own */
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, pressed into a pin board. Press to push the pins in; double tap to shake it back."></canvas>
<div class="foot"><span><b>Pin screen</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="colour"><span>Colour (the rare easter egg)</span><input type="checkbox" id="colour"></label>
  <label class="row" for="pitch"><span>Pin size</span><output id="pitchO"></output><input type="range" id="pitch" min="4" max="20" step="1" value="8"></label>
  <label class="row" for="finger"><span>Size of a fingertip</span><output id="fingerO"></output><input type="range" id="finger" min="10" max="120" step="2" value="40"></label>
  <label class="row" for="press"><span>How deep a press goes</span><output id="pressO"></output><input type="range" id="press" min="0.2" max="2" step="0.05" value="1"></label>
  <label class="row" for="raise"><span>How far the name stands out</span><output id="raiseO"></output><input type="range" id="raise" min="0.2" max="2" step="0.05" value="1"></label>
  <label class="row" for="tilt"><span>Viewing angle</span><output id="tiltO"></output><input type="range" id="tilt" min="0" max="1.5" step="0.05" value="0.55"></label>
  <label class="row" for="light"><span>Light direction</span><output id="lightO"></output><input type="range" id="light" min="0" max="360" step="5" value="225"></label>
  <div class="acts"><button id="shake" type="button">Shake it back</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl2', { antialias: true, alpha: false, depth: true });
  if (!gl) { document.querySelector('.foot span').textContent = 'This needs WebGL2.'; return; }
  const $ = (id) => document.getElementById(id);
  const P = { colour: false, pitch: 8, finger: 40, press: 1, raise: 1, tilt: 0.55, light: 225 };
  try { Object.assign(P, JSON.parse(localStorage.getItem('pins') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('pins', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PAL = { dark: ['#2ee6ff', '#6fe0a0', '#d4f01a', '#ff4fe0', '#ff5a9a', '#ff6b5e'], light: ['#0a7fb5', '#0f9d8a', '#4a9a1a', '#c2185b', '#e0455a', '#e8652e'] };

  // One quad per pin, twice: first its shadow on whatever is lower, then its round head. Height h: 0 flush with the board, + stands out, - pushed in.
  const VS = `#version 300 es
  layout(location=0) in vec2 aC;
  layout(location=1) in vec2 iP;     // where the pin sits (css px)
  layout(location=2) in vec2 iH;     // its height, and how touched it is (0..1)
  uniform vec2 uRes; uniform float uR, uScale, uShadow; uniform vec2 uView, uLight;
  out vec2 vC; out float vH; out float vT;
  float depthOf(float h) { return 0.5 - h * 0.18; }
  void main() {
    float h = iH.x * uScale;
    vec2 head = iP + uView * h;                        // a pin that stands out is seen a little to one side (the board is viewed at an angle)
    vec2 p = uShadow > 0.5 ? head + uLight * (h + 1.6) * uR * 0.9 : head;   // its shadow falls away from the light
    float r = uShadow > 0.5 ? uR * 1.25 : uR;
    vec2 q = p + aC * r;
    vC = aC; vH = h; vT = iH.y;
    gl_Position = vec4(q.x / uRes.x * 2.0 - 1.0, 1.0 - q.y / uRes.y * 2.0, depthOf(h) * 2.0 - 1.0, 1.0);
  }`;
  const FS_HEAD = `#version 300 es
  precision highp float;
  in vec2 vC; in float vH; in float vT;
  uniform vec3 uL; uniform float uAlb, uCol; uniform vec3 uG[6]; uniform vec2 uRes;
  out vec4 o;
  vec3 grad(float t) { t = clamp(t, 0.0, 1.0);
    if (t < 0.24) return mix(uG[0], uG[1], t / 0.24); if (t < 0.46) return mix(uG[1], uG[2], (t - 0.24) / 0.22);
    if (t < 0.54) return mix(uG[2], uG[3], (t - 0.46) / 0.08); if (t < 0.77) return mix(uG[3], uG[4], (t - 0.54) / 0.23); return mix(uG[4], uG[5], (t - 0.77) / 0.23); }
  void main() {
    float r2 = dot(vC, vC); if (r2 > 1.0) discard;
    vec3 n = normalize(vec3(vC * 0.85, sqrt(1.0 - r2 * 0.72)));      // a shallow dome: the head of a pin
    float dif = max(dot(n, uL), 0.0), spec = pow(max(dot(reflect(-uL, n), vec3(0.0, 0.0, 1.0)), 0.0), 40.0);
    float rim = smoothstep(0.78, 1.0, sqrt(r2));
    float closer = clamp(0.88 + vH * 0.08, 0.6, 1.1);                  // nearer the eye, a little brighter
    vec3 base = vec3(uAlb);
    base = mix(base, grad(gl_FragCoord.y / uRes.y) * 0.95, uCol * vT); // colour: only the pins you pressed
    vec3 c = base * (0.32 + 0.68 * dif) * closer + spec * 0.55 - rim * 0.28 * uAlb;
    o = vec4(c, 1.0);
    gl_FragDepth = gl_FragCoord.z - (1.0 - r2) * 0.004;
  }`;
  const FS_SHADOW = `#version 300 es
  precision highp float;
  in vec2 vC; out vec4 o; uniform float uDark;
  void main() { float r2 = dot(vC, vC); if (r2 > 1.0) discard; float a = (1.0 - r2) * (1.0 - r2) * uDark; o = vec4(0.0, 0.0, 0.0, a); }`;
  const mk = (vs, fs) => { const p = gl.createProgram(); for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); gl.attachShader(p, x); } gl.linkProgram(p); const c = {}; return { p, u: (n) => c[n] ?? (c[n] = gl.getUniformLocation(p, n)) }; };
  const pHead = mk(VS, FS_HEAD), pShadow = mk(VS, FS_SHADOW);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const bufP = gl.createBuffer(), bufH = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufH); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(2, 1);

  // ---------- the board ----------
  let W = 1, H = 1, dpr = 1, N = 0, cols = 0, rows = 0, ox = 0, oy = 0, pitch = 8;
  let PX, HT, VL, NAME, TG, HB, dirty = true, dark = false, shaking = 0;
  async function build() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    try { await Promise.race([document.fonts.load('900 100px Archivo'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fallback */ }
    pitch = P.pitch; cols = Math.ceil(W / pitch) + 2; rows = Math.ceil(H / pitch) + 2; N = cols * rows;
    ox = (W - (cols - 1) * pitch) / 2; oy = (H - (rows - 1) * pitch) / 2;
    // the name, as a mask the size of the board (one cell per pin, four samples each, so edges come out soft)
    const k = 2, m = document.createElement('canvas'); m.width = cols * k; m.height = rows * k; const x = m.getContext('2d', { willReadFrequently: true });
    const face = getComputedStyle(document.documentElement).getPropertyValue('--display');
    const portrait = W / H < 0.8, lines = portrait ? ['IDAN', 'SE', 'GEV'] : ['IDAN', 'SEGEV'];
    x.font = '900 100px ' + face; const widest = Math.max(...lines.map((l) => x.measureText(l).width));
    const size = Math.min(m.width * 0.84 / widest * 100, m.height * (portrait ? 0.22 : 0.34));
    x.font = '900 ' + size + 'px ' + face; x.textAlign = 'center'; x.fillStyle = '#000';
    const lead = size * 0.93, top = m.height / 2 - (lines.length * lead) / 2 + size * 0.78 - m.height * 0.02;
    lines.forEach((l, i) => x.fillText(l, m.width / 2, top + i * lead));
    const d = x.getImageData(0, 0, m.width, m.height).data;
    PX = new Float32Array(N * 2); HT = new Float32Array(N); VL = new Float32Array(N); NAME = new Float32Array(N); TG = new Float32Array(N); HB = new Float32Array(N * 2);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const n = j * cols + i; PX[n * 2] = ox + i * pitch; PX[n * 2 + 1] = oy + j * pitch;
      let s = 0; for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) s += d[((j * k + b) * m.width + i * k + a) * 4 + 3] / 255;
      NAME[n] = s / (k * k); HT[n] = NAME[n] * P.raise;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, bufP); gl.bufferData(gl.ARRAY_BUFFER, PX, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufH); gl.bufferData(gl.ARRAY_BUFFER, HB.byteLength, gl.DYNAMIC_DRAW);
    dirty = true;
  }

  // ---------- touch: a press pushes the pins in under your fingertip; held, it goes deeper; a double tap shakes the board back ----------
  let press = null, lastTap = 0;
  function pushAt(px, py, depth) {
    const R = P.finger, ci = (px - ox) / pitch, cj = (py - oy) / pitch, rc = Math.ceil(R / pitch) + 1;
    for (let j = Math.max(0, Math.floor(cj - rc)); j <= Math.min(rows - 1, Math.ceil(cj + rc)); j++)
      for (let i = Math.max(0, Math.floor(ci - rc)); i <= Math.min(cols - 1, Math.ceil(ci + rc)); i++) {
        const n = j * cols + i, dx = PX[n * 2] - px, dy = PX[n * 2 + 1] - py, d = Math.hypot(dx, dy) / R; if (d >= 1.15) continue;
        const shape = d < 1 ? -depth * Math.sqrt(1 - d * d) : 0;                   // a fingertip is round: deepest in the middle
        const floor = shape + Math.max(0, d - 0.85) * 2.5;                          // the pins at the rim are only nudged
        if (HT[n] > floor) { HT[n] = floor; VL[n] = 0; TG[n] = 1; }
      }
    dirty = true;
  }
  cv.addEventListener('pointerdown', (e) => {
    const now = performance.now();
    if (now - lastTap < 340 && press === null) { shake(); lastTap = 0; return; }
    lastTap = now; press = { x: e.clientX, y: e.clientY, t: now, depth: 0.25 * P.press };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    pushAt(e.clientX, e.clientY, press.depth);
  });
  cv.addEventListener('pointermove', (e) => { if (!press) return; press.x = e.clientX; press.y = e.clientY; pushAt(press.x, press.y, press.depth); });
  const up = () => { press = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function shake() { shaking = reduced ? 0.01 : 1.4; for (let n = 0; n < N; n++) { VL[n] = (Math.random() - 0.5) * 3; TG[n] = 0; } dirty = true; }

  // ---------- the frame ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (press) { press.depth = Math.min(1.6 * P.press, press.depth + dt * 1.4 * P.press); pushAt(press.x, press.y, press.depth); }   // holding still presses deeper
    if (shaking > 0) {                                                        // the shake: every pin springs back to where the name puts it, with a rattle
      shaking -= dt;
      for (let n = 0; n < N; n++) { const target = NAME[n] * P.raise; VL[n] += (target - HT[n]) * 140 * dt; VL[n] *= Math.exp(-dt * 9); HT[n] += VL[n] * dt; }
      if (shaking <= 0) for (let n = 0; n < N; n++) { HT[n] = NAME[n] * P.raise; VL[n] = 0; }
      dirty = true;
    }
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(frame);
  }
  function draw() {
    for (let n = 0; n < N; n++) { HB[n * 2] = HT[n]; HB[n * 2 + 1] = TG[n]; }
    gl.bindBuffer(gl.ARRAY_BUFFER, bufH); gl.bufferSubData(gl.ARRAY_BUFFER, 0, HB);
    gl.viewport(0, 0, cv.width, cv.height);
    const bg = dark ? 0.0 : 1.0; gl.clearColor(bg, bg, bg, 1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const a = P.light * Math.PI / 180, lx = Math.cos(a), ly = Math.sin(a);   // where the light is, seen from a pin (screen y down: 225° is up and to the left)
    const L = [lx * 0.62, ly * 0.62, 0.78], view = [P.tilt * pitch * 0.55, P.tilt * pitch * 0.75];
    const common = (pr, shadow) => {
      gl.useProgram(pr.p); gl.bindVertexArray(vao);
      gl.uniform2f(pr.u('uRes'), W, H); gl.uniform1f(pr.u('uR'), pitch * 0.47); gl.uniform1f(pr.u('uScale'), 1);
      gl.uniform1f(pr.u('uShadow'), shadow ? 1 : 0); gl.uniform2f(pr.u('uView'), view[0], view[1]); gl.uniform2f(pr.u('uLight'), -lx, -ly);
    };
    // heads, with depth
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true); gl.disable(gl.BLEND);
    common(pHead, false);
    gl.uniform3fv(pHead.u('uL'), new Float32Array(L.map((v) => v / Math.hypot(...L))));
    gl.uniform1f(pHead.u('uAlb'), dark ? 0.78 : 0.97); gl.uniform1f(pHead.u('uCol'), P.colour ? 1 : 0);
    gl.uniform3fv(pHead.u('uG[0]'), new Float32Array(PAL[dark ? 'dark' : 'light'].flatMap((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255))));
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
    // shadows: each pin darkens only what is lower than its head (depth test), so a raised letter throws its shade across the flat pins beside it
    gl.depthMask(false); gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
    common(pShadow, true); gl.uniform1f(pShadow.u('uDark'), dark ? 0.7 : 0.5);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
    gl.depthMask(true);
  }

  // ---------- settings (for this test only) ----------
  const fmt = { pitch: (v) => v + ' px', finger: (v) => v + ' px', press: (v) => '×' + (+v).toFixed(2), raise: (v) => '×' + (+v).toFixed(2), tilt: (v) => (+v).toFixed(2), light: (v) => v + '°' };
  $('colour').checked = P.colour; $('colour').addEventListener('change', () => { P.colour = $('colour').checked; save(); dirty = true; });
  for (const key of Object.keys(fmt)) { $(key).value = P[key]; $(key + 'O').textContent = fmt[key](P[key]); $(key).addEventListener('input', () => { P[key] = +$(key).value; $(key + 'O').textContent = fmt[key](P[key]); save(); if (key === 'pitch') rebuild(); else if (key === 'raise') shake(); dirty = true; }); }
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('shake').addEventListener('click', shake);
  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(P, null, 2)).then(() => { $('copy').textContent = 'Copied'; }, () => { $('copy').textContent = 'Copy blocked'; })
      .finally(() => setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1600));
  });
  let rt = 0; const rebuild = () => { clearTimeout(rt); rt = setTimeout(build, 200); };
  addEventListener('resize', rebuild);
  const readTheme = () => { dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#000000'; dirty = true; };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  readTheme(); build().then(() => requestAnimationFrame(frame));
})();
</script>
