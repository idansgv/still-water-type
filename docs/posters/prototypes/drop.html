<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed WebGL stage (glass letters falling onto a seamless studio floor), a quiet foot line and a test-only settings sheet. */
:root {
  --bg: #141414; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.94);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; color-scheme: dark;
}
:root[data-theme="light"] { --bg: #f1f1f1; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.95); color-scheme: light; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.sheet h3 { margin: 6px 0 -4px; font: 500 11px/1 var(--mono); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row select { grid-column: 1 / -1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 5px 6px; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<script type="module">
import * as THREE from 'three';

import opentype from 'https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js';

const $ = (id) => document.getElementById(id);
const ALBUMS = [['Pink Moon', 'Nick Drake'], ['Kind of Blue', 'Miles Davis'], ['Blue Train', 'John Coltrane'], ['Giant Steps', 'John Coltrane'], ['Time Out', 'The Dave Brubeck Quartet'],

// ---------- settings ----------
const DEF = {   // Idan's tuned values, 3 Nov 2026 (the same for the light and the dark studio)

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// reflections: a black room with softboxes, so glass shows hard light and dark
function studioEnv(light) {
  const s = new THREE.Scene(); s.background = new THREE.Color(light ? 0x9a9a9a : 0x000000);

  box(16, 3, 0, 9, 3, 22); box(0.8, 12, -8, 2, 5, 30); box(0.8, 10, 8, 2, -3, 16); box(30, 1.2, 0, 1.2, 12, 9); box(0.5, 6, 3, 3, 10, 24); box(6, 6, 2, -6, 5, 0.6); box(24, 9, 0, 7, -10, 2.2); box(40, 40, 0, 14, 0, 0.35);   // bright, thin strips: hard glints on glass
  return pmrem.fromScene(s, 0.02).texture;
}
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false; controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 3; controls.maxDistance = 40;

const spot = new THREE.DirectionalLight(0xffffff, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0003;
Object.assign(spot.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 0.5, far: 40 });
scene.add(spot, spot.target);
const fill = new THREE.HemisphereLight(0xffffff, 0x000000, 0.3); scene.add(fill);
const floorMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, transmission: 1, specularIntensity: 1 });

const MATS = [glassMat, breakMat];

  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  const bg = light ? 0xf1f1f1 : 0x141414;
  scene.background = new THREE.Color(bg); scene.fog = null;
  floorMat.opacity = light ? 0.22 : 0.75;
  scene.environment = studioEnv(light);
  spot.intensity = light ? 2.4 : 2.8; fill.intensity = light ? 0.9 : 0.05; scene.environmentIntensity = light ? 1 : 1.4;
  for (const m of MATS) {
    m.roughness = m === breakMat ? Math.min(1, P.rough + 0.12) : P.rough;
    m.ior = P.ior; m.thickness = P.depth; m.dispersion = P.disp;
    m.attenuationColor.setScalar(light ? 0.5 : 0.45); m.attenuationDistance = P.absorb;   // Beer-Lambert: thick glass darkens
    m.envMapIntensity = P.env; m.needsUpdate = true;
  }
  renderer.toneMappingExposure = P.exposure;
}

  controls.target.set(0, 0.45, 0);
  camera.position.set(0, 0.45 + dist * Math.sin(0.26), dist * Math.cos(0.26));
  // backlight: the pool sits just behind the title, so the glass is seen against light and its thick edges go dark
  spot.position.set(-3, 12, 4); spot.target.position.set(0, 0, 0);
  controls.update();
}
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frameCamera(true);
}
addEventListener('resize', resize);

// ---------- loop ----------
let paused = false, last = performance.now(), nextDrop = 0;
// pieces go when their time is up: the floor lets go under them and they fall through it into the dark,
// and anything resting on them wakes and follows them down or settles
function life() {
  for (const b of [...bodies]) {
    if (b.wait > 0 || realT < b.dieAt) continue;
    if (!b.dying) {
      b.dying = true;
      if (P.go === 'dissolve') {   // its own copy of the glass, so it can fade alone where it lies
        b.mesh.material = MATS.map((m) => { const c = m.clone(); c.transparent = true; c.depthWrite = false; return c; });
        continue;
      }
      wake(b);
      if (P.go !== 'slide away') b.w.add(_a.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(1.5));   // a slight tumble as it drops
      for (const o of bodies) if (o.asleep && o.p.distanceTo(b.p) < b.sol.r + o.sol.r + 0.1) wake(o);
    }
    if (P.go === 'dissolve' && Array.isArray(b.mesh.material) && b.mesh.material[0] !== glassMat) {
      const k = Math.min(1, (realT - b.dieAt) / P.fade), o = 1 - k * k * (3 - 2 * k);
      for (const m of b.mesh.material) m.opacity = o;
      b.mesh.castShadow = o > 0.35;
      if (k >= 1) remove(b);
      continue;
    }
    if (b.p.y < -b.sol.r - 0.5 || Math.abs(b.p.x) > 40 || Math.abs(b.p.z) > 40) remove(b);   // gone below the floor, or slid out of sight
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { realT += dt; advance(dt * P.timeScale); life(); if (P.loop > 0 && !reduced && realT >= nextDrop) dropTitle(); }
  controls.update(); renderer.render(scene, camera);
}

// ---------- gestures: tap drops the title again; drag orbits ----------
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) dropTitle(); down = null; });
addEventListener('keydown', (e) => { if (e.target.closest && e.target.closest('.sheet')) return; if (e.code === 'Space') { e.preventDefault(); paused = !paused; } else if (e.code === 'Enter') dropTitle(); });

// ---------- settings sheet (test only) ----------
function fmt(v, step) { const d = String(step).includes('.') ? String(step).split('.')[1].length : 0; return Number(v).toFixed(d); }
function buildSheet() {
  const sh = $('sheet'); sh.innerHTML = '';
  for (const s of SPEC) {
    if (s.length === 1) { const h = document.createElement('h3'); h.textContent = s[0]; sh.append(h); continue; }
    const [k, label, a, b, step] = s, row = document.createElement('label'); row.className = 'row'; row.htmlFor = k;
    const name = document.createElement('span'); name.textContent = label; row.append(name);
    if (Array.isArray(a)) {
      const sel = document.createElement('select'); sel.id = k;
      for (const o of a) { const [val, txt] = Array.isArray(o) ? o : [o, o]; sel.add(new Option(txt, val)); }
      sel.value = P[k]; sel.addEventListener('change', () => { P[k] = typeof DEF[k] === 'number' ? +sel.value : sel.value; save(); onChange(k); }); row.append(sel);
    } else {
      const out = document.createElement('output'); out.id = k + 'O'; out.textContent = fmt(P[k], step);
      const r = document.createElement('input'); r.type = 'range'; r.id = k; r.min = a; r.max = b; r.step = step; r.value = P[k];
      r.addEventListener('input', () => { P[k] = +r.value; out.textContent = fmt(P[k], step); save(); onChange(k); });
      row.append(out, r);
    }
    sh.append(row);
  }
  const acts = document.createElement('div'); acts.className = 'acts';
  const btn = (t, f) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.addEventListener('click', f); acts.append(b); return b; };
  btn('Drop again', dropTitle);
  btn('Clear the floor', () => { while (bodies.length) remove(bodies[0]); drops = 0; dropTitle(); });
  const cp = btn('Copy settings', () => { const t = JSON.stringify(P); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => {}); cp.textContent = 'Copied'; setTimeout(() => (cp.textContent = 'Copy settings'), 1200); });
  btn('Reset', () => { Object.assign(P, DEF); save(); buildSheet(); applyLook(); });
  sh.append(acts);
}
function onChange(k) {
  if (['page', 'rough', 'ior', 'disp', 'absorb', 'env', 'exposure', 'depth'].includes(k)) applyLook();
  if (k === 'album') { while (bodies.length) remove(bodies[0]); drops = 0; dropTitle(); }
}
$('gear').addEventListener('click', () => { const h = $('sheet').hidden; $('sheet').hidden = !h; $('gear').setAttribute('aria-expanded', String(h)); });

// ---------- start ----------
window.poster = { advance: (s) => { realT += s / P.timeScale; advance(s); life(); if (P.loop > 0 && realT >= nextDrop) dropTitle(); controls.update(); renderer.render(scene, camera); }, drop: dropTitle, bodies, pause: (v) => { paused = v; } };
buildSheet(); applyLook(); resize(); dropTitle();
if (reduced) { paused = true; for (let i = 0; i < 30; i++) advance(0.2); }   // reduced motion: the pile, already settled
requestAnimationFrame(frame);
</script>
