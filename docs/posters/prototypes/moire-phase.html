<title>Phases</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Bricolage+Grotesque:opsz,wght@96,800&family=Inter+Tight:wght@900&family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed poster, two voices of lines bent in 3D and nothing else; a quiet mono line at the foot; a settings sheet for this test only. Black and white, the page colour is a setting. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #7a7a7a; --line: rgba(0, 0, 0, 0.16); --sheet: rgba(255, 255, 255, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
body.dark { --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot > span { background: var(--bg); padding: 2px 6px; margin-left: -6px; }
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; background: var(--bg); padding: 8px 6px; margin-right: -6px; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
select { border: 1px solid var(--line); padding: 4px 6px; background: var(--bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.sheet h3 { margin: 4px 0 -4px; font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Phases: fine lines bent in 3D drift through space in two voices, one lagging behind the other, each playing the Piano Phase figure. Drag across to tune the second voice; when the two fall into step Idan Segev appears among them."></canvas>
<div class="foot"><span><b>Phases</b> &nbsp;tune · draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <h3>Space</h3>
  <label class="row" for="fold"><span>Bend depth</span><output id="foldO"></output><input type="range" id="fold" min="0" max="0.8" step="0.01" value="0.53"></label>
  <label class="row" for="scale"><span>Bend size (small ↔ large)</span><output id="scaleO"></output><input type="range" id="scale" min="0.2" max="2" step="0.05" value="0.45"></label>
  <label class="row" for="breath"><span>Bends travel (0 = still)</span><output id="breathO"></output><input type="range" id="breath" min="0" max="1.5" step="0.01" value="0.8"></label>
  <label class="row" for="pitch"><span>View tilt (°)</span><output id="pitchO"></output><input type="range" id="pitch" min="0" max="58" step="1" value="38"></label>
  <label class="row" for="yaw"><span>View turn (°)</span><output id="yawO"></output><input type="range" id="yaw" min="-45" max="45" step="1" value="7"></label>
  <label class="row" for="zoom"><span>Zoom</span><output id="zoomO"></output><input type="range" id="zoom" min="0.5" max="2.5" step="0.05" value="1.25"></label>
  <h3>Lines</h3>
  <label class="row" for="lines"><span>Lines across the height</span><output id="linesO"></output><input type="range" id="lines" min="40" max="260" step="2" value="138"></label>
  <label class="row" for="weight"><span>Line weight</span><output id="weightO"></output><input type="range" id="weight" min="0.1" max="0.8" step="0.01" value="0.42"></label>
  <label class="row" for="light"><span>Light shapes the weight</span><output id="lightO"></output><input type="range" id="light" min="0" max="1" step="0.01" value="0.55"></label>
  <h3>Voice 2</h3>
  <label class="row" for="tempo"><span>Spacing apart at half cycle</span><output id="tempoO"></output><input type="range" id="tempo" min="-0.06" max="0.06" step="0.001" value="0.022"></label>
  <label class="row" for="tilt"><span>Angle apart at half cycle (°)</span><output id="tiltO"></output><input type="range" id="tilt" min="-8" max="8" step="0.05" value="1.2"></label>
  <label class="row" for="cycle"><span>One full cycle (s)</span><output id="cycleO"></output><input type="range" id="cycle" min="6" max="120" step="1" value="50"></label>
  <label class="row" for="steps"><span>Reich steps per cycle (0 = smooth)</span><output id="stepsO"></output><input type="range" id="steps" min="0" max="16" step="1" value="12"></label>
  <label class="row" for="pause"><span>Time held on each step</span><output id="pauseO"></output><input type="range" id="pause" min="0" max="0.9" step="0.05" value="0.4"></label>
  <h3>Your hand (voice 2)</h3>
  <label class="row" for="span"><span>Drag across = this much of a cycle</span><output id="spanO"></output><input type="range" id="span" min="0.25" max="2" step="0.05" value="1"></label>
  <label class="row" for="snap"><span>Snap into unison within</span><output id="snapO"></output><input type="range" id="snap" min="0" max="0.1" step="0.005" value="0.035"></label>
  <h3>Sound</h3>
  <label class="row" for="sound"><span>Sound (starts on first touch)</span><output id="soundO"></output><input type="range" id="sound" min="0" max="1" step="1" value="1"></label>
  <label class="row" for="volume"><span>Volume</span><output id="volumeO"></output><input type="range" id="volume" min="0" max="1" step="0.01" value="0.5"></label>
  <label class="row" for="note"><span>Note length (ms)</span><output id="noteO"></output><input type="range" id="note" min="90" max="300" step="5" value="150"></label>
  <h3>Name</h3>
  <label class="row" for="size"><span>Name width</span><output id="sizeO"></output><input type="range" id="size" min="0.4" max="0.96" step="0.01" value="0.79"></label>
  <label class="row" for="face"><span>Face</span><span></span><select id="face" style="grid-column: 1 / -1"></select></label>
  <label class="row" for="dark"><span>Black page</span><output id="darkO"></output><input type="range" id="dark" min="0" max="1" step="1" value="0"></label>
  <div class="acts"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) { document.querySelector('.foot span').textContent = 'This needs WebGL2.'; return; }
  const $ = (id) => document.getElementById(id);
  const FACES = [['Archivo Black', 400], ['Anton', 400], ['Bricolage Grotesque', 800], ['Inter Tight', 900], ['Alfa Slab One', 400]];
  const DEF = { fold: 0.51, scale: 0.65, breath: 1.07, pitch: 28, yaw: -8, zoom: 2, lines: 178, weight: 0.28, light: 0.69,
    tempo: 0.018, tilt: 1.15, cycle: 50, steps: 12, pause: 0.4, size: 0.79, face: 4, dark: 0,
    span: 1, snap: 0.035, sound: 1, volume: 0.5, note: 150 };
  const P = { ...DEF };
  try { Object.assign(P, JSON.parse(localStorage.getItem('moire-tune') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('moire-tune', JSON.stringify(P)); } catch (e) {} };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // the strands: each one runs along x through a field of long bends in z (and a little in y); a voice is the whole set at one phase of the bends
  const PX = 5, PY = 4;                                   // half-extent of the strand field in world units; the view is 2 units tall
  const SEG = 360;                                        // segments per strand
  const VS = `#version 300 es
  uniform mat4 uMVP; uniform vec2 uRes; uniform sampler2D uMask;
  uniform float uFold, uScale, uT, uPh, uSp, uEps, uTilt, uW, uLight, uFocal, uLetters;
  uniform int uSeg, uN;
  out float vD; out float vHalf; out float vA;
  vec3 strand(float s, float y0) {
    vec2 q = vec2(s, y0);
    float c = cos(uTilt), si = sin(uTilt);
    q = vec2(c * q.x - si * q.y, si * q.x + c * q.y) / uScale;   // voice 2 leans a hair against voice 1 while it is out of step
    float a = uPh * 6.28318;
    float z = uFold * (0.60 * sin(q.x * 1.10 + q.y * 0.85 + a + uT * 0.6)
                     + 0.24 * sin(q.x * 2.55 - q.y * 1.50 + 1.3 * a + uT)
                     + 0.16 * sin((q.x + q.y) * 1.60 + 2.0 - uT * 0.7));
    float y = y0 + uFold * 0.10 * sin(q.x * 1.65 + q.y * 2.0 + a + uT * 0.5);
    return vec3(s, y, z);
  }
  vec2 scr(vec4 c) { return c.xy / c.w * 0.5 * uRes; }
  // voice 1 steps half a line over wherever it crosses a letter on screen; voice 2 never does
  float y0At(float s, float i) {
    float y0 = (i - float(uN) * 0.5) * uSp * (1.0 + uEps);
    if (uLetters > 0.5) {
      vec4 c = uMVP * vec4(strand(s, y0), 1.0);
      float m = textureLod(uMask, c.xy / c.w * 0.5 + 0.5, 0.0).r;
      y0 += 0.5 * uSp * m;
    }
    return y0;
  }
  void main() {
    int k = gl_VertexID / 2; float side = float(gl_VertexID % 2) * 2.0 - 1.0;
    float i = float(gl_InstanceID);
    float ds = ${(2 * PX / SEG).toFixed(6)};
    float s = -${PX.toFixed(1)} + float(k) * ds;
    float y0 = y0At(s, i);
    vec3 p = strand(s, y0), pn = strand(s + ds * 0.5, y0At(s + ds * 0.5, i));
    vec4 c = uMVP * vec4(p, 1.0), cn = uMVP * vec4(pn, 1.0);
    vec2 a = scr(c), b = scr(cn), t = b - a;
    vec2 n = length(t) > 1e-5 ? normalize(vec2(-t.y, t.x)) : vec2(0.0, 1.0);
    // lines thicken in shade and thin where the light hits, from the slope of the bends
    vec3 py = strand(s, y0 + uSp);
    vec3 nrm = normalize(cross(pn - p, py - p)); if (nrm.z < 0.0) nrm = -nrm;
    float lit = clamp(dot(nrm, normalize(vec3(-0.5, 0.6, 0.65))), 0.0, 1.0);
    float w = clamp(uW * mix(1.0, 1.6 - 1.2 * lit, uLight), 0.06, 0.94);
    float wpx = w * uSp * uFocal / c.w;                    // width in device pixels, shrinking with depth
    vHalf = max(wpx, 1.0) * 0.5; vA = min(wpx, 1.0);        // finer than a pixel: keep a pixel, fade it
    float hw = vHalf + 1.0; vD = side * hw;
    vec2 o = a + n * side * hw;
    gl_Position = vec4(o / (0.5 * uRes) * c.w, c.z, c.w);
  }`;
  const FS = `#version 300 es
  precision highp float;
  in float vD; in float vHalf; in float vA;
  uniform vec3 uInk; uniform vec2 uRes; uniform float uCut;
  out vec4 o;
  void main() {
    if (gl_FragCoord.y / uRes.y > 1.0 - uCut) discard;     // the reveal lifts voice 2 off, top first
    float cov = clamp(vHalf + 0.5 - abs(vD), 0.0, 1.0) * vA;
    o = vec4(uInk, cov);
  }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const u = {}; ['uMVP', 'uRes', 'uMask', 'uFold', 'uScale', 'uT', 'uPh', 'uSp', 'uEps', 'uTilt', 'uW', 'uLight', 'uFocal', 'uLetters', 'uSeg', 'uN', 'uInk', 'uCut']
    .forEach((n) => { u[n] = gl.getUniformLocation(prog, n); });
  const vao = gl.createVertexArray();                    // no attributes: every vertex is worked out from its ids

  // the name lives on the screen, so it reads from any angle; only voice 1 knows about it
  let W = 0, H = 0, dpr = 1, cw = 0, chh = 0;
  const maskT = gl.createTexture();
  const mc = document.createElement('canvas'), mx = mc.getContext('2d');
  const font = (px) => { const [f, w] = FACES[P.face]; return `${w} ${px}px "${f}", "Arial Black", sans-serif`; };
  const buildMask = () => {
    mc.width = Math.round(W); mc.height = Math.round(H); mx.fillStyle = '#000'; mx.fillRect(0, 0, W, H);
    const lines = W / H < 1.3 ? ['Idan', 'Segev'] : ['Idan Segev'];
    mx.font = font(100); const wide = Math.max(...lines.map((l) => mx.measureText(l).width));
    let px = 100 * W * P.size / wide; const lh = 0.98;
    px = Math.min(px, H * 0.7 / (lines.length * lh));
    mx.font = font(px); mx.fillStyle = '#fff'; mx.textAlign = 'center';
    const met = mx.measureText('ISg'), cap = met.actualBoundingBoxAscent, desc = met.actualBoundingBoxDescent;
    const block = cap + desc + (lines.length - 1) * px * lh, top = (H - block) / 2 + cap;
    lines.forEach((l, i) => mx.fillText(l, W / 2, top + i * px * lh));
    gl.bindTexture(gl.TEXTURE_2D, maskT);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mc);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cw = Math.round(W * dpr); chh = Math.round(H * dpr); cv.width = cw; cv.height = chh; buildMask();
  };

  // camera
  const mul = (a, b) => { const r = new Float32Array(16);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; r[i * 4 + j] = s; } return r; };
  const persp = (fov, asp, n, f) => { const t = 1 / Math.tan(fov / 2);
    return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]); };
  const look = (e, c) => {
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], nrm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
    const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const f = nrm(sub(c, e)), s = nrm(cr(f, [0, 1, 0])), v = cr(s, f);
    return new Float32Array([s[0], v[0], -f[0], 0, s[1], v[1], -f[1], 0, s[2], v[2], -f[2], 0, -dot(s, e), -dot(v, e), dot(f, e), 1]);
  };
  const FOV = 30 * Math.PI / 180;
  const camera = (pitch, yaw) => {
    const d = 1 / Math.tan(FOV / 2) / P.zoom, p = pitch * Math.PI / 180, y = yaw * Math.PI / 180;
    const e = [d * Math.sin(p) * Math.sin(y), -d * Math.sin(p) * Math.cos(y), d * Math.cos(p)];
    return mul(persp(FOV, W / H, 0.05, 40), look(e, [0, 0, 0]));
  };

  // the second player: a clock that drifts ahead (smoothly or in Reich's steps), plus whatever the hand adds
  let tau = 0, off = 0, offT = 0, lock = 0, cut = 0, reveal = 0, t = 0;
  let orbX = 0, orbY = 0, orbXT = 0, orbYT = 0;
  const sched = (x) => {
    const n = P.steps; if (!n) return x;
    const s = x * n, k = Math.floor(s), f = s - k, h = P.pause;
    const g = f < h ? 0 : (f - h) / (1 - h); const e = g * g * (3 - 2 * g);
    return (k + e) / n;
  };
  const beat = () => 1 / (P.steps || 12);

  // ---------- sound: both voices play the Piano Phase figure; voice 2 sits as many notes ahead as its bends lag ----------
  const FIG = [64, 66, 71, 73, 74, 66, 64, 73, 71, 66, 74, 73];    // E F# B C# D F# E C# B F# D C#
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  let ac = null, master = null, nextT = 0, slot = 0, noise = null;
  const ensureAudio = () => {
    if (!P.sound) return;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.connect(ac.destination);
      noise = ac.createBuffer(1, Math.round(ac.sampleRate * 0.04), ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
      nextT = ac.currentTime + 0.12;
    }
    if (ac.state === 'suspended') ac.resume();
  };
  const note = (t, m, pan, amp) => {                  // a soft struck tone: triangle and an octave, quick attack, long decay
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain(), p = ac.createStereoPanner();
    o.type = 'triangle'; o.frequency.value = hz(m); o2.type = 'sine'; o2.frequency.value = hz(m) * 2; g2.gain.value = 0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(p); p.connect(master); p.pan.value = pan;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.8);
    o.start(t); o2.start(t); o.stop(t + 0.85); o2.stop(t + 0.85);
  };
  const click = () => {                               // the name snaps in
    if (!ac || !P.sound) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = 2400; g.gain.value = 0.5;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  };
  const playAudio = (lag) => {
    if (!ac || ac.state !== 'running') return;
    master.gain.setTargetAtTime(P.sound ? P.volume * 0.35 : 0, ac.currentTime, 0.05);
    if (!P.sound) { nextT = ac.currentTime + 0.1; return; }
    const d = P.note / 1000, b = lag * 12, ahead = Math.ceil(b - 1e-6);
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.02;
    while (nextT < ac.currentTime + 0.12) {
      note(nextT, FIG[slot % 12], -0.45, 0.5);                                                         // voice 1, left
      note(nextT + (ahead - b) * d, FIG[(slot + ahead) % 12], 0.45, 0.5);                               // voice 2, right
      slot++; nextT += d;
    }
  };

  // drag across tunes voice 2 against voice 1 (it holds still while you do); it snaps into unison when you come close
  let down = null, taps = [], tapTimer = 0;
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId); ensureAudio();
    down = { x: e.clientX, y: e.clientY, t: performance.now(), far: 0, drag: false, mode: null, o0: offT, oy: orbYT, snapped: false };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down.far = Math.max(down.far, Math.hypot(dx, dy));
    if (down.far > 8 && !down.drag) { down.drag = true; down.mode = Math.abs(dx) >= Math.abs(dy) ? 'tune' : 'tilt'; }
    if (down.mode === 'tune') {
      const raw = down.o0 + dx / W * P.span, total = sched(tau) + raw, dd = total - Math.round(total);
      const near = Math.abs(dd) < P.snap;
      offT = near ? raw - dd : raw;
      if (near && !down.snapped) click();
      down.snapped = near;
    } else if (down.mode === 'tilt') {                 // a vertical drag tilts the view through the strands, then springs back
      orbYT = Math.max(-P.pitch, Math.min(58 - P.pitch, down.oy - dy / H * 70));
    }
  });
  const up = () => {
    if (!down) return;
    const now = performance.now(), quick = now - down.t < 250 && down.far < 8;
    if (quick) {
      taps = taps.filter((x) => now - x < 760); taps.push(now);
      const n = taps.length; clearTimeout(tapTimer);
      if (n === 1) tapTimer = setTimeout(() => { offT += beat(); }, 380);                                  // one beat ahead
      else if (n === 2) tapTimer = setTimeout(() => { tau = 0; offT = Math.round(off); taps = []; }, 380);  // back to unison
      else { taps = []; reveal = 2.8; }                                                                    // lift voice 2 off
    }
    down = null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  let prev = performance.now();
  const frame = (now) => {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const holding = down && !down.drag && now - down.t > 250 && down.far < 8;
    lock = holding ? Math.min(1, lock + dt * 1.6) : Math.max(0, lock - dt * 1.2);
    const tuning = down && down.mode === 'tune';
    if (!reduced && !holding) { if (!tuning) tau += dt / P.cycle; t += dt * P.breath; }
    if (holding) { const total = sched(tau) + offT; offT += Math.round(total) - total; }   // hold: back into unison, and wait
    if (!down) { orbXT *= Math.exp(-dt / 1.4); orbYT *= Math.exp(-dt / 1.4); }
    const k = 1 - Math.exp(-dt * (down && down.drag ? 18 : 4));
    off += (offT - off) * k; orbX += (orbXT - orbX) * k; orbY += (orbYT - orbY) * k;
    if (reveal > 0) {
      reveal -= dt; const f = 1 - reveal / 2.8;
      const g = f < 0.3 ? f / 0.3 : f < 0.7 ? 1 : 1 - (f - 0.7) / 0.3;
      cut = g * g * (3 - 2 * g);
    } else cut = 0;

    const ph = sched(tau) + off, lag = ph - Math.floor(ph), apart = Math.sin(Math.PI * lag), dark = !!P.dark;
    playAudio(lag);
    const sp = 2 / P.lines, n = Math.ceil(2 * PY / sp);
    gl.viewport(0, 0, cw, chh);
    gl.clearColor(dark ? 0 : 1, dark ? 0 : 1, dark ? 0 : 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniformMatrix4fv(u.uMVP, false, camera(P.pitch + orbY, P.yaw + orbX));
    gl.uniform2f(u.uRes, cw, chh); gl.uniform1f(u.uFocal, chh / 2 / Math.tan(FOV / 2));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, maskT); gl.uniform1i(u.uMask, 0);
    gl.uniform1f(u.uFold, P.fold); gl.uniform1f(u.uScale, P.scale); gl.uniform1f(u.uT, t);
    gl.uniform1f(u.uSp, sp); gl.uniform1i(u.uN, n); gl.uniform1i(u.uSeg, SEG);
    gl.uniform1f(u.uW, P.weight); gl.uniform1f(u.uLight, P.light);
    gl.uniform3f(u.uInk, dark ? 1 : 0, dark ? 1 : 0, dark ? 1 : 0);
    // voice 1: holds tempo, carries the name
    gl.uniform1f(u.uPh, 0); gl.uniform1f(u.uEps, 0); gl.uniform1f(u.uTilt, 0); gl.uniform1f(u.uLetters, 1); gl.uniform1f(u.uCut, 0);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, (SEG + 1) * 2, n);
    // voice 2: the same strands, its bends lagging behind; back in step once a cycle
    const lk = 1 - lock;
    gl.uniform1f(u.uPh, lag); gl.uniform1f(u.uEps, P.tempo * apart * lk); gl.uniform1f(u.uTilt, P.tilt * Math.PI / 180 * apart * lk);
    gl.uniform1f(u.uLetters, 0); gl.uniform1f(u.uCut, cut);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, (SEG + 1) * 2, n);
    requestAnimationFrame(frame);
  };

  // settings (this test only)
  FACES.forEach(([f], i) => { const o = document.createElement('option'); o.value = i; o.textContent = f; $('face').appendChild(o); });
  const fmt = { fold: 2, scale: 2, breath: 2, pitch: 0, yaw: 0, zoom: 2, lines: 0, weight: 2, light: 2, tempo: 3, tilt: 2, cycle: 0, steps: 0, pause: 2, size: 2, dark: 0, span: 2, snap: 3, sound: 0, volume: 2, note: 0 };
  const loadFace = () => (document.fonts ? document.fonts.load(font(100), 'Idan Segev') : Promise.resolve()).catch(() => {});
  const applyDark = () => document.body.classList.toggle('dark', !!P.dark);
  const sync = () => {
    Object.keys(fmt).forEach((k) => { $(k).value = P[k]; $(k + 'O').textContent = (+P[k]).toFixed(fmt[k]); });
    $('face').value = P.face; applyDark();
  };
  Object.keys(fmt).forEach((k) => $(k).addEventListener('input', () => {
    P[k] = +$(k).value; $(k + 'O').textContent = P[k].toFixed(fmt[k]); save();
    if (k === 'size') buildMask(); if (k === 'dark') applyDark(); if (k === 'sound' && P.sound) ensureAudio();
  }));
  $('face').addEventListener('change', () => { P.face = +$('face').value; save(); loadFace().then(buildMask); });
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('copy').addEventListener('click', () => { const txt = JSON.stringify({ ...P, face: FACES[P.face][0] });
    navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1200); },
      () => { $('copy').textContent = txt; }); });
  $('reset').addEventListener('click', () => { Object.assign(P, DEF); save(); sync(); loadFace().then(buildMask); });
  sync();

  addEventListener('resize', resize);
  loadFace().then(() => { resize(); requestAnimationFrame(frame); });
})();
</script>
