<style>
/* Layout: one full-bleed poster, the name as bevelled glass type that blows apart toward the lens; a quiet mono line at the foot; a settings sheet for this test only. */
:root {
  --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
:root[data-page="light"] { --bg: #ffffff; --ink: #000000; --dim: #808080; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(250, 250, 250, 0.97); color-scheme: light; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.sheet h3 { margin: 6px 0 -4px; font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row select { padding: 2px 0; text-align: right; color: var(--dim); }
.row select option { color: #000; }
.acts { display: flex; flex-wrap: wrap; gap: 0 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
.err { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
</style>

    const gi = glyphs.findIndex((g) => x >= g.box[0] && x <= g.box[2] && y >= g.box[1] && y <= g.box[3] && insideGlyph([x, y], g.contours));

  }
  const pieces = [];
  glyphs.forEach((g, gi) => {
    const S = seeds[gi];
    while (S.length < 3) { const x = g.box[0] + Math.random() * (g.box[2] - g.box[0]), y = g.box[1] + Math.random() * (g.box[3] - g.box[1]); if (insideGlyph([x, y], g.contours)) S.push([x, y]); }
    const pad = 0.05, R = [[g.box[0] - pad, g.box[1] - pad], [g.box[2] + pad, g.box[1] - pad], [g.box[2] + pad, g.box[3] + pad], [g.box[0] - pad, g.box[3] + pad]];

function makePiece(polys, solid, g, planes, glass) {

    A += a; cx += a * (p[0][0] + p[i][0] + p[i + 1][0]) / 3; cy += a * (p[0][1] + p[i][1] + p[i + 1][1]) / 3;
  }
  cx /= A; cy /= A;
  const q = (v) => Math.round(v * 2e4);
  const edges = new Map();
  for (const p of polys) for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    if (q(a[0]) === q(b[0]) && q(a[1]) === q(b[1])) continue;
    edges.set(q(a[0]) + ',' + q(a[1]) + '|' + q(b[0]) + ',' + q(b[1]), [a, b]);
  }
  const { h, s, t, zb } = bevelDims();

  // one triangle, wound to face the way its normals point
  const tri = (V, N, a, b, c) => {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const flip = (uy * vz - uz * vy) * (a[3] + b[3] + c[3]) + (uz * vx - ux * vz) * (a[4] + b[4] + c[4]) + (ux * vy - uy * vx) * (a[5] + b[5] + c[5]) < 0;
    for (const p of flip ? [a, c, b] : [a, b, c]) { const nl = Math.hypot(p[3], p[4], p[5]) || 1; V.push(p[0] - cx, p[1] - cy, p[2]); N.push(p[3] / nl, p[4] / nl, p[5] / nl); }
  };
  for (const p of solid) for (let i = 1; i < p.length - 1; i++) tri(O, ON, p[0], p[i], p[i + 1]);
  // crack walls: as tall as the solid, which thins over the bevel near the outline
  const zAt = (x, y) => { const d = distOutline(x, y, g.segs); if (d >= s) return h; const c = 1 - d / s; return zb + t * Math.sqrt(Math.max(0, 1 - c * c)); };
  for (const [k, [a, b]] of edges) {
    const [ks, ke] = k.split('|');
    if (edges.has(ke + '|' + ks)) continue;
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny); nx /= l; ny /= l;
    if (!insideGlyph([(a[0] + b[0]) / 2 + nx * 0.004, (a[1] + b[1]) / 2 + ny * 0.004], g.contours)) continue;   // outline: the solid has it
    const da = distOutline(a[0], a[1], g.segs) < s, db = distOutline(b[0], b[1], g.segs) < s;
    const us = [0, 1], span = Math.min(0.5, 1.6 * s / l);
    for (let j = 1; j <= 6; j++) { const u = span * (j / 6) ** 2; if (da) us.push(u); if (db) us.push(1 - u); }
    us.sort((x, y) => x - y);
    const pts = us.map((u) => { const x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u; return [x, y, zAt(x, y)]; });
    const v = (r, z) => [r[0], r[1], z, nx, ny, 0];
    for (let j = 0; j < pts.length - 1; j++) {
      const p = pts[j], r = pts[j + 1];
      tri(I, IN, v(p, -p[2]), v(r, -r[2]), v(r, r[2])); tri(I, IN, v(p, -p[2]), v(r, r[2]), v(p, p[2]));
    }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(O.concat(I), 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(ON.concat(IN), 3));
  geo.addGroup(0, O.length / 3, 0); geo.addGroup(O.length / 3, I.length / 3, 1);
  const pl = Array.from({ length: 16 }, (_, i) => planes[i] || new THREE.Vector3());
  const glassMat = glass ? glassMaterial(true, { uPl: { value: pl }, uN: { value: planes.length }, uHome: { value: new THREE.Vector2(cx, cy) } }) : null;
  const mesh = new THREE.Mesh(geo, glass ? [glassMat, glassInner] : MATS);

}

// ---------- motion: closed form in simulated time, so time can run at any speed, or backwards ----------

const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function poseAt(pc, t, outP, outQ, outV, outW) {
  const k = P.drag, g = pc.moving ? P.gravity : 0;
  let f1, f2, E;
  if (k < 1e-4) { f1 = t; f2 = t * t / 2; E = 1; } else { E = Math.exp(-k * t); f1 = (1 - E) / k; f2 = (t - f1) / k; }
  outP.set(pc.p0.x + pc.v0.x * f1, pc.p0.y + pc.v0.y * f1 - g * f2, pc.p0.z + pc.v0.z * f1);
  const wl = pc.w.length(), kr = kRot();

function sparkBurst(at) {
  const n = Math.round(P.sparks);
  const dir = new Float32Array(n * 3), life = new Float32Array(n), sz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const sp = P.force * (0.5 + Math.random() * 1.6);
    dir[i * 3] = s * Math.cos(a) * sp * (0.6 + P.spread * 0.6); dir[i * 3 + 1] = s * Math.sin(a) * sp * (0.6 + P.spread * 0.6); dir[i * 3 + 2] = (Math.abs(u) * 0.7 + 0.3) * sp * (0.5 + P.forward * 0.7);
    life[i] = 0.05 + Math.random() * 0.3; sz[i] = 0.008 + Math.random() * Math.random() * 0.03;
  }
  sparkGeo.setAttribute('dir', new THREE.BufferAttribute(dir, 3));
  sparkGeo.setAttribute('life', new THREE.BufferAttribute(life, 1));
  sparkGeo.setAttribute('sz', new THREE.BufferAttribute(sz, 1));
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

}

function kickFrom(at, strength, fresh) {
  const P3 = new THREE.Vector3(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), W = new THREE.Vector3();
  if (!fresh) stack.push({ tau, base: pieces.map((p) => ({ p0: p.p0.clone(), v0: p.v0.clone(), q0: p.q0.clone(), w: p.w.clone(), moving: p.moving })), impact: impact.clone(), sparks: { dir: sparkGeo.getAttribute('dir'), life: sparkGeo.getAttribute('life'), sz: sparkGeo.getAttribute('sz') } });
  for (const p of pieces) {
    if (!fresh) { poseAt(p, tau, P3, Q, V, W); p.p0.copy(P3); p.q0.copy(Q); p.v0.copy(V); p.w.copy(W); }
    const dx = p.p0.x - at.x, dy = p.p0.y - at.y, dz = p.p0.z - at.z;
    const d = Math.hypot(dx, dy, dz) + 0.05;
    const fall = Math.exp(-d / P.reach);
    const sp = P.force * strength * fall * (0.55 + Math.random() * 0.9) * Math.pow(p.area / avgArea, -0.22);
    if (sp < 0.12) continue;
    const dir = new THREE.Vector3((dx / d) * P.spread * (0.6 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.5, (dy / d) * P.spread * (0.6 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.5, P.forward * (0.5 + Math.random()));
    dir.normalize();
    p.v0.addScaledVector(dir, sp);
    p.w.add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(P.spin * fall * strength * (0.3 + Math.random())));
    p.moving = true;
  }
  if (!fresh) tauDone += tau;
  impact.copy(at); tau = 0; tr = 0; mode = 'go';
  sparkBurst(at);

  const cand = pieces.filter((p) => p.moving && p.area > avgArea * 0.8).sort((a, b) => b.v0.z - a.v0.z);
  hero = cand[Math.min(cand.length - 1, 2)] || null;
}

function explode(at) {
  const t0 = performance.now();
  setPieces(fracture(at.x, at.y));
  avgArea = pieces.reduce((s, p) => s + p.area, 0) / Math.max(1, pieces.length);
  stack = []; tauDone = 0; tau = 0; tr = 0;
  impact.copy(at); glassU.uHit.value.set(at.x, at.y);

}

function reform() {
  camT.yaw = camT.pitch = camT.zoom = 0;
  for (const p of pieces) { p.p0.copy(p.home); p.v0.set(0, 0, 0); p.q0.identity(); p.w.set(0, 0, 0); p.moving = false; p.mesh.position.copy(p.home); p.mesh.quaternion.identity(); p.mesh.visible = true; }

function popBase() {
  const b = stack.pop();
  tauDone -= b.tau;
  pieces.forEach((p, i) => { const s = b.base[i]; p.p0.copy(s.p0); p.v0.copy(s.v0); p.q0.copy(s.q0); p.w.copy(s.w); p.moving = s.moving; });
