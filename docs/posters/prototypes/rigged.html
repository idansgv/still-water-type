<title>Rigged</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Bungee&family=Bungee+Inline&family=Dela+Gothic+One&family=Bowlby+One&family=Rubik+Mono+One&family=Alfa+Slab+One&display=swap">
<style>
/* Layout: the name is cloth held by a sparse rig. The rig is drawn on a 2D canvas behind the cloth (so a rope vanishes
   behind a letter), the cloth on a transparent WebGL canvas, and a 2D canvas on top for the reveal. A quiet foot line
   and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#rig, #over { pointer-events: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
select { border-bottom: 1px solid var(--line); padding: 2px 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
.colour-pass { position: fixed; inset: 0; pointer-events: none; }   /* test copy of the shell's colour pass (src/colour.js) */
.colour-dark canvas { filter: brightness(1.9); }
</style>

<canvas id="rig" aria-hidden="true"></canvas>
<canvas id="c" aria-label="Idan Segev in heavy capitals made of cloth. Each top corner is hoisted on a rope over a pulley to a counterweight; each bottom corner carries a plumb weight. Tap a rope to cut it; the rig ties it again."></canvas>
<canvas id="over" aria-hidden="true"></canvas>
<div class="foot"><span><b>Rigged</b> &nbsp;draft &nbsp;v2</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row" for="theme"><span>Page (test)</span><select id="theme"><option value="">follow the system</option><option value="light">light</option><option value="dark">dark</option></select></label>
  <label class="row" for="colourSel"><span>Colour pass (test)</span><select id="colourSel"><option value="">off</option><option value="0">North Sea</option><option value="1">Hot</option><option value="2">Sunset</option><option value="3">Acid</option><option value="4">Violet</option><option value="5">Ember</option></select></label>
  <label class="row" for="font"><span>Face</span><select id="font"></select></label>
  <label class="row" for="counter"><span>Counterweight (times the load)</span><output id="counterO"></output><input type="range" id="counter" min="1.05" max="3" step="0.05" value="2.25"></label>
  <label class="row" for="plumb"><span>Plumb weight</span><output id="plumbO"></output><input type="range" id="plumb" min="0" max="0.2" step="0.005" value="0.075"></label>
  <label class="row" for="slack"><span>Spare cloth (slack)</span><output id="slackO"></output><input type="range" id="slack" min="0.96" max="1.2" step="0.01" value="0.97"></label>
  <label class="row" for="corner"><span>Corner sharpness for a rope</span><output id="cornerO"></output><input type="range" id="corner" min="0.4" max="1.6" step="0.05" value="0.95"></label>
  <label class="row" for="bend"><span>Fold stiffness</span><output id="bendO"></output><input type="range" id="bend" min="0" max="0.6" step="0.01" value="0.26"></label>
  <label class="row" for="grav"><span>Gravity</span><output id="gravO"></output><input type="range" id="grav" min="200" max="3000" step="50" value="1400"></label>
  <label class="row" for="reel"><span>Reel speed</span><output id="reelO"></output><input type="range" id="reel" min="60" max="1200" step="20" value="240"></label>
  <label class="row" for="hold"><span>Pause before it ties again (s)</span><output id="holdO"></output><input type="range" id="hold" min="0.3" max="5" step="0.1" value="1.6"></label>
  <label class="row" for="detail"><span>Cloth detail (points)</span><output id="detailO"></output><input type="range" id="detail" min="1000" max="6000" step="100" value="4700"></label>
  <label class="row" for="sheen"><span>Fold light</span><output id="sheenO"></output><input type="range" id="sheen" min="0" max="2" step="0.05" value="0.1"></label>
  <label class="row" for="brace"><span>Hidden battens (how firmly a letter keeps its shape)</span><output id="braceO"></output><input type="range" id="brace" min="0" max="1" step="0.01" value="0.25"></label>
  <label class="row" for="tone"><span>Rig tone (how much ink)</span><output id="toneO"></output><input type="range" id="tone" min="0.04" max="1" step="0.01" value="0.15"></label>
  <div class="acts"><button id="cutAll" type="button">Cut every rope</button><button id="tie" type="button">Tie them now</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), rc = document.getElementById('rig'), oc = document.getElementById('over');
  const rx = rc.getContext('2d'), ox = oc.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const FONTS = ['Bungee', 'Bungee Inline', 'Dela Gothic One', 'Bowlby One', 'Rubik Mono One', 'Alfa Slab One'];
  const P = { font: 'Alfa Slab One', counter: 2.25, plumb: 0.075, slack: 0.97, corner: 0.95, bend: 0.26, grav: 1400, reel: 240, hold: 1.6, detail: 4700, sheen: 0.1, tone: 0.15, brace: 0.25 };   // Idan's tuned values (21 Oct 2026)
  try { Object.assign(P, JSON.parse(localStorage.getItem('rigged2') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('rigged2', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 1, H = 1, dpr = 1, page = [1, 1, 1], ink = [0, 0, 0], dark = false;
  const hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map((c) => c + c).join(''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };
  const readTheme = () => { const cs = getComputedStyle(document.documentElement); page = hex(cs.getPropertyValue('--bg').trim()); ink = hex(cs.getPropertyValue('--ink').trim()); dark = page[0] < 0.5; };
  const css = (c, a = 1) => `rgba(${c.map((v) => Math.round(v * 255)).join(',')},${a})`;

  // ---------- WebGL: the cloth, on a transparent canvas so the rig behind it shows around the letters ----------
  const gl = cv.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec3 p; attribute vec3 n; uniform vec2 res; varying vec3 vn;
    void main(){ vn = n; gl_Position = vec4(p.x / res.x * 2. - 1., 1. - p.y / res.y * 2., clamp(-p.z / 4000., -1., 1.), 1.); }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float; varying vec3 vn; uniform vec3 ink, page; uniform float dark, amt, fade; uniform vec2 L;
    void main(){
      vec3 n = normalize(vn); if (n.z < 0.) n = -n;
      float v = dot(n.xy, L);
      float t = (dark > .5 ? max(0., -v) : max(0., v)) * .9 + (1. - n.z) * .35;
      t = clamp(t * amt, 0., 1.);
      gl_FragColor = vec4(mix(mix(ink, page, t * .72), page, fade), 1.);
    }`));
  gl.linkProgram(prog); gl.useProgram(prog);
  const aP = gl.getAttribLocation(prog, 'p'), aN = gl.getAttribLocation(prog, 'n');
  const U = (n) => gl.getUniformLocation(prog, n), uRes = U('res'), uInk = U('ink'), uPage = U('page'), uDark = U('dark'), uAmt = U('amt'), uFade = U('fade'), uL = U('L');
  const bufP = gl.createBuffer(), bufN = gl.createBuffer(), bufI = gl.createBuffer();
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);

  // ---------- the cloth and the rig ----------
  // Only the sharp outer corners of each letter are rigged, and every rope runs straight up or straight down.
  // A corner facing up is hoisted: its rope rises to a pulley on a rail above the line and drops on the far side to a
  // counterweight that rests on a small ledge, which is what holds the corner exactly in place. Pull the cloth and the
  // weight lifts off its ledge. A corner facing down carries a plumb bob that swings. The rig lives behind the cloth.
  let N = 0, X, Y, Z, PX, PY, PZ, IM, HX, HY, LAB, CA, CB, CR, CK, NC = 0, TRI, NRM, POS;
  let hoists = [], plumbs = [], rails = [], capH = 100, s = 8, rp = 4, letters = [], ready = false, revealed = false, demo = !reduce, grab = null;
  let queue = [], clockOff = 0;
  const now = () => performance.now() + clockOff;

  async function build() {
    ready = false;
    const fam = P.font, font = (px) => `400 ${px}px "${fam}"`;
    try { await Promise.race([document.fonts.load(font(100), 'IDANSEGV'), new Promise((r) => setTimeout(r, 3000))]); } catch (e) { /* fallback */ }
    const w = Math.ceil(W), h = Math.ceil(H), m = document.createElement('canvas'); m.width = w; m.height = h;
    const x = m.getContext('2d', { willReadFrequently: true });
    const portrait = W / H < 0.8, lines = portrait ? ['IDAN', 'SE', 'GEV'] : ['IDAN', 'SEGEV'], TR = 0.1;
    x.font = font(100);
    const adv = {}; for (const ch of 'IDANSEGV') adv[ch] = x.measureText(ch).width / 100;
    const lw = (l, sz) => [...l].reduce((a, ch) => a + adv[ch] * sz, 0) + TR * sz * (l.length - 1);
    const cap = x.measureText('H').actualBoundingBoxAscent / 100 || 0.72;
    let size = Math.min(...lines.map((l) => W * 0.8 / lw(l, 1)));
    const lead = 1.85, total = (sz) => cap * sz * (1 + (lines.length - 1) * lead + 0.75);
    if (total(size) > H * 0.78) size *= H * 0.78 / total(size);
    capH = cap * size; rp = Math.max(3, capH * 0.032);
    x.font = font(size); x.textBaseline = 'alphabetic';
    const base0 = (H - total(size)) / 2 + capH * 1.6 - H * 0.03;
    let li = 0; letters = []; rails = [];
    const lineOf = [];
    lines.forEach((l, k) => {
      let cx = (W - lw(l, size)) / 2; const by = base0 + k * capH * lead;
      rails.push({ y: by - capH * 1.42, x0: 1e9, x1: -1e9 });
      for (const ch of l) { x.fillStyle = `rgb(${(li + 1) * 20},0,0)`; x.fillText(ch, cx, by); letters.push(ch); lineOf.push(k); cx += adv[ch] * size + TR * size; li++; }
    });
    const d = x.getImageData(0, 0, w, h).data, A = new Uint8Array(w * h), Lb = new Int8Array(w * h).fill(-1);
    let area = 0, bx0 = w, by0 = h, bx1 = 0, by1 = 0;
    for (let i = 0; i < w * h; i++) if (d[i * 4 + 3] > 110) {
      A[i] = 1; Lb[i] = Math.round(d[i * 4] / 20) - 1; area++;
      const px = i % w, py = (i / w) | 0; if (px < bx0) bx0 = px; if (px > bx1) bx1 = px; if (py < by0) by0 = py; if (py > by1) by1 = py;
    }
    const ins = (px, py) => { px |= 0; py |= 0; return px >= 0 && py >= 0 && px < w && py < h && A[py * w + px] === 1; };
    const lab = (px, py) => Lb[(py | 0) * w + (px | 0)];
    const insTol = (px, py, l) => { for (const [ox2, oy2] of [[0, 0], [1.5, 0], [-1.5, 0], [0, 1.5], [0, -1.5]]) if (ins(px + ox2, py + oy2) && lab(px + ox2, py + oy2) === l) return true; return false; };
    s = Math.sqrt(area / P.detail);
    const gx0 = bx0 - s, gy0 = by0 - s, cols = Math.ceil((bx1 - bx0) / s) + 3, rows = Math.ceil((by1 - by0) / s) + 3;
    const gid = new Int32Array(cols * rows).fill(-1), nx = [], ny = [], nl = [], rr = Math.ceil(s * 0.72);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      let px = gx0 + i * s, py = gy0 + j * s;
      if (!ins(px, py)) {
        let best = 1e9, bx = 0, by = 0;
        for (let oy = -rr; oy <= rr; oy++) for (let ox2 = -rr; ox2 <= rr; ox2++) { const q = ox2 * ox2 + oy * oy; if (q < best && q <= rr * rr && ins(px + ox2, py + oy)) { best = q; bx = (px | 0) + ox2 + 0.5; by = (py | 0) + oy + 0.5; } }
        if (best === 1e9) continue; px = bx; py = by;
      }
      gid[j * cols + i] = nx.length; nx.push(px); ny.push(py); nl.push(lab(px, py));
    }
    const tris = [];
    const tryTri = (a, b, c) => {
      if (a < 0 || b < 0 || c < 0 || nl[a] !== nl[b] || nl[a] !== nl[c] || nl[a] < 0) return;
      const ar = Math.abs((nx[b] - nx[a]) * (ny[c] - ny[a]) - (nx[c] - nx[a]) * (ny[b] - ny[a])) / 2;
      if (ar < 0.12 * s * s) return;
      const l = nl[a], mid = (p, q) => insTol((nx[p] + nx[q]) / 2, (ny[p] + ny[q]) / 2, l);
      if (!insTol((nx[a] + nx[b] + nx[c]) / 3, (ny[a] + ny[b] + ny[c]) / 3, l) || !mid(a, b) || !mid(b, c) || !mid(a, c)) return;
      tris.push(a, b, c);
    };
    for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
      const a = gid[j * cols + i], b = gid[j * cols + i + 1], c = gid[(j + 1) * cols + i], e = gid[(j + 1) * cols + i + 1];
      if ((i + j) & 1) { tryTri(a, b, e); tryTri(a, e, c); } else { tryTri(a, b, c); tryTri(b, e, c); }
    }
    const used = new Int32Array(nx.length).fill(-1); let n = 0;
    for (const v of tris) if (used[v] < 0) used[v] = n++;
    N = n; X = new Float32Array(N); Y = new Float32Array(N); Z = new Float32Array(N); PX = new Float32Array(N); PY = new Float32Array(N); PZ = new Float32Array(N);
    IM = new Float32Array(N).fill(1); HX = new Float32Array(N); HY = new Float32Array(N); LAB = new Int8Array(N);
    for (let i = 0; i < nx.length; i++) if (used[i] >= 0) { const k = used[i]; HX[k] = X[k] = PX[k] = nx[i]; HY[k] = Y[k] = PY[k] = ny[i]; LAB[k] = nl[i]; Z[k] = PZ[k] = (Math.random() - 0.5) * 0.6; }
    TRI = new Uint16Array(tris.map((v) => used[v]));
    const em = new Map(), key = (a, b) => (a < b ? a * 65536 + b : b * 65536 + a);
    for (let t = 0; t < TRI.length; t += 3) for (let e = 0; e < 3; e++) {
      const a = TRI[t + e], b = TRI[t + (e + 1) % 3], o = TRI[t + (e + 2) % 3], k = key(a, b);
      const r = em.get(k); if (r) r.opp.push(o); else em.set(k, { a, b, opp: [o] });
    }
    const ca = [], cb = [], ck = [];
    for (const r of em.values()) { ca.push(r.a); cb.push(r.b); ck.push(1); if (r.opp.length === 2) { ca.push(r.opp[0]); cb.push(r.opp[1]); ck.push(-1); } }
    // hidden battens: long, weak ties across each letter between points a third to two thirds of a cap height apart, so the
    // cloth keeps its letter between the few rigged corners the way a sail keeps its shape (folds still form, twists do not)
    if (P.brace > 0) {
      const byL = letters.map(() => []); for (let i = 0; i < N; i++) byL[LAB[i]].push(i);
      const rnd = mulberry(11), lo = capH * 0.3, hi = capH * 0.75;
      for (const list of byL) for (const i of list) for (let tries = 0; tries < 8; tries++) {
        const j = list[(rnd() * list.length) | 0]; if (j <= i) continue;
        const d = Math.hypot(HX[j] - HX[i], HY[j] - HY[i]); if (d < lo || d > hi) continue;
        ca.push(i); cb.push(j); ck.push(-2); break;
      }
    }
    NC = ca.length; CA = new Uint16Array(ca); CB = new Uint16Array(cb); CK = new Float32Array(ck); CR = new Float32Array(NC);
    for (let c = 0; c < NC; c++) CR[c] = Math.hypot(HX[CB[c]] - HX[CA[c]], HY[CB[c]] - HY[CA[c]]) * P.slack;
    // outline loops
    const badj = new Map();
    for (const r of em.values()) if (r.opp.length === 1) for (const [p, q] of [[r.a, r.b], [r.b, r.a]]) { if (!badj.has(p)) badj.set(p, []); badj.get(p).push(q); }
    const seen = new Set(), loops = [];
    for (const [v0, nb] of badj) for (const v1 of nb) {
      if (seen.has(key(v0, v1))) continue;
      const loop = [v0]; let prev = v0, cur = v1; seen.add(key(v0, v1));
      while (cur !== v0 && loop.length < 20000) {
        loop.push(cur);
        const nxt = (badj.get(cur) || []).find((q) => q !== prev && !seen.has(key(cur, q)));
        if (nxt === undefined) break; seen.add(key(cur, nxt)); prev = cur; cur = nxt;
      }
      if (loop.length > 6) loops.push(loop);
    }
    // the outer loop of each letter (the one with the widest reach), and its sharp convex corners
    hoists = []; plumbs = [];
    const kW = Math.max(2, Math.round(capH * 0.05 / s)), mB = Math.max(1, Math.round(capH * 0.03 / s));
    const counts = letters.map(() => 0);
    for (let i = 0; i < N; i++) counts[LAB[i]]++;
    for (let l = 0; l < letters.length; l++) {
      const mine = loops.filter((lp) => LAB[lp[0]] === l); if (!mine.length) continue;
      const span = (lp) => { let a = 1e9, b = -1e9, c = 1e9, e = -1e9; for (const v of lp) { a = Math.min(a, HX[v]); b = Math.max(b, HX[v]); c = Math.min(c, HY[v]); e = Math.max(e, HY[v]); } return (b - a) * (e - c); };
      const loop = mine.sort((p, q) => span(q) - span(p))[0], L = loop.length, at = (i) => loop[(i % L + L) % L];
      const sc = loop.map((v, i) => {
        const a = at(i - kW), c = at(i + kW);
        const a1 = Math.atan2(HY[v] - HY[a], HX[v] - HX[a]), a2 = Math.atan2(HY[c] - HY[v], HX[c] - HX[v]);
        let t = a2 - a1; while (t > Math.PI) t -= 2 * Math.PI; while (t < -Math.PI) t += 2 * Math.PI;
        const convex = ins((HX[a] + HX[c]) / 2, (HY[a] + HY[c]) / 2);
        return convex ? Math.abs(t) : 0;
      });
      const cand = [];
      for (let i = 0; i < L; i++) {
        if (sc[i] < P.corner) continue;
        let peak = true; for (let j = -kW; j <= kW; j++) if (j && sc[(i + j + L) % L] > sc[i]) { peak = false; break; }
        if (!peak) continue;
        const v = loop[i], a = at(i - kW), c = at(i + kW); let ox2 = HX[v] - (HX[a] + HX[c]) / 2, oy2 = HY[v] - (HY[a] + HY[c]) / 2; const ol = Math.hypot(ox2, oy2) || 1;
        cand.push({ i, v, ny: oy2 / ol, score: sc[i] });
      }
      // keep one per neighbourhood, and only corners that face up (hoist) or down (plumb)
      const take = (list) => { const out = []; for (const c of list.sort((p, q) => q.score - p.score)) if (!out.some((o) => Math.hypot(HX[o.v] - HX[c.v], HY[o.v] - HY[c.v]) < capH * 0.16)) out.push(c); return out; };
      // a plumb only where it hangs clear of the letter (a hoist may run behind an arm above it: the cloth hides it)
      const clear = (v, dir) => { for (let yy = HY[v] + dir * s * 1.5; yy > 0 && yy < H; yy += dir * 2) if (ins(HX[v], yy) && lab(HX[v], yy) === l) return false; return true; };
      // always the outermost points of the top and the bottom (so round letters are held too), then any other clear corner
      const ends = (dir) => {
        let ext = dir < 0 ? 1e9 : -1e9; for (const v of loop) ext = dir < 0 ? Math.min(ext, HY[v]) : Math.max(ext, HY[v]);

    cpEl.style.background = `linear-gradient(180deg, ${a[0]} 0%, ${a[1]} 24%, ${a[2]} 46%, ${b[0]} 54%, ${b[1]} 77%, ${b[2]} 100%)`;
    cpEl.style.mixBlendMode = dark ? 'multiply' : 'screen';
    document.querySelector('.foot').before(cpEl); document.documentElement.classList.toggle('colour-dark', dark);
  }
  function applyTheme() { const v = $('theme').value; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; readTheme(); applyColour(); }
  $('theme').value = qs.get('theme') || ''; $('colourSel').value = /^[0-5]$/.test(qs.get('colour') || '') ? qs.get('colour') : '';
  $('theme').addEventListener('change', applyTheme); $('colourSel').addEventListener('change', applyColour);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyColour);
  applyTheme();

  document.fonts.ready.then(() => { resize(); requestAnimationFrame(loop); });
})();
</script>
