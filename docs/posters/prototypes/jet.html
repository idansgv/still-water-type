<title>Jet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@600&display=block">
<style>
/* Layout: one full-bleed poster, the name written by a stream of water flowing along the letters' centre lines in mid-air. A quiet mono line at the foot; a settings sheet for this test only. White page by default, black in the dark slot. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #8a8a8a; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(252, 252, 252, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root.dark { --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: #8a8a8a; pointer-events: none; mix-blend-mode: difference;
}
.foot b { color: #ffffff; font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.row select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 3px 4px; }
.row input[type="text"] { grid-column: 1 / -1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 4px 6px; min-width: 0; }
.sub { color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, written by a stream of water flowing along the letters. Drag across it to cut the stream; it re-forms."></canvas>
<div class="foot"><span><b>Jet</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="dark"><span>Black page (white water)</span><input type="checkbox" id="dark"></label>
  <label class="row" for="words"><span>Words (empty: an album title)</span><input type="text" id="words" maxlength="14" autocomplete="off" spellcheck="false"></label>
  <div class="acts"><button id="nextAlbum" type="button">Next album</button></div>
  <div class="sub">Stream</div>
  <label class="row" for="width"><span>Stream width</span><output id="widthO"></output><input type="range" id="width" min="0.4" max="2.5" step="0.05"></label>
  <label class="row" for="speed"><span>Flow speed</span><output id="speedO"></output><input type="range" id="speed" min="0.1" max="2.5" step="0.05"></label>
  <label class="row" for="pulse"><span>Pulses</span><output id="pulseO"></output><input type="range" id="pulse" min="0" max="0.8" step="0.01"></label>
  <label class="row" for="spray"><span>Stroke ends spray</span><select id="spray">
    <option value="hold">While held</option>
    <option value="always">Always</option>
    <option value="off">Never</option>
  </select></label>
  <div class="sub">Cut and splash</div>

  <label class="row" for="fling"><span>Cut throw</span><output id="flingO"></output><input type="range" id="fling" min="0" max="1.5" step="0.05"></label>

  <label class="row" for="tens"><span>Surface tension</span><output id="tensO"></output><input type="range" id="tens" min="0" max="2" step="0.05"></label>
  <label class="row" for="visc"><span>Viscosity</span><output id="viscO"></output><input type="range" id="visc" min="0" max="1" step="0.01"></label>
  <label class="row" for="th"><span>Metaball threshold</span><output id="thO"></output><input type="range" id="th" min="0.15" max="0.8" step="0.01"></label>
  <label class="row" for="blur"><span>Metaball blur</span><output id="blurO"></output><input type="range" id="blur" min="0.5" max="1.8" step="0.05"></label>
  <label class="row" for="shine"><span>Highlight</span><output id="shineO"></output><input type="range" id="shine" min="0" max="1.5" step="0.05"></label>
  <label class="row" for="drop"><span>Droplet size</span><output id="dropO"></output><input type="range" id="drop" min="0" max="1.2" step="0.05"></label>
  <div class="acts"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
// The site's default words (src/albums.js): with no name of their own, posters set an album title.
const ALBUMS = ["Rubber Soul","Revolver","Abbey Road","Let It Be","Pet Sounds","Blue","Hejira","Thriller","Off the Wall","Purple Rain","Nevermind","In Utero","OK Computer","Kid A","Amnesiac","In Rainbows","The Bends","Graceland","Kind of Blue","Bitches Brew","A Love Supreme","Blue Train","Time Out","Mingus Ah Um","Hunky Dory","Low","Heroes","Blackstar","Let It Bleed","Sticky Fingers","Harvest","Astral Weeks","Pink Moon","Horses","Marquee Moon","Parallel Lines","London Calling","Closer","Loveless","Screamadelica","Doolittle","Surfer Rosa","Ten","Dummy","Mezzanine","Blue Lines","Homogenic","Violator","Lust for Life","Ready to Die","Aquemini","Stankonia","Parklife","Yeezus","Graduation","Blonde","Channel Orange","Frank","Back to Black","Ctrl","1989","21","Discovery","Moon Safari","Sea Change","Rain Dogs","Bone Machine","Blood Money","Closing Time","Geogaddi","Inferno","SOS","GNX","DAMN","ye","Demon Days","Plastic Beach","Donuts","Half Moon Bay","On the Beach","Harvest Moon","Wish","Bryter Layter","Dream River","Skeleton Tree","Play","Cheat Codes","Wildflower","Odelay","Mutations","Fun House","The Idiot","Old Ideas","Dirt","Stony Hill","Third","Giant Steps","Ascension","Knock Knock","Person Pitch","Treasure","Endless Summer","X's","Black Earth","Raw Power","Longing","18","Black One","Travel","Bleed","Piñata","Mosaic","Venice","Meditations","Natty Dread","Uprising","Squared Roots","Small Change","Blue Valentine","Alice","Bad as Me","Real Gone","Hi Scores","Sun","Ruff Draft","Talkie Walkie","Homework","Go","Sleep","Drumming","The Blueprint"];
let album = ALBUMS[Math.floor(Math.random() * ALBUMS.length)];
const nextAlbum = () => { let a; do a = ALBUMS[Math.floor(Math.random() * ALBUMS.length)]; while (a === album); album = a; };
const WORDS_OK = /^[\p{L}\p{M}0-9' -]+$/u; // same rule as the site's names (src/name.js)
const text = () => (P.words && WORDS_OK.test(P.words.trim()) ? P.words : album).replace(/\s+/g, ' ').trim();
const DEF = { dark: false, words: '', width: 1.25, speed: 1.3, pulse: 0.29, shine: 0, spray: 'hold', cut: 2.15, fling: 0.75, splash: 1.85, grav: 0.55, life: 3.2, tens: 1.35, visc: 1, th: 0.29, blur: 1.8, drop: 0.3, k: 0.3, kn: 0.5, dmax: 0.05 }; // Idan's tuning, 5 Nov 2026
const P = Object.assign({}, DEF);
try { Object.assign(P, JSON.parse(localStorage.getItem('jet') || '{}')); } catch (e) { /* defaults */ }
const save = () => { try { localStorage.setItem('jet', JSON.stringify(P)); } catch (e) { /* fine */ } };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- centre lines (Arboretum's skeleton: mask -> Zhang-Suen -> tree from the lowest pixel -> chains) ----------
function buildSkeleton(lines) {
  const fs = 220, font = `600 ${fs}px "Inter Tight"`;
  const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
  g.font = font;
  const cap = g.measureText('H').actualBoundingBoxAscent;
  const lh = fs * 1.12, pad = Math.round(fs * 0.3);
  const W = Math.ceil(Math.max(...lines.map(l => g.measureText(l).width))) + pad * 2;
  const H = Math.ceil(cap + (lines.length - 1) * lh + fs * 0.32) + pad * 2;
  c.width = W; c.height = H;
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#000';
  lines.forEach((l, i) => g.fillText(l, W / 2, pad + cap + i * lh));
  const px = g.getImageData(0, 0, W, H).data;
  const m = new Uint8Array(W * H);
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4 + 3] > 127) {
    m[y * W + x] = 1; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  thin(m, W, x0, y0, x1, y1);

  const N8 = [-W - 1, -W, -W + 1, -1, 1, W - 1, W, W + 1];
  const seen = new Uint8Array(W * H);
  const parent = new Int32Array(W * H).fill(-1);
  const dist = new Float32Array(W * H);
  const comps = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const s = y * W + x;
    if (!m[s] || seen[s]) continue;
    // flood the component, find its lowest pixel (closest to centre on ties) as the root: the water's source
    const pix = [s]; seen[s] = 1;
    for (let k = 0; k < pix.length; k++) for (const o of N8) { const j = pix[k] + o; if (m[j] && !seen[j]) { seen[j] = 1; pix.push(j); } }
    if (pix.length < 10) continue;
    let root = pix[0], ry = -1, rcx = 0;
    for (const p of pix) rcx += p % W; rcx /= pix.length;
    for (const p of pix) { const py = (p / W) | 0, pxx = p % W; if (py > ry || (py === ry && Math.abs(pxx - rcx) < Math.abs(root % W - rcx))) { ry = py; root = p; } }
    const order = [root]; const inT = new Set([root]); dist[root] = 0;
    for (let k = 0; k < order.length; k++) {
      const p = order[k];
      for (const o of [-W, -1, 1, W, -W - 1, -W + 1, W - 1, W + 1]) {
        const j = p + o;
        if (m[j] && !inT.has(j)) { inT.add(j); parent[j] = p; dist[j] = dist[p] + (o === -W || o === W || o === 1 || o === -1 ? 1 : Math.SQRT2); order.push(j); }
      }
    }
    comps.push({ root, order });
  }
  // prune short leaf spurs (thinning artefacts at corners and terminals)
  const alive = new Uint8Array(W * H), kidsN = new Int32Array(W * H);
  for (const cp of comps) for (const p of cp.order) { alive[p] = 1; if (parent[p] >= 0) kidsN[parent[p]]++; }
  const minSpur = cap * 0.13;
  for (let pass = 0; pass < 3; pass++) for (const cp of comps) for (const leaf of cp.order) {
    if (!alive[leaf] || kidsN[leaf] > 0) continue;
    const path = [leaf]; let cur = parent[leaf];
    while (cur >= 0 && kidsN[cur] === 1) { path.push(cur); cur = parent[cur]; }
    if (cur < 0 || dist[leaf] - dist[cur] >= minSpur) continue;
    for (const p of path) alive[p] = 0;
    kidsN[cur]--;
  }
  const out = { chains: [], cap, bbox: [x0, y0, x1, y1] };
  for (const cp of comps) {
    const ord = cp.order.filter(p => alive[p]);
    const kids = new Map();
    for (const p of ord) if (parent[p] >= 0) { if (!kids.has(parent[p])) kids.set(parent[p], []); kids.get(parent[p]).push(p); }
    const pt = p => ({ x: p % W, y: (p / W) | 0 });
    const stack = [cp.root];
    while (stack.length) {
      const s = stack.pop();
      for (const c0 of kids.get(s) || []) {
        const ch = [s, c0]; let cur = c0;
        while ((kids.get(cur) || []).length === 1) { cur = kids.get(cur)[0]; ch.push(cur); }
        if ((kids.get(cur) || []).length > 1) stack.push(cur);
        const sm = smooth(ch.map(pt));
        sm.terminal = !(kids.get(cur) || []).length;
        out.chains.push(sm);
      }
    }
  }
  return out;
}
function smooth(pts) {
  if (pts.length < 5) return pts;
  const r = 3, o = pts.map(p => ({ ...p }));
  for (let i = 1; i < pts.length - 1; i++) {
    const k = Math.min(r, i, pts.length - 1 - i);
    let sx = 0, sy = 0;
    for (let j = -k; j <= k; j++) { sx += pts[i + j].x; sy += pts[i + j].y; }
    o[i].x = sx / (2 * k + 1); o[i].y = sy / (2 * k + 1);
  }
  return o;
}
function thin(m, W, x0, y0, x1, y1) {
  const del = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (let pass = 0; pass < 2; pass++) {
      del.length = 0;
      for (let y = Math.max(1, y0); y <= Math.min(y1, (m.length / W) - 2); y++) for (let x = Math.max(1, x0); x <= x1; x++) {
        const i = y * W + x; if (!m[i]) continue;
        const p2 = m[i - W], p3 = m[i - W + 1], p4 = m[i + 1], p5 = m[i + W + 1], p6 = m[i + W], p7 = m[i + W - 1], p8 = m[i - 1], p9 = m[i - W - 1];
        const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
        if (B < 2 || B > 6) continue;
        const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (A !== 1) continue;
        if (pass === 0 ? (p2 && p4 && p6) || (p4 && p6 && p8) : (p2 && p4 && p8) || (p2 && p6 && p8)) continue;
        del.push(i);
      }
      if (del.length) { changed = true; for (const i of del) m[i] = 0; }
    }
  }
}
function layoutLines() {
  const t = text();
  if (W / H < 1 && t.includes(' ')) {
    const mid = t.length / 2; let best = -1;
    for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
    return [t.slice(0, best), t.slice(best + 1)];
  }
  return [t];
}

// ---------- the stream ----------
// Units are CSS px. Particles in the stream are kinematic: emitted at each chain's start, carried along it at the flow speed,
// offset across the jet's width. Loose particles are a 2D liquid (Clavet double-density relaxation, as Rewind) under gravity.
const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false, alpha: false });
let W = 0, H = 0, dpr = 1;
let L = null; // { chains, R, s, cap, dens, flow }
const FREE = 0, ON = 1, LOOSE = 2, HOME = 3;
let N = 0, x, y, vx, vy, ox, oy, st, chI, arc, lat, age, life, wgt;
let freeList = [], nFree = 0;
let act = new Int32Array(0), nAct = 0;
let rho, rhoN, pr, prN, cell, idx, start, nb, nq, nux, nuy, cnt, gw = 0, gh = 0, gcell = 1;
const M = 28, SIM_H = 2.1;
function latticeSum(fn, R) {
  let sum = 0; const dy = Math.sqrt(3) / 2;
  for (let r = -R; r <= R; r++) for (let c = -R; c <= R; c++) {
    const xx = c + (r & 1 ? 0.5 : 0), yy = r * dy, d = Math.hypot(xx, yy);
    if (d > 0) sum += fn(d);
  }
  return sum;
}
const RHO0 = latticeSum((d) => (d < SIM_H ? (1 - d / SIM_H) ** 2 : 0), 6);
const RHON0 = latticeSum((d) => (d < SIM_H ? (1 - d / SIM_H) ** 3 : 0), 6);

function resample(pts, k, ox0, oy0, step) {
  const sx = pts.map(p => p.x * k + ox0), sy = pts.map(p => p.y * k + oy0);
  const cum = [0];
  for (let i = 1; i < sx.length; i++) cum.push(cum[i - 1] + Math.hypot(sx[i] - sx[i - 1], sy[i] - sy[i - 1]));
  const len = cum[cum.length - 1], n = Math.max(2, Math.ceil(len / step) + 1);
  const X = new Float32Array(n), Y = new Float32Array(n), NX = new Float32Array(n), NY = new Float32Array(n);
  let j = 0;
  for (let i = 0; i < n; i++) {
    const a = Math.min(len, i * step);
    while (j < cum.length - 2 && cum[j + 1] < a) j++;
    const seg = cum[j + 1] - cum[j] || 1, f = (a - cum[j]) / seg;
    X[i] = sx[j] + (sx[j + 1] - sx[j]) * f; Y[i] = sy[j] + (sy[j + 1] - sy[j]) * f;
  }
  for (let i = 0; i < n; i++) {
    const a = Math.max(0, i - 2), b = Math.min(n - 1, i + 2);
    let tx = X[b] - X[a], ty = Y[b] - Y[a]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    NX[i] = -ty; NY[i] = tx;
  }
  return { X, Y, NX, NY, n, len, step };
}

function layout() {
  const lines = layoutLines();
  const sk = buildSkeleton(lines);
  const [x0, y0, x1, y1] = sk.bbox, bw = x1 - x0, bh = y1 - y0;
  const narrow = W < 640;
  const k = Math.min((narrow ? 0.84 : 0.72) * W / bw, (lines.length > 1 ? 0.5 : 0.34) * H / bh);
  const ox0 = W / 2 - (x0 + bw / 2) * k, oy0 = H * 0.44 - (y0 + bh / 2) * k;
  const cap = sk.cap * k;
  const R = Math.max(2.5, P.width * cap * 0.05);           // half the stream's width
  const s = clamp(R / 1.9, 1.6, 8);                         // particle spacing: about four across
  const chains = [];
  for (const c of sk.chains) {
    if (c.length < 2) continue;
    const ch = resample(c, k, ox0, oy0, 1.5);
    if (ch.len < 2) continue;
    ch.terminal = c.terminal; ch.acc = 0; ch.seq = Math.random();
    chains.push(ch);
  }
  const dens = (2 * R) / (s * s) * 1.15;                    // particles per px of stream
  const total = chains.reduce((a, c) => a + c.len, 0) * dens;
  return { chains, R, s, cap, dens, total };
}

function alloc(n) {
  N = n;
  x = new Float32Array(N); y = new Float32Array(N); vx = new Float32Array(N); vy = new Float32Array(N); ox = new Float32Array(N); oy = new Float32Array(N);
  st = new Uint8Array(N); chI = new Int32Array(N); arc = new Float32Array(N); lat = new Float32Array(N); age = new Float32Array(N); life = new Float32Array(N); wgt = new Float32Array(N);
  rho = new Float32Array(N); rhoN = new Float32Array(N); pr = new Float32Array(N); prN = new Float32Array(N);
  cell = new Int32Array(N); idx = new Int32Array(N); act = new Int32Array(N);
  nb = new Int32Array(N * M); nq = new Float32Array(N * M); nux = new Float32Array(N * M); nuy = new Float32Array(N * M); cnt = new Int32Array(N);
  freeList = new Int32Array(N); nFree = 0;
  for (let i = N - 1; i >= 0; i--) freeList[nFree++] = i;
}
const take = () => (nFree > 0 ? freeList[--nFree] : -1);
const release = (i) => { st[i] = FREE; wgt[i] = 0; freeList[nFree++] = i; };

// where the stream puts a particle: on the chain at arc length a, across the jet by lat
let simT = 0, pres = 0, drain = false, boostUntil = 0; // a tap on the water: the hold's pressure for 4 s
function place(i, ch, a) {
  const f = clamp(a / ch.step, 0, ch.n - 1.001), j = f | 0, u = f - j;
  const cx = ch.X[j] + (ch.X[j + 1] - ch.X[j]) * u, cy = ch.Y[j] + (ch.Y[j + 1] - ch.Y[j]) * u;
  const nx = ch.NX[j], ny = ch.NY[j];
  // pulses ride with the water (phase in the water's frame), so they show the flow
  const ph = (a - flowPx() * simT) / (L.R * 12);
  const wob = 1 + P.pulse * (0.7 * Math.sin(ph * 6.2832) + 0.3 * Math.sin(ph * 2.3 * 6.2832 + 1.3));
  const r = L.R * (1 + 0.35 * pres) * wob;
  return [cx + nx * lat[i] * r, cy + ny * lat[i] * r];
}
const flowPx = () => (reduced ? 0.3 : 1) * P.speed * L.cap * 0.9 * (1 + 1.6 * pres);
function tangentAt(ch, a) { const j = clamp((a / ch.step) | 0, 0, ch.n - 1); return [ch.NY[j], -ch.NX[j]]; }

function emit(ch, ci, a) {
