<title>Marbled Type</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the page is the water; the name floats on it as ink. A quiet foot line and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, floating as ink on water. Drag to comb it into marbled patterns; tap to drop more ink."></canvas>
<div class="foot"><span><b>Marbled type</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="rings"><span>A tap drops a ring (ink, then clear water inside)</span><input type="checkbox" id="rings" checked></label>
  <label class="row tog" for="colour"><span>Colour (the rare easter egg)</span><input type="checkbox" id="colour"></label>
  <label class="row" for="teeth"><span>Comb: teeth</span><output id="teethO"></output><input type="range" id="teeth" min="1" max="9" step="1" value="1"></label>
  <label class="row" for="gap"><span>Comb: space between teeth</span><output id="gapO"></output><input type="range" id="gap" min="12" max="140" step="2" value="46"></label>
  <label class="row" for="sharp"><span>How sharp the feathering is</span><output id="sharpO"></output><input type="range" id="sharp" min="4" max="80" step="1" value="18"></label>
  <label class="row" for="pull"><span>How far a stroke drags the ink</span><output id="pullO"></output><input type="range" id="pull" min="0.2" max="1.6" step="0.05" value="0.85"></label>
  <label class="row" for="drop"><span>Size of a drop</span><output id="dropO"></output><input type="range" id="drop" min="10" max="160" step="2" value="54"></label>
  <div class="acts"><button id="again" type="button">Start again</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const P = { rings: true, colour: false, teeth: 1, gap: 46, sharp: 18, pull: 0.85, drop: 54 };
  try { Object.assign(P, JSON.parse(localStorage.getItem('marbled') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('marbled', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const PAL = { dark: ['#2ee6ff', '#6fe0a0', '#d4f01a', '#ff4fe0', '#ff5a9a', '#ff6b5e'], light: ['#0a7fb5', '#0f9d8a', '#4a9a1a', '#c2185b', '#e0455a', '#e8652e'] };
  let W = 1, H = 1, dpr = 1, page = '#fff', ink = '#000', dark = false;
  const readTheme = () => { const cs = getComputedStyle(document.documentElement); page = cs.getPropertyValue('--bg').trim(); ink = cs.getPropertyValue('--ink').trim(); dark = page === '#000000'; dirty = true; };

  // ---------- the ink: shapes made of closed loops of points (vector, so it stays sharp however far it is pulled) ----------
  // A shape: { loops: [Float64Array-like arrays [x0, y0, x1, y1, ...]], tone: 'ink' | 'water' | palette index }
  let shapes = [], dirty = true, drops = 0;
  const MAXPTS = 90000;

  // the name as ink: trace the outline of the type (marching squares), smooth it, space the points evenly
  async function nameShape() {
    try { await Promise.race([document.fonts.load('900 100px Archivo'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fallback */ }
    const G = 2;                                                   // grid step, css px
    const gw = Math.ceil(W / G) + 2, gh = Math.ceil(H / G) + 2;
    const m = document.createElement('canvas'); m.width = gw; m.height = gh; const x = m.getContext('2d', { willReadFrequently: true });
    const face = getComputedStyle(document.documentElement).getPropertyValue('--display');
    const portrait = W / H < 0.8, lines = portrait ? ['IDAN', 'SE', 'GEV'] : ['IDAN', 'SEGEV'];
    x.font = '900 100px ' + face; const widest = Math.max(...lines.map((l) => x.measureText(l).width));
    const size = Math.min(W * 0.82 / widest * 100, H * (portrait ? 0.22 : 0.33)) / G;
    x.font = '900 ' + size + 'px ' + face; x.textAlign = 'center'; x.fillStyle = '#000';
    const lead = size * 0.93, top = gh / 2 - (lines.length * lead) / 2 + size * 0.78 - gh * 0.02;
    lines.forEach((l, i) => x.fillText(l, gw / 2, top + i * lead));
    const d = x.getImageData(0, 0, gw, gh).data, on = (i, j) => (i < 0 || j < 0 || i >= gw || j >= gh ? 0 : d[(j * gw + i) * 4 + 3] > 127 ? 1 : 0);
    const next = new Map(), pt = new Map();
    const key = (k, i, j) => { const s = k + i + ',' + j; if (!pt.has(s)) pt.set(s, k === 'h' ? [i + 0.5, j] : [i, j + 0.5]); return s; };
    const link = (a, b) => { (next.get(a) || next.set(a, []).get(a)).push(b); (next.get(b) || next.set(b, []).get(b)).push(a); };
    for (let j = -1; j < gh; j++) for (let i = -1; i < gw; i++) {
      const c = on(i, j) * 8 + on(i + 1, j) * 4 + on(i + 1, j + 1) * 2 + on(i, j + 1); if (!c || c === 15) continue;
      const T = () => key('h', i, j), B = () => key('h', i, j + 1), L = () => key('v', i, j), R = () => key('v', i + 1, j);
      switch (c) { case 1: case 14: link(L(), B()); break; case 2: case 13: link(B(), R()); break; case 3: case 12: link(L(), R()); break; case 4: case 11: link(T(), R()); break;
        case 5: link(L(), T()); link(B(), R()); break; case 6: case 9: link(T(), B()); break; case 7: case 8: link(L(), T()); break; case 10: link(L(), B()); link(T(), R()); break; }
    }
    const seen = new Set(), loops = [];
    for (const s of next.keys()) {
      if (seen.has(s)) continue; const pts = []; let prev = null, cur = s;
      for (;;) { seen.add(cur); pts.push(pt.get(cur)); const n = (next.get(cur) || []).find((k) => k !== prev && !seen.has(k)); if (n == null) break; prev = cur; cur = n; }
      if (pts.length < 6) continue;
      let q = pts.map(([a, b]) => [a * G, b * G]);
      for (let it = 0; it < 3; it++) q = q.map((p, k) => { const a = q[(k - 1 + q.length) % q.length], b = q[(k + 1) % q.length]; return [(a[0] + 2 * p[0] + b[0]) / 4, (a[1] + 2 * p[1] + b[1]) / 4]; });
      loops.push(resample(q.flat(), 2.5));
    }
    return { loops, tone: 'ink' };
  }
  function resample(a, step) {                                     // even spacing along a closed loop
    const out = []; let carry = 0; const n = a.length / 2;
    for (let k = 0; k < n; k++) {
      const x0 = a[k * 2], y0 = a[k * 2 + 1], x1 = a[((k + 1) % n) * 2], y1 = a[((k + 1) % n) * 2 + 1], len = Math.hypot(x1 - x0, y1 - y0);
      let t = carry; while (t < len) { out.push(x0 + (x1 - x0) * t / len, y0 + (y1 - y0) * t / len); t += step; } carry = t - len;
    }
    return out;
  }
  const total = () => shapes.reduce((s, sh) => s + sh.loops.reduce((a, l) => a + l.length / 2, 0), 0);

  // ---------- the moves of marbling (after Lu, Jaffer, Jin et al., "Mathematical Marbling") ----------
  // a drop of radius r at c pushes all the ink outward, keeping its area: p' = c + (p - c) * sqrt(1 + r² / |p - c|²)
  function drop(cx, cy, r, tone) {
    const r2 = r * r;
    for (const sh of shapes) for (const l of sh.loops) for (let k = 0; k < l.length; k += 2) {
      const dx = l[k] - cx, dy = l[k + 1] - cy, d2 = dx * dx + dy * dy || 1e-6, f = Math.sqrt(1 + r2 / d2);
      l[k] = cx + dx * f; l[k + 1] = cy + dy * f;
    }
    const n = Math.max(24, Math.round(2 * Math.PI * r / 2.5)), loop = [];
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; loop.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    shapes.push({ loops: [loop], tone });
    refine(); dirty = true;
  }
  // a tine drawn from a to b drags the ink beside it along, less the further away (an exponential falloff, so a long stroke stays local)
  function tine(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy); if (len < 0.5) return;
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, lam = P.sharp, teeth = Math.round(P.teeth);
    const offs = Array.from({ length: teeth }, (_, i) => (i - (teeth - 1) / 2) * P.gap);
    for (const sh of shapes) for (const l of sh.loops) for (let k = 0; k < l.length; k += 2) {
      let z = 0;
      for (const o of offs) {
        const px = l[k] - (ax + nx * o), py = l[k + 1] - (ay + ny * o);
        const along = px * ux + py * uy, across = Math.abs(px * nx + py * ny);
        const t = along < 0 ? -along : along > len ? along - len : 0;           // distance past the ends of the stroke counts too, so it stays local
        const dd = Math.hypot(across, t);
        z += P.pull * len * Math.exp(-dd / (lam * 1.8));                       // falls off fast: only the ink near the stroke moves, the rest of the page stays
      }
      l[k] += ux * z; l[k + 1] += uy * z;
    }
    refine(); dirty = true;
  }
  // keep curves smooth: wherever a stretch has opened a gap, put a point in it
  function refine() {
    if (total() > MAXPTS) return;
    for (const sh of shapes) for (let li = 0; li < sh.loops.length; li++) {
      const l = sh.loops[li], n = l.length / 2, out = [];
      for (let k = 0; k < n; k++) {
        const x0 = l[k * 2], y0 = l[k * 2 + 1], x1 = l[((k + 1) % n) * 2], y1 = l[((k + 1) % n) * 2 + 1];
        out.push(x0, y0);
        const len = Math.hypot(x1 - x0, y1 - y0); if (len > 4) { const s = Math.min(8, Math.ceil(len / 3)); for (let j = 1; j < s; j++) out.push(x0 + (x1 - x0) * j / s, y0 + (y1 - y0) * j / s); }
      }
      sh.loops[li] = out;
    }
  }

  // ---------- drawing ----------
  // give: a held finger makes the ink yield a little and spring back (drawn only)
  const GIVE_R = 95, GIVE_PX = 4.5, gv = { x: 0, y: 0, a: 0, v: 0, to: 0 }; let giving = false, lastT = performance.now();
  function give(px, py) {
    const dx = px - gv.x, dy = py - gv.y, d2 = dx * dx + dy * dy;
    if (d2 > GIVE_R * GIVE_R * 6) return [px, py];
    const d = Math.sqrt(d2) || 1, z = gv.a * Math.exp(-d2 / (GIVE_R * GIVE_R)) * Math.cos(d / 26);
    return [px + dx / d * z, py + dy / d * z];
  }
  function stepGive() {
    const now = performance.now(), h = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
    gv.v += (170 * (gv.to - gv.a) - 7.5 * gv.v) * h; gv.a += gv.v * h;
    const was = giving; giving = Math.abs(gv.a) > 0.02 || Math.abs(gv.v) > 0.2 || gv.to !== 0;
    if (giving || was) dirty = true;
  }
  // stir: a springy field under the ink; the ink is drawn displaced by it and settles back (the shapes never change)
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STIR = { cell: 10, sigma: 32, kick: 14, cap: 10, max: 20, k: 85, c: 7 };
  let sg = null, stirring = false;
  function field() { const gw = Math.ceil(W / STIR.cell) + 2, gh = Math.ceil(H / STIR.cell) + 2; if (!sg || sg.gw !== gw || sg.gh !== gh) sg = { gw, gh, d: new Float32Array(gw * gh * 2), v: new Float32Array(gw * gh * 2) }; return sg; }
  function stir(ax, ay, bx, by) {                                     // a push along a move: the ink swings out and comes back
    const f = field(), dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy); if (len < 0.3) return;
    const m = Math.min(len, STIR.cap) / len, ux = dx * m, uy = dy * m, C = STIR.cell, R = STIR.sigma * 2.2, s2 = STIR.sigma * STIR.sigma;
    const i0 = Math.max(0, Math.floor((bx - R) / C)), i1 = Math.min(f.gw - 1, Math.ceil((bx + R) / C)), j0 = Math.max(0, Math.floor((by - R) / C)), j1 = Math.min(f.gh - 1, Math.ceil((by + R) / C));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const ex = i * C - bx, ey = j * C - by, w = Math.exp(-(ex * ex + ey * ey) / s2) * STIR.kick, o = (j * f.gw + i) * 2;
      f.v[o] += ux * w; f.v[o + 1] += uy * w;
    }
    stirring = true;
  }
  function ripple(x, y, kick) {                                       // a ring of push from a touch: outward, springy, settles back
    const f = field(), C = STIR.cell, R = STIR.sigma * 2.6, s2 = STIR.sigma * STIR.sigma;
    const i0 = Math.max(0, Math.floor((x - R) / C)), i1 = Math.min(f.gw - 1, Math.ceil((x + R) / C)), j0 = Math.max(0, Math.floor((y - R) / C)), j1 = Math.min(f.gh - 1, Math.ceil((y + R) / C));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const ex = i * C - x, ey = j * C - y, d = Math.hypot(ex, ey) || 1e-3, w = Math.exp(-(d * d) / s2) * kick, o = (j * f.gw + i) * 2;
      f.v[o] += (ex / d) * w; f.v[o + 1] += (ey / d) * w;
    }
    stirring = true;
  }
  function stepStir(dt) {
    if (!stirring || !sg) return;
    const h = Math.min(dt, 1 / 30), { d, v } = sg; let live = 0;
    for (let k = 0; k < d.length; k++) {
      v[k] += (-STIR.k * d[k] - STIR.c * v[k]) * h; d[k] += v[k] * h;
      if (d[k] > STIR.max) d[k] = STIR.max; else if (d[k] < -STIR.max) d[k] = -STIR.max;
      live = Math.max(live, Math.abs(d[k]) + Math.abs(v[k]) * 0.05);
    }
    if (live < 0.02) { d.fill(0); v.fill(0); stirring = false; }
    dirty = true;
  }
  function lift(px, py) {                                             // the field under a point, bilinear
    const C = STIR.cell, fx = px / C, fy = py / C, i = Math.floor(fx), j = Math.floor(fy);
    if (i < 0 || j < 0 || i >= sg.gw - 1 || j >= sg.gh - 1) return [px, py];
    const tx = fx - i, ty = fy - j, a = (j * sg.gw + i) * 2, b = a + 2, c = a + sg.gw * 2, e = c + 2, d = sg.d;
    const w0 = (1 - tx) * (1 - ty), w1 = tx * (1 - ty), w2 = (1 - tx) * ty, w3 = tx * ty;
    return [px + d[a] * w0 + d[b] * w1 + d[c] * w2 + d[e] * w3, py + d[a + 1] * w0 + d[b + 1] * w1 + d[c + 1] * w2 + d[e + 1] * w3];
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = page; ctx.fillRect(0, 0, W, H);
    const pal = PAL[dark ? 'dark' : 'light'];
    for (const sh of shapes) {
      const path = new Path2D();
      for (const l of sh.loops) {
        for (let k = 0; k < l.length; k += 2) {
          let q = giving ? give(l[k], l[k + 1]) : [l[k], l[k + 1]];
          if (stirring) q = lift(q[0], q[1]);
          k ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1]);
        }
        path.closePath();
      }
      ctx.fillStyle = sh.tone === 'water' ? page : sh.tone === 'ink' || !P.colour ? ink : pal[sh.tone % 6];
      ctx.fill(path, 'evenodd');
    }
  }
  // idle breathing: after 2.5 s untouched, a faint shiver at a random point on the ink, every 3.5 to 6 s; visual only
  let lastInput = -1e9, breathT = 0, lastFrame = performance.now();
  function breathe() {
    const l = shapes.length && shapes[0].loops.length ? shapes[0].loops[Math.floor(Math.random() * shapes[0].loops.length)] : null;
    if (!l || l.length < 4) return;
    const k = 2 * Math.floor(Math.random() * (l.length / 2)), a = Math.random() * Math.PI * 2;
    stir(l[k], l[k + 1], l[k] + Math.cos(a) * 5, l[k + 1] + Math.sin(a) * 5);
  }
  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
    stepGive(); stepStir(dt);
    if (!REDUCED && performance.now() - lastInput > 2500 && (breathT -= dt) <= 0) { breathe(); breathT = 3.5 + Math.random() * 2.5; }
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(frame);
  }

  // ---------- touch: a tap drops ink; a drag combs ----------
  let down = null, last = null, combing = false, hov = null, lastRipple = 0;
  cv.addEventListener('pointerdown', (e) => { lastInput = performance.now(); down = { x: e.clientX, y: e.clientY, t: performance.now() }; last = { x: e.clientX, y: e.clientY }; combing = false; gv.x = e.clientX; gv.y = e.clientY; gv.to = GIVE_PX; if (!REDUCED) ripple(e.clientX, e.clientY, STIR.kick * 1.2); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ } });
  cv.addEventListener('pointermove', (e) => {
    lastInput = performance.now();
    if (!down) {                                                      // a mouse moving over the ink, no button: a gentle stir
      if (e.pointerType === 'mouse' && !e.buttons && !REDUCED) { if (hov && Math.hypot(e.clientX - hov.x, e.clientY - hov.y) < 90) stir(hov.x, hov.y, e.clientX, e.clientY); hov = { x: e.clientX, y: e.clientY }; }
      return;
    }
    if (!combing && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) { combing = true; gv.to = 0; }
    if (combing) {
      tine(last.x, last.y, e.clientX, e.clientY); last = { x: e.clientX, y: e.clientY };
      if (!REDUCED && performance.now() - lastRipple > 140) { ripple(e.clientX, e.clientY, STIR.kick * 0.5); lastRipple = performance.now(); }   // a drag keeps sending ripples, a few a second
    }
  });
  cv.addEventListener('pointerup', (e) => {
    gv.to = 0;
    if (down && combing && !REDUCED) ripple(e.clientX, e.clientY, STIR.kick);   // letting go after a drag sends one last ring from where it ended
    if (down && !combing && performance.now() - down.t < 400) {
      const tone = P.colour ? drops % 6 : 'ink'; drops++;
      drop(e.clientX, e.clientY, P.drop, tone);
      if (P.rings) setTimeout(() => drop(e.clientX, e.clientY, P.drop * 0.62, 'water'), 140);   // clear water into the middle: the drop becomes a ring
    }
    down = null; combing = false;
  });
  cv.addEventListener('pointercancel', () => { gv.to = 0; down = null; combing = false; });

  // ---------- settings (for this test only) ----------
  const fmt = { teeth: (v) => v, gap: (v) => v + ' px', sharp: (v) => v + ' px', pull: (v) => '×' + (+v).toFixed(2), drop: (v) => v + ' px' };
  for (const key of ['rings', 'colour']) { $(key).checked = !!P[key]; $(key).addEventListener('change', () => { P[key] = $(key).checked; save(); dirty = true; }); }
  for (const key of Object.keys(fmt)) { $(key).value = P[key]; $(key + 'O').textContent = fmt[key](P[key]); $(key).addEventListener('input', () => { P[key] = +$(key).value; $(key + 'O').textContent = fmt[key](P[key]); save(); }); }
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
