<title>Gyosho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@500;800&family=Caveat:wght@700&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: an album title written huge in a dry, streaky brush over its song names in a plain sans. A quiet foot line and a test-only settings sheet. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row input:not([type]) { grid-column: 1 / -1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 5px 6px; }
.row select { grid-column: 1 / -1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 5px 6px; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; flex-wrap: wrap; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="An album title written huge with a dry brush, over its song names set in a plain sans. Drag to paint with the same brush; tap to write it again."></canvas>
<div class="foot"><span><b>Gyosho</b> &nbsp;test &nbsp;<span id="albumName"></span></span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row" for="album"><span>Album</span><select id="album"></select></label>
  <label class="row" for="name"><span>Your name (make it your own)</span><input id="name" maxlength="14" autocomplete="off" spellcheck="false" placeholder="the album title"></label>
  <label class="row" for="face"><span>Letters from</span><select id="face"></select></label>
  <label class="row" for="brush"><span>Brush width</span><output id="brushO"></output><input type="range" id="brush" min="0.4" max="2.2" step="0.05"></label>
  <label class="row" for="exag"><span>Movement</span><output id="exagO"></output><input type="range" id="exag" min="0" max="1.6" step="0.05"></label>
  <label class="row" for="flow"><span>Flow (strokes run together)</span><output id="flowO"></output><input type="range" id="flow" min="0" max="1" step="0.05"></label>
  <label class="row" for="dry"><span>Dry brush</span><output id="dryO"></output><input type="range" id="dry" min="0" max="2" step="0.05"></label>
  <label class="row" for="speed"><span>Writing speed</span><output id="speedO"></output><input type="range" id="speed" min="0.5" max="8" step="0.1"></label>
  <label class="row" for="grain"><span>Paper grain</span><output id="grainO"></output><input type="range" id="grain" min="0" max="1" step="0.05"></label>
  <label class="row" for="overlap"><span>Where ink meets type</span><select id="overlap"><option value="0">They merge</option><option value="1">Knock out</option></select></label>
  <label class="row tog" for="type"><span>Song names underneath</span><input type="checkbox" id="type"></label>
  <label class="row tog" for="dark"><span>Black page</span><input type="checkbox" id="dark"></label>
  <div class="acts"><button id="again" type="button">Write it again</button><button id="next" type="button">Next album</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const DEF = { album: 7, face: 0, brush: 1.4, exag: 1.55, flow: 0.25, dry: 0.2, grain: 1, speed: 7.3, overlap: 0, name: '', type: true, dark: false, seed: 304174 };   // Idan's tuned values, 2 Nov 2026
  const P = { ...DEF };
  try { Object.assign(P, JSON.parse(localStorage.getItem('gyosho') || '{}')); } catch (e) { /* defaults */ }
  const save = () => { try { localStorage.setItem('gyosho', JSON.stringify(P)); } catch (e) { /* fine */ } };

  // ---------- albums: the title goes in ink, the songs go underneath, each after its length ----------
  const ALBUMS = [
    ['Kind of Blue', 'Miles Davis', [['So What', '9:22'], ['Freddie Freeloader', '9:46'], ['Blue in Green', '5:37'], ['All Blues', '11:33'], ['Flamenco Sketches', '9:26']]],
    ['A Love Supreme', 'John Coltrane', [['Acknowledgement', '7:47'], ['Resolution', '7:22'], ['Pursuance', '10:42'], ['Psalm', '7:05']]],
    ['Blue Train', 'John Coltrane', [['Blue Train', '10:43'], ["Moment's Notice", '9:10'], ['Locomotion', '7:14'], ["I'm Old Fashioned", '7:58'], ['Lazy Bird', '7:00']]],
    ['Giant Steps', 'John Coltrane', [['Giant Steps', '4:43'], ['Cousin Mary', '5:45'], ['Countdown', '2:21'], ['Spiral', '5:56'], ["Syeeda's Song Flute", '7:00'], ['Naima', '4:21'], ['Mr. P.C.', '6:57']]],
    ['Time Out', 'The Dave Brubeck Quartet', [['Blue Rondo à la Turk', '6:44'], ['Strange Meadow Lark', '7:22'], ['Take Five', '5:24'], ['Three to Get Ready', '5:24'], ["Kathy's Waltz", '4:48'], ["Everybody's Jumpin'", '4:23'], ['Pick Up Sticks', '4:16']]],
    ['Mingus Ah Um', 'Charles Mingus', [['Better Git It in Your Soul', '7:23'], ['Goodbye Pork Pie Hat', '5:44'], ['Boogie Stop Shuffle', '3:41'], ['Self-Portrait in Three Colors', '3:09'], ['Open Letter to Duke', '5:51'], ['Bird Calls', '3:12'], ['Fables of Faubus', '8:13'], ['Pussy Cat Dues', '6:27'], ['Jelly Roll', '6:17']]],
    ['Bitches Brew', 'Miles Davis', [["Pharaoh's Dance", '20:06'], ['Bitches Brew', '26:58'], ['Spanish Key', '17:34'], ['John McLaughlin', '4:22'], ['Miles Runs the Voodoo Down', '14:01'], ['Sanctuary', '10:56']]],
    ['Pink Moon', 'Nick Drake', [['Pink Moon', '2:06'], ['Place to Be', '2:43'], ['Road', '2:02'], ['Which Will', '2:58'], ['Horn', '1:23'], ['Things Behind the Sun', '3:57'], ['Know', '2:26'], ['Parasite', '3:36'], ['Free Ride', '3:06'], ['Harvest Breed', '1:37'], ['From the Morning', '2:30']]],
    ['Mezzanine', 'Massive Attack', [['Angel', '6:18'], ['Risingson', '5:58'], ['Teardrop', '5:29'], ['Inertia Creeps', '5:56'], ['Exchange', '4:11'], ['Dissolved Girl', '6:06'], ['Man Next Door', '5:55'], ['Black Milk', '6:20'], ['Mezzanine', '5:54'], ['Group Four', '8:13'], ['(Exchange)', '4:08']]],
    ['Blue', 'Joni Mitchell', [['All I Want', '3:32'], ['My Old Man', '3:33'], ['Little Green', '3:25'], ['Carey', '3:00'], ['Blue', '3:00'], ['California', '3:48'], ['This Flight Tonight', '2:50'], ['River', '4:00'], ['A Case of You', '4:20'], ['The Last Time I Saw Richard', '4:13']]],
    ['Low', 'David Bowie', [['Speed of Life', '2:46'], ['Breaking Glass', '1:51'], ['What in the World', '2:23'], ['Sound and Vision', '3:03'], ['Always Crashing in the Same Car', '3:29'], ['Be My Wife', '2:55'], ['A New Career in a New Town', '2:51'], ['Warszawa', '6:20'], ['Art Decade', '3:43'], ['Weeping Wall', '3:26'], ['Subterraneans', '5:39']]],
    ['Kid A', 'Radiohead', [['Everything in Its Right Place', '4:11'], ['Kid A', '4:44'], ['The National Anthem', '5:51'], ['How to Disappear Completely', '5:56'], ['Treefingers', '3:42'], ['Optimistic', '5:15'], ['In Limbo', '3:31'], ['Idioteque', '5:09'], ['Morning Bell', '4:35'], ['Motion Picture Soundtrack', '7:01']]],
  ];
  const FACES = [
    { label: 'Sans skeleton (Inter Tight)', family: 'Inter Tight', weight: 800 },
    { label: 'Hand (Caveat)', family: 'Caveat', weight: 700 },
    { label: 'Monoline hand (Nothing You Could Do)', family: 'Nothing You Could Do', weight: 400 },
  ];

  // ---------- small maths ----------
  const mulberry = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const hash = (i, j) => { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const vn = (x, y) => {   // value noise, 0..1
    const i = Math.floor(x), j = Math.floor(y), u = x - i, v = y - j, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
    const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
    return a + (b - a) * su + (c - a) * sv + (a - b - c + d) * su * sv;
  };
  const n1 = (x, o) => vn(x, o * 17.13);

  // ---------- a letter's centre line, from the face ----------
  const SK = new Map(), F = 200;
  function skeleton(ch, f) {
    const key = f.family + '|' + ch; if (SK.has(key)) return SK.get(key);
    const w = Math.round(F * 2), h = Math.round(F * 1.7), ox = F * 0.3, base = F * 1.25;
    const m = document.createElement('canvas'); m.width = w; m.height = h;
    const x = m.getContext('2d', { willReadFrequently: true });
    x.font = `${f.weight} ${F}px "${f.family}"`; x.fillStyle = '#000'; x.textBaseline = 'alphabetic';
    x.fillText(ch, ox, base);
    const adv = x.measureText(ch).width / F;
    const d = x.getImageData(0, 0, w, h).data, img = new Uint8Array(w * h);
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let i = 0; i < w * h; i++) if (d[i * 4 + 3] > 110) { img[i] = 1; const px = i % w, py = (i / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
    const out = { adv, strokes: [] };
    if (x1 <= x0) { SK.set(key, out); return out; }
    x0 = Math.max(1, x0 - 2); y0 = Math.max(1, y0 - 2); x1 = Math.min(w - 2, x1 + 2); y1 = Math.min(h - 2, y1 + 2);
    // blobs too small to thin (the dot on an i) become a short dab
    const lab = new Int32Array(w * h), blobs = [];
    for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
      const i0 = py * w + px; if (!img[i0] || lab[i0]) continue;
      const st = [i0], b = { n: 0, sx: 0, sy: 0, maxD: 0, x0: px, x1: px, y0: py, y1: py }; lab[i0] = blobs.length + 1;
      while (st.length) { const i = st.pop(), qx = i % w, qy = (i / w) | 0; b.n++; b.sx += qx; b.sy += qy; b.x0 = Math.min(b.x0, qx); b.x1 = Math.max(b.x1, qx); b.y0 = Math.min(b.y0, qy); b.y1 = Math.max(b.y1, qy);
        for (const j of [i - 1, i + 1, i - w, i + w]) if (img[j] && !lab[j]) { lab[j] = blobs.length + 1; st.push(j); } }
      blobs.push(b);
    }
    // thin to a one-pixel centre line (Zhang-Suen)
    for (let changed = true; changed;) {
      changed = false;
      for (let pass = 0; pass < 2; pass++) {
        const del = [];
        for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
          const i = py * w + px; if (!img[i]) continue;
          const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
          const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9; if (B < 2 || B > 6) continue;
          const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2); if (A !== 1) continue;
          if (pass === 0 ? (p2 && p4 && p6) || (p4 && p6 && p8) : (p2 && p4 && p8) || (p2 && p6 && p8)) continue;
          del.push(i);
        }
        for (const i of del) img[i] = 0; if (del.length) changed = true;
      }
    }
    for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
      const i = py * w + px; if (!img[i]) continue;
      const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1], p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
      if (p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9 !== 2) continue;
      if ((p2 && p4) || (p4 && p6) || (p6 && p8) || (p8 && p2)) img[i] = 0;
    }
    // walk the centre line into strokes, as straight as the line allows, each from its leftmost loose end
    const N8 = [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1], DX = [-1, 0, 1, -1, 1, -1, 0, 1], DY = [-1, -1, -1, 0, 0, 1, 1, 1];
    const used = new Uint8Array(w * h), pix = [];
    for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) if (img[py * w + px]) pix.push(py * w + px);
    const free = (i) => { const r = []; for (let k = 0; k < 8; k++) { const j = i + N8[k]; if (img[j] && !used[j]) r.push(k); } return r; };
    const paths = [];
    for (;;) {
      let start = -1, bs = Infinity;
      for (const i of pix) if (!used[i] && free(i).length <= 1) { const sc = (i % w) + ((i / w) | 0) * 0.35; if (sc < bs) { bs = sc; start = i; } }
      if (start < 0) for (const i of pix) if (!used[i]) { start = i; break; }
      if (start < 0) break;
      const path = [start]; used[start] = 1; let cur = start, dx = 0, dy = 0;
      for (;;) {
        const fr = free(cur); if (!fr.length) break;
        let best = fr[0], sb = -9;
        for (const k of fr) { const sc = (DX[k] * dx + DY[k] * dy) / Math.hypot(DX[k], DY[k]) + (DX[k] && DY[k] ? 0 : 0.05); if (sc > sb) { sb = sc; best = k; } }
        const nx = cur + N8[best];
        for (const k of fr) used[cur + N8[k]] = 1;
        dx = dx * 0.6 + DX[best] * 0.4; dy = dy * 0.6 + DY[best] * 0.4;
        path.push(nx); used[nx] = 1; cur = nx;
      }
      paths.push(path);
    }
    const covered = new Set();
    for (const path of paths) {
      if (path.length < 10) continue;
      for (const i of path) covered.add(lab[i]);
      let q = path.map((i) => [i % w, (i / w) | 0]);
      for (let it = 0; it < 4; it++) q = q.map((p, k) => (k === 0 || k === q.length - 1 ? p : [(q[k - 1][0] + 2 * p[0] + q[k + 1][0]) / 4, (q[k - 1][1] + 2 * p[1] + q[k + 1][1]) / 4]));
      out.strokes.push(q.map(([a, b]) => [(a - ox) / F, (b - base) / F]));
    }
    blobs.forEach((b, k) => {
      if (covered.has(k + 1) || b.n < F * F * 0.0015) return;
      const cx0 = b.sx / b.n, cy0 = b.sy / b.n, r = Math.max(Math.max(b.x1 - b.x0, b.y1 - b.y0) * 0.35, F * 0.07);
      out.strokes.push([[cx0 - r, cy0 - r * 0.7], [cx0, cy0], [cx0 + r * 0.5, cy0 + r * 0.8]].map(([a, c]) => [(a - ox) / F, (c - base) / F]));
    });
    SK.set(key, out); return out;
  }

  // ---------- the hand: place letters, join strokes, warp, flick ----------
  function splitRows(title, aspect) {
    const k = Math.max(3, Math.round(1.6 + 3 * aspect)), words = [];
    for (const wd of title.split(/\s+/)) {
      if (wd.length <= k + 1) { words.push(wd); continue; }
      const n = Math.ceil(wd.length / k), m = Math.ceil(wd.length / n);
      for (let i = 0; i < wd.length; i += m) words.push(wd.slice(i, i + m));
    }
    const rows = [];
    for (let i = 0; i < words.length; i++) {
      const wd = words[i];
      if (wd.length <= 2 && i + 1 < words.length && (wd + words[i + 1]).length <= k) { rows.push(wd + ' ' + words[i + 1]); i++; }
      else rows.push(wd);
    }
    return rows;
  }
  const lenOf = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };
  function resample(pts, ds) {   // pts: [x, y, hair]
    const out = [pts[0].slice()]; let carry = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 1e-6) continue;
      let t = ds - carry;
      while (t <= L) { const u = t / L; out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]); t += ds; }
      carry = L - (t - ds);
    }
    const last = pts[pts.length - 1]; if (Math.hypot(last[0] - out[out.length - 1][0], last[1] - out[out.length - 1][1]) > ds * 0.3) out.push(last.slice());
    return out;
  }
  const tangentAt = (pts, i, back) => {
    const a = pts[Math.max(0, back ? i - 4 : i)], b = pts[Math.min(pts.length - 1, back ? i : i + 4)];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dx / L, dy / L];
  };
  function connector(a, b, ta, tb) {   // a thin hairline swing from the end of one stroke into the start of the next
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]), k = d * 0.4, out = [], n = Math.max(4, Math.ceil(d / 3));
    const c1 = [a[0] + ta[0] * k, a[1] + ta[1] * k], c2 = [b[0] - tb[0] * k, b[1] - tb[1] * k];
    for (let i = 1; i < n; i++) {
      const t = i / n, mt = 1 - t, hair = Math.min(1, Math.min(t, 1 - t) * 4);
      out.push([mt * mt * mt * a[0] + 3 * mt * mt * t * c1[0] + 3 * mt * t * t * c2[0] + t * t * t * b[0], mt * mt * mt * a[1] + 3 * mt * mt * t * c1[1] + 3 * mt * t * t * c2[1] + t * t * t * b[1], hair]);
    }
    return out;
  }

  function compose(rng, W, H) {
    const al = ALBUMS[P.album], f = FACES[P.face], rows = splitRows(P.name || al[0], W / H), ex = P.exag;
    const KERN = 0.86;   // letters crowd and overlap
    const rowEm = rows.map((r) => [...r].reduce((s, ch) => s + (ch === ' ' ? 0.22 : skeleton(ch, f).adv * KERN), 0));
    const e = Math.min(W * 0.98 / Math.max(...rowEm), H * 1.2 / rows.length, H * 0.75, W * 0.9);
    const lead = e * 0.7, W0 = e * 0.13 * P.brush;
    const letters = [];
    rows.forEach((r, ri) => {
      const base = H / 2 + (ri - (rows.length - 1) / 2) * lead + e * 0.28;
      let x = (W - rowEm[ri] * e) / 2 + (rng() - 0.5) * W * 0.04 + (ri % 2 ? 1 : -1) * W * 0.025 * ex;
      for (const ch of r) {
        if (ch === ' ') { x += 0.22 * e; continue; }
        const sk = skeleton(ch, f), aw = sk.adv * e;
        const s = e * (1 + (rng() - 0.5) * 0.3 * ex), rot = (rng() - 0.5) * 0.4 * ex, dy = (rng() - 0.5) * 0.16 * e * ex;
        const pcx = x + aw / 2, pcy = base - 0.33 * e + dy, co = Math.cos(rot), si = Math.sin(rot);
        const strokes = sk.strokes.map((st) => st.map(([u, v]) => { const px = (u - sk.adv / 2) * s, py = (v + 0.33) * s; return [pcx + px * co - py * si, pcy + px * si + py * co, 0]; }));
        letters.push(strokes);
        x += aw * KERN;
      }
    });
    // join strokes into movements (Gyosho: the brush rarely lifts)
    const pIn = Math.min(1, P.flow * 1.6), pAcross = Math.max(0, P.flow * 2 - 1);
    const moves = [];
    let cur = null;
    letters.forEach((strokes, li) => {
      strokes.forEach((st, si) => {

      for (let j = S.length - n; j < S.length; j++) S[j].w = S[S.length - n - 1].w * (Math.pow(1 - S[j].tl, 1.3) * 0.92 + 0.04);
    }
    paintRange(inkCtx(), st, user.done, S.length - 1, dpr, true); user = null; dirty = true;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---------- settings ----------
  ALBUMS.forEach((a, i) => $('album').add(new Option(`${a[0]} (${a[1]})`, i)));
  FACES.forEach((f, i) => $('face').add(new Option(f.label, i)));
  const SL = ['brush', 'exag', 'flow', 'dry', 'grain', 'speed'];
  let tm = 0; const soon = () => { clearTimeout(tm); tm = setTimeout(() => build(false), 90); };
  for (const k of SL) { const el = $(k); el.value = P[k]; $(k + 'O').textContent = (+P[k]).toFixed(2); el.addEventListener('input', () => { P[k] = +el.value; $(k + 'O').textContent = P[k].toFixed(2); save(); soon(); }); }
  for (const k of ['album', 'face', 'overlap']) { $(k).value = P[k]; $(k).addEventListener('change', () => { P[k] = +$(k).value; save(); build(k !== 'overlap'); }); }
  for (const k of ['type', 'dark']) { $(k).checked = P[k]; $(k).addEventListener('change', () => { P[k] = $(k).checked; save(); build(false); }); }
  $('name').value = P.name;
  $('name').addEventListener('input', () => {
    const v = $('name').value.replace(/\s+/g, ' ').trim();
    if (v && !/^[\p{L}\p{M}0-9' -]+$/u.test(v)) return;
    P.name = v; save(); clearTimeout(tm); tm = setTimeout(() => build(true), 450);
  });
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  function rewrite() { P.seed = (Math.random() * 1e6) | 0; save(); build(true); }
  $('again').addEventListener('click', rewrite);
  $('next').addEventListener('click', () => { P.album = (P.album + 1) % ALBUMS.length; $('album').value = P.album; P.seed = (Math.random() * 1e6) | 0; save(); build(true); });
  $('copy').addEventListener('click', () => {
    const txt = JSON.stringify(P);
    navigator.clipboard.writeText(txt).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => ($('copy').textContent = 'Copy settings'), 1200); }).catch(() => {});
  });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => build(false), 250); });
  build(true); requestAnimationFrame(frame);
})();
</script>
