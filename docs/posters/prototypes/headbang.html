<title>Headbang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@600&family=Grenze+Gotisch:wght@700&family=Pirata+One&family=UnifrakturCook:wght@700&display=block">
<style>
/* Layout: one full-bleed poster, the name grown into a symmetric metal-band logo (tapered, curved spikes from the letter edges, mirrored about the word's centre, melted together by Embers' blur + threshold). A quiet mono line at the foot; a settings sheet for this test only. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #8a8a8a; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(252, 252, 252, 0.96);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root.dark { --bg: #000000; --ink: #ffffff; --dim: #7c7c7c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: #8a8a8a; pointer-events: none; mix-blend-mode: difference;
}
.foot b { color: #ffffff; font-weight: 500; }
.blood .foot { mix-blend-mode: normal; color: rgba(0, 0, 0, 0.55); } .blood .foot b { color: #000000; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.row select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 3px 4px; }
.row input[type="text"] { grid-column: 1 / -1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 4px 6px; min-width: 0; }
.sub { color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="A name grown into a symmetric metal-band logo. Tap for another, drag to reshape it, hold to grow an antler, shake it to headbang."></canvas>
<div class="foot"><span><b>Headbang</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row" for="words"><span>Words (empty: an album title)</span><input type="text" id="words" maxlength="14" autocomplete="off" spellcheck="false"></label>
  <div class="acts"><button id="nextAlbum" type="button">Next album</button><button id="regrow" type="button">Grow again</button></div>
  <label class="row" for="genre"><span>Style</span><select id="genre"><option value="antler">Antlers</option><option value="death">Death (thorns)</option><option value="black">Black (roots)</option><option value="wings">Wings</option><option value="brutal">Brutal</option></select></label>
  <label class="row" for="face"><span>Letters</span><select id="face"><option value="inter">Inter Tight</option><option value="grenze">Grenze Gotisch</option><option value="pirata">Pirata One</option><option value="fraktur">UnifrakturCook</option></select></label>
  <label class="row tog" for="paper"><span>Black on white</span><input type="checkbox" id="paper"></label>
  <label class="row tog" for="axis"><span>Centre spike</span><input type="checkbox" id="axis"></label>
  <div class="sub">Spikes</div>
  <label class="row" for="pairs"><span>Spike pairs</span><output id="pairsO"></output><input type="range" id="pairs" min="0" max="200" step="1"></label>
  <label class="row" for="thorns"><span>Small thorn pairs</span><output id="thornsO"></output><input type="range" id="thorns" min="0" max="200" step="1"></label>
  <label class="row" for="len"><span>Length</span><output id="lenO"></output><input type="range" id="len" min="0.05" max="2" step="0.01"></label>
  <label class="row" for="lenVar"><span>Length variety</span><output id="lenVarO"></output><input type="range" id="lenVar" min="0" max="0.95" step="0.01"></label>
  <label class="row" for="width"><span>Base width</span><output id="widthO"></output><input type="range" id="width" min="0.01" max="0.25" step="0.005"></label>
  <label class="row" for="taper"><span>Taper</span><output id="taperO"></output><input type="range" id="taper" min="0.3" max="3" step="0.05"></label>
  <label class="row" for="wing"><span>Outer letters longer</span><output id="wingO"></output><input type="range" id="wing" min="0" max="8" step="0.1"></label>
  <div class="sub">Where they grow</div>
  <label class="row" for="up"><span>From tops</span><output id="upO"></output><input type="range" id="up" min="0" max="3" step="0.05"></label>
  <label class="row" for="down"><span>From bottoms</span><output id="downO"></output><input type="range" id="down" min="0" max="3" step="0.05"></label>
  <label class="row" for="side"><span>From outer sides</span><output id="sideO"></output><input type="range" id="side" min="0" max="3" step="0.05"></label>
  <div class="sub">Curve</div>
  <label class="row" for="curve"><span>Hook</span><output id="curveO"></output><input type="range" id="curve" min="0" max="4" step="0.05"></label>
  <label class="row" for="outward"><span>Hooks bend outward</span><output id="outwardO"></output><input type="range" id="outward" min="0" max="1" step="0.01"></label>
  <label class="row" for="wiggle"><span>Wiggle</span><output id="wiggleO"></output><input type="range" id="wiggle" min="0" max="6" step="0.05"></label>
  <label class="row" for="vert"><span>Pull to vertical</span><output id="vertO"></output><input type="range" id="vert" min="0" max="3" step="0.05"></label>
  <label class="row" for="gravity"><span>Drip (below 0: rise)</span><output id="gravityO"></output><input type="range" id="gravity" min="-1.5" max="2" step="0.01"></label>
  <label class="row" for="fan"><span>Fan out</span><output id="fanO"></output><input type="range" id="fan" min="0" max="3" step="0.05"></label>
  <div class="sub">Branches</div>
  <label class="row" for="branch"><span>Branches</span><output id="branchO"></output><input type="range" id="branch" min="0" max="6" step="0.05"></label>
  <label class="row" for="bAngle"><span>Branch angle</span><output id="bAngleO"></output><input type="range" id="bAngle" min="5" max="90" step="1"></label>
  <label class="row" for="bScale"><span>Branch width</span><output id="bScaleO"></output><input type="range" id="bScale" min="0.2" max="1" step="0.01"></label>
  <div class="sub">Antler</div>
  <label class="row tog" for="antler"><span>Antler structure</span><input type="checkbox" id="antler"></label>
  <label class="row" for="tines"><span>Tines per beam</span><output id="tinesO"></output><input type="range" id="tines" min="0" max="7" step="1"></label>
  <label class="row" for="blunt"><span>Blunt tips</span><output id="bluntO"></output><input type="range" id="blunt" min="0" max="0.8" step="0.01"></label>
  <label class="row" for="gnarl"><span>Bony bumps</span><output id="gnarlO"></output><input type="range" id="gnarl" min="0" max="0.5" step="0.01"></label>
  <label class="row" for="knuckle"><span>Knuckles</span><output id="knuckleO"></output><input type="range" id="knuckle" min="1" max="2" step="0.01"></label>
  <div class="sub">Drag: each axis drives one thing</div>
  <label class="row" for="ax"><span>Left / right</span><select id="ax"></select></label>
  <label class="row" for="ay"><span>Down / up</span><select id="ay"></select></label>
  <label class="row" for="sens"><span>Sensitivity</span><output id="sensO"></output><input type="range" id="sens" min="0.2" max="3" step="0.05"></label>
  <label class="row" for="reach"><span>Hold: node growth speed</span><output id="reachO"></output><input type="range" id="reach" min="0.3" max="4" step="0.05"></label>
  <div class="acts"><button id="untwist" type="button">Untwist</button><button id="clearNodes" type="button">Clear nodes</button></div>
  <div class="sub">Headbang (shake the phone, or scribble fast left and right)</div>
  <label class="row" for="shake"><span>Shake sensitivity</span><output id="shakeO"></output><input type="range" id="shake" min="0.4" max="3" step="0.05"></label>
  <label class="row" for="tearS"><span>Tear time (s)</span><output id="tearSO"></output><input type="range" id="tearS" min="0.15" max="3" step="0.05"></label>
  <label class="row" for="jag"><span>Serrated edge</span><output id="jagO"></output><input type="range" id="jag" min="0" max="2" step="0.05"></label>
  <label class="row" for="jolt"><span>Screen shake</span><output id="joltO"></output><input type="range" id="jolt" min="0" max="3" step="0.05"></label>
  <label class="row" for="punch"><span>Logo punch</span><output id="punchO"></output><input type="range" id="punch" min="0" max="3" step="0.05"></label>
  <label class="row" for="flash"><span>Flash</span><output id="flashO"></output><input type="range" id="flash" min="0" max="1" step="0.05"></label>
  <label class="row" for="bloodC"><span>Blood colour</span><input type="color" id="bloodC"></label>
  <div class="acts"><button id="bang" type="button">Headbang now</button></div>
  <div class="sub">Mandala fold (old kaleidoscope)</div>
  <label class="row tog" for="fold"><span>Fold into mirrors</span><input type="checkbox" id="fold"></label>
  <label class="row" for="mirrors"><span>Mirrors</span><output id="mirrorsO"></output><input type="range" id="mirrors" min="2" max="12" step="1"></label>
  <label class="row" for="pad"><span>Clear around the name</span><output id="padO"></output><input type="range" id="pad" min="0" max="0.8" step="0.01"></label>
  <div class="sub">Finish</div>
  <label class="row" for="melt"><span>Melt (Embers blur)</span><output id="meltO"></output><input type="range" id="melt" min="0" max="4" step="0.05"></label>
  <label class="row" for="soft"><span>Edge softness</span><output id="softO"></output><input type="range" id="soft" min="0.005" max="0.2" step="0.005"></label>
  <label class="row" for="size"><span>Name size</span><output id="sizeO"></output><input type="range" id="size" min="0.2" max="0.9" step="0.01"></label>
  <label class="row" for="grow"><span>Grow time (s)</span><output id="growO"></output><input type="range" id="grow" min="0.2" max="5" step="0.05"></label>
  <label class="row" for="hold"><span>Name alone first (s)</span><output id="holdO"></output><input type="range" id="hold" min="0" max="2" step="0.05"></label>
  <label class="row" for="stagger"><span>Middle → outside (s)</span><output id="staggerO"></output><input type="range" id="stagger" min="0" max="3" step="0.05"></label>
  <div class="acts"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const ALBUMS = ["Rubber Soul","Revolver","Abbey Road","Let It Be","Pet Sounds","Blue","Hejira","Thriller","Off the Wall","Purple Rain","Nevermind","In Utero","OK Computer","Kid A","Amnesiac","In Rainbows","The Bends","Graceland","Kind of Blue","Bitches Brew","A Love Supreme","Blue Train","Time Out","Mingus Ah Um","Hunky Dory","Low","Heroes","Blackstar","Let It Bleed","Sticky Fingers","Harvest","Astral Weeks","Pink Moon","Horses","Marquee Moon","Parallel Lines","London Calling","Closer","Loveless","Screamadelica","Doolittle","Surfer Rosa","Ten","Dummy","Mezzanine","Blue Lines","Homogenic","Violator","Lust for Life","Ready to Die","Aquemini","Stankonia","Parklife","Yeezus","Graduation","Blonde","Channel Orange","Frank","Back to Black","Ctrl","1989","21","Discovery","Moon Safari","Sea Change","Rain Dogs","Bone Machine","Blood Money","Closing Time","Geogaddi","Inferno","SOS","GNX","DAMN","ye","Demon Days","Plastic Beach","Donuts","Half Moon Bay","On the Beach","Harvest Moon","Wish","Bryter Layter","Dream River","Skeleton Tree","Play","Cheat Codes","Wildflower","Odelay","Mutations","Fun House","The Idiot","Old Ideas","Dirt","Stony Hill","Third","Giant Steps","Ascension","Knock Knock","Person Pitch","Treasure","Endless Summer","X's","Black Earth","Raw Power","Longing","18","Black One","Travel","Bleed","Piñata","Mosaic","Venice","Meditations","Natty Dread","Uprising","Squared Roots","Small Change","Blue Valentine","Alice","Bad as Me","Real Gone","Hi Scores","Sun","Ruff Draft","Talkie Walkie","Homework","Go","Sleep","Drumming","The Blueprint"];
let album = ALBUMS[Math.floor(Math.random() * ALBUMS.length)];
const nextAlbum = () => { let a; do a = ALBUMS[Math.floor(Math.random() * ALBUMS.length)]; while (a === album); album = a; };
const WORDS_OK = /^[\p{L}\p{M}0-9' -]+$/u; // same rule as the site's names (src/name.js)
const text = () => (P.words && WORDS_OK.test(P.words.trim()) ? P.words : album).replace(/\s+/g, ' ').trim();

// Styles: each sets the spike sliders. Lengths and widths are in cap heights.
const GENRES = {
  // antlers: a slow-tapering main beam with tines on its upper side, knuckles at the joints, a burr at the base, blunt tips, bony bumps
  // Idan's tuning, 5 Nov 2026
  antler: { pairs: 193, thorns: 9, len: 2, lenVar: 0.63, width: 0.085, taper: 0.6, wing: 1.5, up: 1.05, down: 0.3, side: 2.05, curve: 0.85, outward: 1, wiggle: 0.25, vert: 0.7, gravity: 0.73, fan: 0.45, branch: 0, bAngle: 48, bScale: 0.72, melt: 0.9, antler: true, tines: 3, blunt: 0.28, gnarl: 0.12, knuckle: 1.25 },
  death: { pairs: 48, thorns: 60, len: 0.85, lenVar: 0.6, width: 0.1, taper: 1.2, wing: 3, up: 1, down: 0.8, side: 0.7, curve: 1.1, outward: 0.8, wiggle: 0.5, vert: 0.6, gravity: 0, fan: 0.35, branch: 1.2, bAngle: 34, bScale: 0.55, melt: 0.6 },
  black: { pairs: 80, thorns: 20, len: 0.75, lenVar: 0.8, width: 0.05, taper: 0.9, wing: 1.2, up: 0.8, down: 1.6, side: 0.3, curve: 0.3, outward: 0.5, wiggle: 2.4, vert: 1.2, gravity: 0.35, fan: 0.1, branch: 2.6, bAngle: 24, bScale: 0.6, melt: 1.2 },
  wings: { pairs: 16, thorns: 30, len: 0.8, lenVar: 0.5, width: 0.1, taper: 1.4, wing: 5, up: 1, down: 0.5, side: 1.2, curve: 1.6, outward: 1, wiggle: 0.3, vert: 0.2, gravity: 0, fan: 1.1, branch: 1, bAngle: 40, bScale: 0.5, melt: 1.8 },
  brutal: { pairs: 147, thorns: 178, len: 0.97, lenVar: 0.9, width: 0.155, taper: 1.9, wing: 8, up: 0.8, down: 1.75, side: 1.45, curve: 0.95, outward: 0.64, wiggle: 3, vert: 0.65, gravity: 0.71, fan: 0.9, branch: 2.9, bAngle: 45, bScale: 0.6, melt: 2.4 },
};
for (const g in GENRES) GENRES[g] = Object.assign({ antler: false, tines: 3, blunt: 0, gnarl: 0, knuckle: 1 }, GENRES[g]);
const DEF = Object.assign({ words: '', genre: 'antler', face: 'pirata', paper: false, axis: true, fold: false, mirrors: 6, pad: 0.18, ax: 'curve', ay: 'rise', sens: 1, reach: 1.4, tearS: 0.45, jag: 0.5, jolt: 1, punch: 1, flash: 1, shake: 2.3, blood: '#a3080c', soft: 0.04, size: 0.5, grow: 1.6, hold: 0.7, stagger: 1.2 }, GENRES.antler);
const P = Object.assign({}, DEF);
try { Object.assign(P, JSON.parse(localStorage.getItem('metal-logo-2') || '{}')); } catch (e) { /* defaults */ }
const save = () => { try { localStorage.setItem('metal-logo-2', JSON.stringify(P)); } catch (e) { /* fine */ } };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FACES = { inter: '600 S "Inter Tight"', grenze: '700 S "Grenze Gotisch"', pirata: '400 S "Pirata One"', fraktur: '700 S "UnifrakturCook"' };
const fontOf = (s) => FACES[P.face].replace('S', s + 'px') + ', "Helvetica Neue", Arial, sans-serif';
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(Date.now());

const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float');
let W = 0, H = 0, dpr = 1;
let F = null; // { sd, gw, gh, gs, cap, cx, hw, edges, mask }

// ---------- the shape: text mask -> signed distance field (Felzenszwalb EDT, as Embers), in CSS px ----------
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s;
    do { const r = v[k]; s = ((f[q] + q * q) - (f[r] + r * r)) / (2 * q - 2 * r); } while (s <= z[k] && --k >= 0);
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const r = v[k]; d[q] = (q - r) * (q - r) + f[r]; }
}
function edt(grid, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = grid[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = grid[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) grid[y * w + x] = d[x]; }
}
function field() {
  const t = text();
  // the full-resolution mask (drawn into the logo as its letters)
  const m = document.createElement('canvas'); m.width = cv.width; m.height = cv.height;
  const mx = m.getContext('2d');
  mx.font = fontOf(200);
  const mH = mx.measureText('H'), cap200 = mH.actualBoundingBoxAscent;
  const mt = mx.measureText(t), tw200 = mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight;
  // a metal logo is one line; leave room around it for the spikes
  const k = Math.min(P.size * W / tw200, 0.17 * H / cap200);
  const fs = 200 * k, cap = cap200 * k;
  const left = W / 2 - tw200 * k / 2 + mt.actualBoundingBoxLeft * k; // draw so the ink box is centred
  const base = H / 2 + cap / 2;
  mx.setTransform(dpr, 0, 0, dpr, 0, 0); mx.font = fontOf(fs); mx.fillStyle = '#fff'; mx.textBaseline = 'alphabetic';
  mx.fillText(t, left, base);
  // the distance field, half resolution
  const gs = 0.5, gw = Math.ceil(W * gs), gh = Math.ceil(H * gs);
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(gs, 0, 0, gs, 0, 0); x.font = fontOf(fs); x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  x.fillText(t, left, base);
  const a = x.getImageData(0, 0, gw, gh).data;
  const n = gw * gh, o = new Float64Array(n), ii = new Float64Array(n), sd = new Float32Array(n);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < n; i++) {
    const inside = a[i * 4 + 3] > 127; o[i] = inside ? 0 : 1e20; ii[i] = inside ? 1e20 : 0;
    if (inside) { const cx = (i % gw) / gs, cy = ((i / gw) | 0) / gs; x0 = Math.min(x0, cx); x1 = Math.max(x1, cx); y0 = Math.min(y0, cy); y1 = Math.max(y1, cy); }
  }
  edt(o, gw, gh); edt(ii, gw, gh);
  for (let i = 0; i < n; i++) sd[i] = (o[i] > 0 ? Math.sqrt(o[i]) - 0.5 : 0.5 - Math.sqrt(ii[i])) / gs;
  F = { sd, gw, gh, gs, cap, mask: m, cx: (x0 + x1) / 2 + 1 / gs / 2, hw: Math.max(1, (x1 - x0) / 2), top: y0, bot: y1 };
  // edge cells just inside the ink, with their outward normals
  const edges = [];
  for (let i = 0; i < n; i++) {
    if (sd[i] > -2.2 && sd[i] <= -0.2) {
      const ex = ((i % gw) + 0.5) / gs, ey = (((i / gw) | 0) + 0.5) / gs;
      sample(ex, ey); edges.push({ x: ex, y: ey, nx: SG[0], ny: SG[1] });
    }
  }
  F.edges = edges;
}
let SG = [0, 0];
function sample(px, py) {
  const g = F, fx = clamp(px * g.gs - 0.5, 0, g.gw - 1.001), fy = clamp(py * g.gs - 0.5, 0, g.gh - 1.001);
  const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0, i = y0 * g.gw + x0, s = g.sd;
  const a = s[i], b = s[i + 1], c = s[i + g.gw], d = s[i + g.gw + 1];
