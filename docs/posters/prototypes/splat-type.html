<title>Splat Type</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed poster; a quiet mono line at the foot; a settings sheet that only exists for this test. */
:root {
  --bg: #ffffff; --ink: #000000; --dim: #707070; --line: rgba(0, 0, 0, 0.14); --sheet: rgba(255, 255, 255, 0.96);
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --dim: #8c8c8c; --line: rgba(255, 255, 255, 0.16); --sheet: rgba(8, 8, 8, 0.96); color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden; font: 400 12px/1.35 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  color: var(--dim); pointer-events: none;
}
.foot b { color: var(--ink); font-weight: 500; }
.foot button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 12px; color: var(--ink);
  max-height: calc(100% - 80px); overflow: auto;
}
.sheet[hidden] { display: none; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.row output { font-variant-numeric: tabular-nums; color: var(--dim); }
.row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
.row.tog { grid-template-columns: 1fr auto; }
.row.tog input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.acts { display: flex; gap: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts button { color: var(--dim); } .acts button:hover { color: var(--ink); }
</style>

<canvas id="c" aria-label="Idan Segev, as thousands of soft splats. Touch it to scatter them."></canvas>
<div class="foot"><span><b>Splat type</b> &nbsp;draft</span><button id="gear" type="button" aria-expanded="false" aria-controls="sheet">Settings</button></div>
<div class="sheet" id="sheet" hidden>
  <label class="row tog" for="settle"><span>Dust settles back into the letters</span><input type="checkbox" id="settle" checked></label>
  <label class="row tog" for="breath"><span>A passing pointer breathes on it</span><input type="checkbox" id="breath" checked></label>
  <label class="row tog" for="colour"><span>Colour (the rare easter egg)</span><input type="checkbox" id="colour"></label>
  <label class="row" for="reach"><span>Reach of a touch</span><output id="reachO"></output><input type="range" id="reach" min="60" max="420" step="5" value="115"></label>
  <label class="row" for="force"><span>Force</span><output id="forceO"></output><input type="range" id="force" min="100" max="2400" step="20" value="2100"></label>
  <label class="row" for="back"><span>How fast it settles</span><output id="backO"></output><input type="range" id="back" min="0.2" max="6" step="0.1" value="1.2"></label>
  <label class="row" for="grain"><span>Splats (fewer, coarser ↔ more, finer)</span><output id="grainO"></output><input type="range" id="grain" min="0.3" max="2.5" step="0.05" value="1.85"></label>
  <div class="acts"><button id="reset" type="button">Back to the letters</button><button id="copy" type="button">Copy settings</button></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: false });
  if (!gl) { document.querySelector('.foot span').textContent = 'This needs WebGL2.'; return; }
  const $ = (id) => document.getElementById(id);
  const P = { settle: true, breath: true, colour: false, reach: 115, force: 2100, back: 1.2, grain: 1.85 };
  try { Object.assign(P, JSON.parse(localStorage.getItem('splat-type-v2') || '{}')); } catch (e) { /* no storage: defaults */ }
  const save = () => { try { localStorage.setItem('splat-type-v2', JSON.stringify(P)); } catch (e) { /* fine */ } };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- shaders: one soft gaussian per splat, stretched along its flight ----------
  const VS = `#version 300 es
  layout(location=0) in vec2 aC;
  layout(location=1) in vec4 iA;      // x, y (css px), vx, vy (px/s)
  layout(location=2) in vec4 iB;      // radius (px), opacity, rest angle, rest aspect
  uniform vec2 uRes;
  out vec2 vU; out float vO; out float vT;
  void main() {
    vec2 v = iA.zw; float sp = length(v);
    float m = smoothstep(8.0, 90.0, sp);
    vec2 rest = vec2(cos(iB.z), sin(iB.z));
    vec2 dir = normalize(mix(rest, sp > 1e-3 ? v / sp : rest, m) + vec2(1e-5, 0.0));
    vec2 nrm = vec2(-dir.y, dir.x);
    float st = 1.0 + m * min(sp / 260.0, 3.5);
    float r = iB.x * 1.9;
    vec2 p = iA.xy + dir * aC.x * r * st + nrm * aC.y * r * mix(iB.w, 1.0, m) / sqrt(st);
    vU = aC; vO = iB.y * mix(1.0, 0.75, m); vT = p.y / uRes.y;
    gl_Position = vec4(p.x / uRes.x * 2.0 - 1.0, 1.0 - p.y / uRes.y * 2.0, 0.0, 1.0);
  }`;
  const FS = `#version 300 es
  precision mediump float;
  in vec2 vU; in float vO; in float vT;
  uniform vec3 uInk; uniform float uCol; uniform vec3 uG[6];
  out vec4 o;
  vec3 grad(float t) {
    t = clamp(t, 0.0, 1.0);
    if (t < 0.24) return mix(uG[0], uG[1], t / 0.24);
    if (t < 0.46) return mix(uG[1], uG[2], (t - 0.24) / 0.22);
    if (t < 0.54) return mix(uG[2], uG[3], (t - 0.46) / 0.08);
    if (t < 0.77) return mix(uG[3], uG[4], (t - 0.54) / 0.23);
    return mix(uG[4], uG[5], (t - 0.77) / 0.23);
  }
  void main() {
    float a = exp(-dot(vU, vU) * 4.2) * vO;
    if (a < 0.003) discard;
    vec3 c = mix(uInk, grad(vT), uCol);
    o = vec4(c * a, a);
  }`;
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  const U = (n) => gl.getUniformLocation(prog, n);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const bufA = gl.createBuffer(), bufB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bufA); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufB); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(2, 1);

  // the palettes of the site's colour easter egg: bright on a dark page, deeper on a light one (North Sea)
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  const PAL = { dark: ['#2ee6ff', '#6fe0a0', '#d4f01a', '#ff4fe0', '#ff5a9a', '#ff6b5e'], light: ['#0a7fb5', '#0f9d8a', '#4a9a1a', '#c2185b', '#e0455a', '#e8652e'] };

  // ---------- the splats ----------
  let W = 1, H = 1, N = 0, X, Y, VX, VY, HX, HY, A, B, ink = [0, 0, 0], dark = false, awake = 0;
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const v = cs.getPropertyValue('--ink').trim(); ink = hex(v.length === 7 ? v : '#000000');
    const bg = cs.getPropertyValue('--bg').trim(); dark = bg === '#000000';
  }
  async function build() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    try { await Promise.race([document.fonts.load('900 100px Archivo'), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* fallback face */ }
    // the type, as a mask
    const m = document.createElement('canvas'); m.width = Math.ceil(W); m.height = Math.ceil(H);
    const x = m.getContext('2d', { willReadFrequently: true });
    const portrait = W / H < 0.8, lines = portrait ? ['IDAN', 'SE', 'GEV'] : ['IDAN', 'SEGEV'];
    x.font = '900 100px ' + getComputedStyle(document.documentElement).getPropertyValue('--display');
    const widest = Math.max(...lines.map((l) => x.measureText(l).width));
    const size = Math.min(W * 0.84 / widest * 100, H * (portrait ? 0.22 : 0.34));
    x.font = '900 ' + size + 'px ' + getComputedStyle(document.documentElement).getPropertyValue('--display');
    x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillStyle = '#000';
    const lead = size * 0.93, top = H / 2 - (lines.length * lead) / 2 + size * 0.78 - H * 0.02;
    lines.forEach((l, i) => x.fillText(l, W / 2, top + i * lead));
    const d = x.getImageData(0, 0, m.width, m.height).data, MW = m.width;
    const inside = (px, py) => px >= 0 && py >= 0 && px < MW && py < m.height && d[((py | 0) * MW + (px | 0)) * 4 + 3] > 128;
    let area = 0; for (let i = 3; i < d.length; i += 4 * 9) if (d[i] > 128) area += 9;
    N = Math.round(Math.min(reduced ? 40000 : 110000, Math.max(9000, area * 0.42 * P.grain)));
    X = new Float32Array(N); Y = new Float32Array(N); VX = new Float32Array(N); VY = new Float32Array(N); HX = new Float32Array(N); HY = new Float32Array(N);
    A = new Float32Array(N * 4); B = new Float32Array(N * 4);
    const out = (px, py, r) => { for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; if (!inside(px + Math.cos(a) * r, py + Math.sin(a) * r)) return true; } return false; };
    const RADII = [1.5, 3, 5, 8, 12, 17, 24];
    let n = 0, guard = 0;
    while (n < N && guard++ < N * 60) {
      const px = Math.random() * W, py = Math.random() * H; if (!inside(px, py)) continue;
      let dist = 26; for (const rr of RADII) if (out(px, py, rr)) { dist = rr; break; }      // how deep inside: a splat never reaches past the edge
      const r = Math.max(0.45, Math.min(dist / 1.9, (0.6 + Math.random() * 0.4) * (dist < 3 ? 1 : (3 + Math.random() * 6) / Math.sqrt(P.grain))));
      X[n] = HX[n] = px; Y[n] = HY[n] = py;
      B[n * 4] = r; B[n * 4 + 1] = dist < 3 ? 0.55 + Math.random() * 0.35 : 0.35 + Math.random() * 0.4; B[n * 4 + 2] = Math.random() * Math.PI; B[n * 4 + 3] = 0.45 + Math.random() * 0.55;
      n++;
    }
    N = n;
    gl.bindBuffer(gl.ARRAY_BUFFER, bufB); gl.bufferData(gl.ARRAY_BUFFER, B.subarray(0, N * 4), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufA); gl.bufferData(gl.ARRAY_BUFFER, A.byteLength, gl.DYNAMIC_DRAW);
    awake = 1;
  }

  // ---------- touch ----------
  // A press throws the dust near it outward (a few grains far, most a little); a drag pushes along; a passing pointer breathes on it.
  function blow(px, py, R, F, dirx, diry, along) {
    const R2 = R * R;
    for (let i = 0; i < N; i++) {
      const dx = X[i] - px, dy = Y[i] - py, dd2 = dx * dx + dy * dy; if (dd2 > R2) continue;
      const dd = Math.sqrt(dd2) || 1, f = Math.pow(1 - dd / R, 1.3), k = Math.random(), s = F * f * (0.25 + k * k * 1.6);
      let ux = dx / dd, uy = dy / dd;
      if (along) { ux = ux * 0.35 + dirx * 0.65; uy = uy * 0.35 + diry * 0.65; }
      VX[i] += ux * s + (Math.random() - 0.5) * s * 0.5; VY[i] += uy * s + (Math.random() - 0.5) * s * 0.5 - f * F * 0.08;
    }
    awake = 1;
  }
  let down = null, last = null;
  cv.addEventListener('pointerdown', (e) => {
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    down = { x: e.clientX, y: e.clientY }; last = { x: e.clientX, y: e.clientY, t: performance.now() };
    blow(e.clientX, e.clientY, P.reach, P.force * (reduced ? 0.4 : 1), 0, 0, false);
  });
  cv.addEventListener('pointermove', (e) => {
    const now = performance.now();
    if (!last) { last = { x: e.clientX, y: e.clientY, t: now }; return; }
    const dx = e.clientX - last.x, dy = e.clientY - last.y, dt = Math.max(8, now - last.t) / 1000, sp = Math.hypot(dx, dy) / dt;
    last = { x: e.clientX, y: e.clientY, t: now };
    if (sp < 30) return;
    const ux = dx / (Math.hypot(dx, dy) || 1), uy = dy / (Math.hypot(dx, dy) || 1);
    if (down) blow(e.clientX, e.clientY, P.reach * 0.6, Math.min(sp, 2600) * 0.5 * (P.force / 1100), ux, uy, true);          // a drag pushes the dust along
    else if (P.breath && e.pointerType === 'mouse') blow(e.clientX, e.clientY, P.reach * 0.42, Math.min(sp, 2400) * 0.09 * (P.force / 1100), ux, uy, true);   // a breath
  });
  const up = () => { down = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (!down) last = null; });

  // ---------- the frame ----------
  let pull = 0;                                           // > 0 while "Back to the letters" is pulling everything home
  let t0 = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - t0) / 1000); t0 = now;
    const k = (P.settle || pull > 0 ? (pull > 0 ? 9 : P.back * P.back) : 0), damp = P.settle || pull > 0 ? 2 * Math.sqrt(k) * 0.95 + 1.2 : 5.5;
    if (pull > 0) pull -= dt;
    let moving = 0;
    if (awake) {
      const e = Math.exp(-damp * dt);
      for (let i = 0; i < N; i++) {
        let vx = VX[i], vy = VY[i];
        if (k) { vx += (HX[i] - X[i]) * k * dt; vy += (HY[i] - Y[i]) * k * dt; }
        vx *= e; vy *= e;
        if (Math.abs(vx) + Math.abs(vy) < 0.5 && (!k || Math.abs(HX[i] - X[i]) + Math.abs(HY[i] - Y[i]) < 0.3)) { vx = vy = 0; if (k) { X[i] = HX[i]; Y[i] = HY[i]; } }
        else moving++;
        X[i] += vx * dt; Y[i] += vy * dt; VX[i] = vx; VY[i] = vy;
        const o = i * 4; A[o] = X[i]; A[o + 1] = Y[i]; A[o + 2] = vx; A[o + 3] = vy;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, bufA); gl.bufferSubData(gl.ARRAY_BUFFER, 0, A, 0, N * 4);
      awake = moving > 0 || pull > 0 ? 1 : 0;
      draw();
    }
    requestAnimationFrame(frame);
  }
  function draw() {
    gl.viewport(0, 0, cv.width, cv.height);
    const bg = dark ? 0 : 1; gl.clearColor(bg, bg, bg, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniform2f(U('uRes'), W, H); gl.uniform3fv(U('uInk'), ink); gl.uniform1f(U('uCol'), P.colour ? 1 : 0);
    gl.uniform3fv(U('uG[0]'), new Float32Array(PAL[dark ? 'dark' : 'light'].flatMap(hex)));
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
  }

  // ---------- settings (for this test only) ----------
  const fmt = { reach: (v) => v + ' px', force: (v) => v, back: (v) => (+v).toFixed(1), grain: (v) => '×' + (+v).toFixed(2) };
  for (const key of ['settle', 'breath', 'colour']) { $(key).checked = !!P[key]; $(key).addEventListener('change', () => { P[key] = $(key).checked; save(); awake = 1; if (key === 'settle' && P.settle) awake = 1; }); }
  for (const key of ['reach', 'force', 'back', 'grain']) {
    $(key).value = P[key]; $(key + 'O').textContent = fmt[key](P[key]);
    $(key).addEventListener('input', () => { P[key] = +$(key).value; $(key + 'O').textContent = fmt[key](P[key]); save(); if (key === 'grain') rebuild(); });
  }
  $('gear').addEventListener('click', () => { const s = $('sheet'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', String(!s.hidden)); });
  $('reset').addEventListener('click', () => { pull = 1.6; awake = 1; });
  $('copy').addEventListener('click', () => {
    const text = JSON.stringify(P, null, 2);
    navigator.clipboard.writeText(text).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1600); })
      .catch(() => { $('copy').textContent = 'Copy blocked'; setTimeout(() => { $('copy').textContent = 'Copy settings'; }, 1600); });
  });
  let rt = 0; const rebuild = () => { clearTimeout(rt); rt = setTimeout(() => build().then(draw), 180); };
  addEventListener('resize', rebuild);
  const mq = matchMedia('(prefers-color-scheme: dark)'); const retheme = () => { readTheme(); awake = 1; draw(); };
  mq.addEventListener('change', retheme); new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  readTheme();
  build().then(() => { draw(); requestAnimationFrame(frame); });
})();
</script>
